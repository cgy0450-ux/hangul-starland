const q=new URLSearchParams(location.search),mode=q.get('mode')==='english'?'english':'numbers',words=['CAT','DOG','SUN','CAR','BUS','RED','BLUE','PEN','GO','HI','ONE','TWO'],groups=Array.from({length:10},(_,i)=>({label:(i*10+1)+'~'+((i+1)*10),values:Array.from({length:10},(_,j)=>i*10+j+1)}));const opts=mode==='english'?words:groups;
document.getElementById('home').href='./academy.html?subject='+(mode==='english'?'english':'math');document.getElementById('title').textContent=mode==='english'?'🔤 영어 단어 쓰기':'🔢 숫자 쓰기';document.getElementById('headline').textContent=mode==='english'?'좋아하는 영어 단어를 써보자!':'숫자를 천천히 따라 써보자!';document.getElementById('note').textContent=mode==='english'?'짧은 영어 단어와 대문자부터 시작해요.':'1~10부터 91~100까지, 10개씩 이어서 따라 써요.';
const koreanNums=['영','일','이','삼','사','오','육','칠','팔','구','십'];function koreanNum(n){if(n<=10)return koreanNums[n];if(n===100)return'백';if(n%10===0)return(koreanNums[n/10]==='일'?'':koreanNums[n/10])+'십';const tens=Math.floor(n/10),units=n%10;return(tens===1?'':koreanNums[tens])+'십'+koreanNums[units];}
function voice(t){try{if(JSON.parse(localStorage.getItem("hangul-starland-v1")||"{}").sound===false)return;}catch(e){}if(!('speechSynthesis'in window))return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang=mode==='english'?'en-US':'ko-KR';u.rate=.86;u.pitch=1.03;const v=speechSynthesis.getVoices().filter(x=>x.lang.startsWith(u.lang.slice(0,2)));u.voice=v.find(x=>/natural|neural|google/i.test(x.name))||v[0]||null;speechSynthesis.speak(u);}catch(e){}}

const letters={
A:['M148 77 L87 225','M148 77 L211 225','M108 174 L189 174'],B:['M108 78 L108 226','M109 78 Q224 69 208 135 Q201 153 110 153','M110 153 Q225 150 207 206 Q201 232 110 226'],C:['M208 95 Q153 49 107 96 Q75 128 99 194 Q147 247 207 207'],D:['M106 78 L106 226','M106 78 Q227 74 219 153 Q219 232 106 226'],E:['M105 78 L105 226','M105 78 L212 78','M105 153 L188 153','M105 226 L212 226'],F:['M109 78 L109 226','M109 78 L215 78','M109 153 L192 153'],G:['M209 101 Q157 56 107 102 Q73 147 108 201 Q143 250 209 211 L209 153 L161 153'],H:['M104 77 L104 226','M206 77 L206 226','M105 151 L204 151'],I:['M154 78 L154 227'],J:['M204 78 L204 194 Q196 241 117 208'],K:['M105 78 L105 226','M205 78 L106 153','M106 153 L216 226'],L:['M107 78 L107 226 L207 226'],M:['M87 78 L87 226','M87 78 L154 172','M221 78 L154 172','M221 78 L221 226'],N:['M104 78 L104 226','M104 78 L211 226','M211 78 L211 226'],O:['M154 77 C74 77 74 228 154 228 C234 228 234 77 154 77'],P:['M105 78 L105 226','M105 78 L165 78 Q236 82 212 132 Q194 161 105 157'],Q:['M154 77 C74 77 74 228 154 228 C234 228 234 77 154 77','M176 191 L224 237'],R:['M105 78 L105 226','M105 78 L165 78 Q235 80 208 136 Q194 157 105 157','M155 160 L215 226'],S:['M206 94 Q161 60 114 91 Q90 124 154 150 Q238 184 190 215 Q151 245 102 212'],T:['M89 78 L219 78','M154 78 L154 227'],U:['M101 79 L101 182 Q103 229 154 229 Q208 229 208 181 L208 79'],V:['M99 78 L154 229','M212 78 L154 229'],W:['M83 79 L113 227 L154 129 L191 227 L224 78'],X:['M100 78 L209 225','M209 78 L100 225'],Y:['M95 78 L155 150','M215 78 L155 150','M155 150 L155 226'],Z:['M99 78 L211 78 L101 226 L215 226']};
let selection=null,index=0,trace=[],drawn=[],down=false,last=null;const $=s=>document.getElementById(s);
const svgNS='http://www.w3.org/2000/svg';function createSvg(tag,attrs){const e=document.createElementNS(svgNS,tag);for(const [k,v]of Object.entries(attrs))e.setAttribute(k,v);return e;}

function glyphs(value){
 const chars=[...String(value)],len=chars.length,scale=len===1?1:len===2?.86:.59,span=len===1?0:len===2?215:157;
 const extent=span*(len-1)+210*scale,base=(600-extent)/2;
 return chars.map((c,i)=>({ox:base+i*span,scale,paths:mode==='english'?(letters[c]||letters.I):digit[c]}));
}
function drawGuide(value){
 const guide=$('guide');guide.innerHTML='';
 guide.setAttribute('viewBox',mode==='english'?'0 0 300 300':'0 0 600 300');
 let result=[],number=0;
 for(const g of mode==='english'?[{ox:0,scale:1,paths:letters[value]||letters.I}]:glyphs(value)){
 const container=createSvg('g',{transform:'translate('+g.ox+' 0) scale('+g.scale+')'});guide.appendChild(container);
 for(const d of g.paths){
 number++;const path=createSvg('path',{d,fill:'none',stroke:'#b5b2cc','stroke-width':17,'stroke-linecap':'round','stroke-dasharray':'2 21'});
 container.appendChild(path);const length=path.getTotalLength(),first=path.getPointAtLength(0),ahead=path.getPointAtLength(Math.min(28,length));
 result.push({path,length,ox:g.ox,scale:g.scale});
 container.appendChild(createSvg('circle',{cx:first.x,cy:first.y,r:15,fill:'#fff09a',stroke:'#ec8d55','stroke-width':3}));
 const t=createSvg('text',{x:first.x,y:first.y+6,'text-anchor':'middle','font-size':19,'font-weight':900,fill:'#7a3e93'});t.textContent=number;container.appendChild(t);
 const angle=Math.atan2(ahead.y-first.y,ahead.x-first.x),x=first.x+40*Math.cos(angle),y=first.y+40*Math.sin(angle);
 container.appendChild(createSvg('path',{d:'M'+x+' '+y+' l'+(-14*Math.cos(angle-.4))+' '+(-14*Math.sin(angle-.4))+' M'+x+' '+y+' l'+(-14*Math.cos(angle+.4))+' '+(-14*Math.sin(angle+.4)),fill:'none',stroke:'#ed665b','stroke-width':5}));
 }
 }
 return result;
}
let guidePaths=[];function resetCanvas(){const canvas=$('ink'),rect=canvas.getBoundingClientRect(),scale=window.devicePixelRatio||1;canvas.width=Math.round(rect.width*scale);canvas.height=Math.round(rect.height*scale);const ctx=canvas.getContext('2d');ctx.scale(scale,scale);ctx.lineCap='round';ctx.lineJoin='round';ctx.lineWidth=Math.max(10,rect.width/21);ctx.strokeStyle='#5a64dc';trace=[];drawn=[];}

function value(){return mode==='numbers'?selection[index]:[...String(selection)][index];}
function show(){
 const v=value();$('menu').classList.add('hidden');$('practice').classList.add('active');
 $('target').textContent=v;$('reading').textContent=(mode==='english'?'영어 단어':'숫자')+' 읽기: '+(mode==='english'?selection:koreanNum(Number(v)));
 $('progress').textContent=(index+1)+' / '+(mode==='numbers'?selection.length:[...String(selection)].length);
 $('feedback').textContent='';
 $('ink').parentElement.classList.toggle('english',mode==='english');
 guidePaths=drawGuide(String(v));requestAnimationFrame(resetCanvas);
 voice(mode==='english'?selection:koreanNum(Number(v)));
}
function pick(v){selection=mode==='numbers'?v.values:v;index=0;show();}
$('choices').innerHTML=opts.map((v,i)=>'<button class="pick '+(mode==='english'?'word':'group')+'" style="--col:'+['#fff1d6','#e5f8ff','#e9ffea','#fbeaff'][i%4]+'" data-i="'+i+'">'+(mode==='english'?v:v.label)+'</button>').join('');
$('choices').onclick=e=>{const b=e.target.closest('[data-i]');if(b)pick(opts[+b.dataset.i]);};
const canvas=$('ink');function toLocal(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left),y:(e.clientY-r.top)};}
canvas.addEventListener('pointerdown',e=>{down=true;last=toLocal(e);drawn.push([last]);canvas.setPointerCapture(e.pointerId);e.preventDefault();});
canvas.addEventListener('pointermove',e=>{if(!down)return;const p=toLocal(e),ctx=canvas.getContext('2d');ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();drawn[drawn.length-1].push(p);last=p;e.preventDefault();});
canvas.addEventListener('pointerup',()=>down=false);canvas.addEventListener('pointercancel',()=>down=false);

function coverage(){
 const rect=canvas.getBoundingClientRect(),points=drawn.flat();
 if(!points.length)return 0;
 const vw=mode==='english'?300:600;
 return Math.min(...guidePaths.map(part=>{
 let hit=0,total=0;
 for(let j=0;j<=Math.ceil(part.length/9);j++){
 const p=part.path.getPointAtLength(part.length*j/Math.ceil(part.length/9));
 const x=(part.ox+part.scale*p.x)*rect.width/vw,y=part.scale*p.y*rect.height/300;total++;
 if(points.some(q=>Math.hypot(x-q.x,y-q.y)<Math.max(15,rect.height*.10)))hit++;
 }
 return total?hit/total:0;
 }));
}
$('check').onclick=()=>{
 if(coverage()<.43){$('feedback').textContent='점선을 좀 더 따라 써볼까? 💛';voice('조금만 더 따라 써봐요.');return;}
 const total=mode==='numbers'?selection.length:[...String(selection)].length;
 if(index<total-1){index++;show();}
 else{
 $('feedback').textContent='🌟 와아! 모두 잘 썼어요!';voice('참 잘했어요!');
 try{const key='joiland-writing-'+mode,prev=JSON.parse(localStorage.getItem(key)||'[]'),mark=mode==='numbers'?selection[0]+'-'+selection.at(-1):selection;if(!prev.includes(mark)){prev.push(mark);localStorage.setItem(key,JSON.stringify(prev));}}catch(e){}
 $('check').disabled=true;setTimeout(()=>{$('check').disabled=false;$('practice').classList.remove('active');$('menu').classList.remove('hidden');},1250);
 }
};

if(mode==='numbers' && q.has('lesson')){
