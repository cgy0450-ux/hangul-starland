<style>

.rescue-tools{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;max-width:580px;width:100%;margin:0 auto}.rescue-tools button{background:linear-gradient(155deg,#e6faff,#fff3d7);color:#63449e;border:3px solid #fff;border-radius:15px;padding:9px 3px;font-weight:900;font-size:clamp(11px,2.9vw,15px);box-shadow:0 3px 0 #bdaedc}.rescue-tools button:disabled{opacity:.48}.rescue-book{max-width:580px;width:100%;margin:0 auto;display:flex;gap:7px;justify-content:space-between;align-items:center;background:#fff9dc;border:3px solid #fff;border-radius:15px;padding:7px 10px;font-size:clamp(11px,2.7vw,14px);font-weight:900}.rescue-book span{font-size:20px}@media(max-height:750px){.rescue-book{padding:3px 6px}.rescue-tools button{padding:6px 2px}.scene{max-height:52dvh}}@media(max-height:540px) and (min-width:650px){

 .scene{grid-column:1;grid-row:1/6;width:auto;height:min(calc(100dvh - 62px),350px);max-height:none;min-height:0;aspect-ratio:400/570;justify-self:center}
 .info{grid-column:2;grid-row:1}.status{grid-column:2;grid-row:2}.progress{grid-column:2;grid-row:3;height:10px}

 .rescue-book span{font-size:16px}.pill{font-size:12px}
}</style></head><body>
<header><a href="./requests.html" aria-label="요청 놀이터로 돌아가기">‹ 놀이터</a><h1>🚒 출동! 소방차 구조대</h1><button id="sound" aria-label="음성 켜기 또는 끄기">🔊</button></header>
<main>
<div class="info"><span class="pill" id="level">🚨 현장 1 / 5</span><span class="pill" id="score">🌟 구조 0개</span></div>
<div class="status" id="status" role="status" aria-live="polite">불꽃을 손가락으로 누르면 물이 나와요!</div><div class="progress" aria-label="현재 현장 소화 진행도"><div class="progress-fill" id="progress"></div></div>
<div class="scene" id="scene"><canvas id="game" aria-label="손가락으로 불꽃을 조준해서 소방차 물로 불을 끄는 게임"></canvas><div class="overlay" id="overlay"><div class="modal"><span class="hero" id="hero">🚒🐯🔥</span><h2 id="modalTitle">쪼이 소방대 출동!</h2><p id="modalText">불꽃을 손가락으로 누르고 있으면 소방차에서 물이 나와요. 모두 끄고 친구들을 구해 주세요!</p><button id="start">🚨 출동하기!</button></div></div></div>
<div class="rescue-tools" aria-label="소방 구조 장비"><button id="hydrant">🚰 소화전 연결</button><button id="helicopter">🚁 헬리콥터 지원</button><button id="ladder">🪜 구조 사다리</button></div>
<div class="rescue-book" id="book"><strong>📒 구조한 동물 친구</strong><span id="friends">아직 구조한 친구가 없어요</span></div>
<div class="controls"><button id="pause">⏸ 잠깐 쉬기</button><button id="spray" aria-label="조준 중인 곳에 물 뿌리기">💦 물 뿌리기</button><button id="restart">↻ 다시 출동</button></div>
<p class="instructions">👆 불꽃을 손가락으로 누른 채 움직여요! 불이 꺼져도 다시 나타나지 않아요.</p>
</main>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),scene=$('scene'),canvas=$('game'),ctx=canvas.getContext('2d');
const W=400,H=570;
const STAGES=[
 {name:'우리 동네 집',buildings:[{x:48,y:194,w:150,h:230,color:'#ffc7a8',roof:'#e67b7d'},{x:226,y:244,w:126,h:180,color:'#f5ddac',roof:'#9e87da'}],flames:[[118,205],[277,275]],friend:'🐱'},
 {name:'동물 친구의 집',buildings:[{x:45,y:230,w:125,h:188,color:'#d7bbf3',roof:'#a17dcc'},{x:188,y:182,w:164,h:240,color:'#aee8dd',roof:'#5aaa9c'}],flames:[[93,243],[249,195],[300,288]],friend:'🐶'},
 {name:'무지개 유치원',buildings:[{x:54,y:208,w:295,h:215,color:'#f7e4a5',roof:'#e5a377'}],flames:[[105,230],[215,220],[305,275]],friend:'🐰'},
 {name:'푸른 숲 마을',buildings:[{x:52,y:260,w:140,h:160,color:'#bfe2c8',roof:'#85b4a2'},{x:219,y:196,w:137,h:225,color:'#fad5cb',roof:'#e9a193'}],flames:[[112,263],[259,216],[308,318]],friend:'🦊'},
 {name:'큰 소방 구조 현장',buildings:[{x:40,y:197,w:154,h:227,color:'#c5c9f5',roof:'#8d9be7'},{x:215,y:180,w:145,h:244,color:'#bde9f8',roof:'#6cb4d2'}],flames:[[90,205],[149,295],[255,191],[310,287]],friend:'🐻'}
];
const MORE_SCENES=[
 {name:'해변 등대',buildings:[{x:54,y:220,w:135,h:200,color:'#e9edff',roof:'#8db9eb'},{x:236,y:180,w:106,h:245,color:'#ffd8b0',roof:'#f19a76'}],flames:[[102,235],[274,196],[305,293]],friend:'🐧'},
 {name:'우주 과학관',buildings:[{x:39,y:210,w:318,h:215,color:'#c3d5fc',roof:'#8ea5ed'}],flames:[[102,233],[205,255],[301,236]],friend:'🐼'},
 {name:'꽃밭 동물 병원',buildings:[{x:51,y:234,w:294,h:193,color:'#ffcfe1',roof:'#dc8eae'}],flames:[[105,250],[232,250],[305,317]],friend:'🐸'},
 {name:'산속 캠핑장',buildings:[{x:39,y:255,w:146,h:170,color:'#ffdfad',roof:'#c0a4f1'},{x:209,y:219,w:145,h:205,color:'#c1ebd1',roof:'#77ba95'}],flames:[[91,268],[241,224],[300,312]],friend:'🦌'},
 {name:'도서관 구조작전',buildings:[{x:49,y:207,w:304,h:220,color:'#e3dafb',roof:'#a0a6df'}],flames:[[95,230],[188,250],[300,230],[277,323]],friend:'🦉'},
 {name:'비행장 구조작전',buildings:[{x:43,y:234,w:148,h:194,color:'#f2d6a9',roof:'#d49d83'},{x:213,y:205,w:139,h:220,color:'#c5e3f8',roof:'#8eb8e9'}],flames:[[99,244],[154,332],[260,218],[305,317]],friend:'🐨'},
 {name:'큰 동물원',buildings:[{x:52,y:199,w:286,h:228,color:'#beeeda',roof:'#68bdb0'}],flames:[[104,209],[215,232],[305,320],[164,330]],friend:'🦁'}
];
STAGES.push(...MORE_SCENES);
let hydrantUsed=false,helicopterUsed=false,ladderReady=false,boost=0,helicopterTime=0,helicopterX=200,rescuedFriends=[],sessionElapsed=0,sessionFinished=false;
let stage=0,score=0,totalSaved=0,active=false,paused=false,spraying=false,aim={x:230,y:265},fires=[],drops=[],splashes=[],confetti=[],frameId=0,prev=0,time=0,voiceOn=true,voiceAt=0,hasCompleted=false;
try{totalSaved=Number(localStorage.getItem('joiland-firetruck-saved')||0);rescuedFriends=JSON.parse(localStorage.getItem('joiland-firetruck-friends')||'[]');if(!Array.isArray(rescuedFriends))rescuedFriends=[]}catch(e){rescuedFriends=[]}
try{voiceOn=JSON.parse(localStorage.getItem('hangul-starland-v1')||'{}').sound!==false}catch(e){}
function clamp(v,a,b){return Math.min(b,Math.max(a,v))}
function rr(x,y,w,h,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function poly(points,color){ctx.beginPath();points.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.closePath();ctx.fillStyle=color;ctx.fill()}
function circle(x,y,r,color){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=color;ctx.fill()}
function text(t,x,y,size=22){ctx.font='900 '+size+'px system-ui,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(t,x,y)}
function voice(t,force=false){if(!voiceOn||!('speechSynthesis'in window))return;const now=Date.now();if(!force&&now-voiceAt<2100)return;voiceAt=now;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='ko-KR';u.rate=.93;u.pitch=1.11;speechSynthesis.speak(u)}catch(e){}}
function book(){const seen=[...new Set(rescuedFriends)];$('friends').textContent=seen.length?seen.join(' '):'아직 구조한 친구가 없어요'}
function update(){
 $('level').textContent='🚨 현장 '+(stage+1)+' / '+STAGES.length;
 $('score').textContent='🌟 구조 '+score+'개';
 const n=fires.length-fires.filter(f=>f.done).length;
 $('progress').style.width=(fires.length?(fires.length-n)/fires.length*100:0)+'%';
 $('sound').textContent=voiceOn?'🔊':'🔇';
 $('pause').textContent=paused?'▶ 계속하기':'⏸ 잠깐 쉬기';
 $('hydrant').disabled=!active||hydrantUsed||paused;
 $('helicopter').disabled=!active||helicopterUsed||paused;
 $('ladder').disabled=!active||paused||fires.some(f=>!f.done);
 $('ladder').textContent=fires.length&&fires.every(f=>f.done)?'🪜 친구 구조하기!':'🪜 불을 먼저 꺼요';
 book();
}
function makeScene(){fires=STAGES[stage].flames.map(([x,y])=>({x,y,health:0,done:false}));drops=[];splashes=[];confetti=[];spraying=false;aim={x:fires[0].x,y:fires[0].y};hasCompleted=false;hydrantUsed=false;helicopterUsed=false;ladderReady=false;boost=0;helicopterTime=0;time=0;prev=0;update();$('status').textContent='🚨 '+STAGES[stage].name+'! 불꽃을 모두 꺼 보아요!';draw()}
function start(){if(paused){resume();return}if(sessionFinished){location.href='./requests.html';return}active=true;paused=false;makeScene();$('overlay').classList.add('hidden');cancelAnimationFrame(frameId);frameId=requestAnimationFrame(frame);playSiren();setTimeout(()=>{if(active&&!paused)voice('사건발생! 사건발생! 화재가 발생했다! 소방차는 출동하라!',true)},1050)}
function win(){if(hasCompleted)return;hasCompleted=true;const friend=STAGES[stage].friend;if(!rescuedFriends.includes(friend)){rescuedFriends.push(friend);try{localStorage.setItem('joiland-firetruck-friends',JSON.stringify(rescuedFriends))}catch(e){}}active=false;spraying=false;cancelAnimationFrame(frameId);totalSaved++;try{localStorage.setItem('joiland-firetruck-saved',String(totalSaved))}catch(e){}update();voice('야호! 모두 구했어! 정말 멋진 소방관이야!',true);burst(200,214,55);draw();show('🏆 구조 성공!','불을 모두 껐어요! '+STAGES[stage].friend+' 친구가 고마워하고 있어요.\\n구조한 현장 '+totalSaved+'개',stage===STAGES.length-1?'🔄 다시 출동하기':'🚒 다음 현장으로','🎉🐯💖')}
function show(title,message,button,hero='🚒💦'){$('modalTitle').textContent=title;$('modalText').textContent=message;$('start').textContent=button;$('hero').textContent=hero;$('overlay').classList.remove('hidden')}
function pause(){if(!active||paused)return;paused=true;spraying=false;cancelAnimationFrame(frameId);show('⏸ 잠깐 쉬어요','불꽃은 기다려 줘요. 준비되면 다시 출동해요!','▶ 계속하기','🚒☁️');update()}
function resume(){if(!active)return;paused=false;prev=0;$('overlay').classList.add('hidden');update();frameId=requestAnimationFrame(frame)}
function next(){if(paused){resume();return}if(hasCompleted){stage=(stage+1)%STAGES.length;start()}else start()}
function resize(){const r=scene.getBoundingClientRect(),d=Math.min(2,devicePixelRatio||1);canvas.width=Math.round(r.width*d);canvas.height=Math.round(r.height*d);ctx.setTransform(canvas.width/W,0,0,canvas.height/H,0,0);draw()}
function sky(){const bg=ctx.createLinearGradient(0,0,0,460);bg.addColorStop(0,'#87cef8');bg.addColorStop(.75,'#d4f7ff');bg.addColorStop(1,'#f8f8e2');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);circle(338,60,28,'#ffe58b');for(const [x,y] of [[56,67],[213,112],[310,166]]){circle(x,y,20,'#fffdf5');circle(x+25,y-6,25,'#fffdf5');circle(x+51,y,18,'#fffdf5');rr(x-10,y,69,21,12,'#fffdf5')}ctx.fillStyle='#a8deb4';ctx.beginPath();ctx.ellipse(110,425,200,66,0,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.ellipse(310,425,220,55,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#7fcd98';ctx.fillRect(0,411,W,159);ctx.fillStyle='#686f8a';ctx.fillRect(0,481,W,89);ctx.fillStyle='#fffcce';for(let x=8;x<400;x+=76)rr(x,526,42,5,3,'#fff4bb')}
function tree(x,y){rr(x-6,y-12,12,66,4,'#957756');circle(x,y-31,30,'#52b984');circle(x-20,y-25,24,'#61c78d');circle(x+22,y-24,24,'#60cc90');circle(x,y-53,23,'#66ce94')}
function building(b){const x=b.x,y=b.y,w=b.w,h=b.h;rr(x,y,w,h,11,b.color);poly([[x-12,y+9],[x+w/2,y-44],[x+w+12,y+9]],b.roof);rr(x+5,y+h-7,w-10,12,4,'#ffffff8c');for(let row=0;row<2;row++)for(let col=0;col<Math.min(3,Math.floor(w/64)+1);col++){const bx=x+21+col*(w-42)/(Math.min(3,Math.floor(w/64)+1)-1||1),by=y+31+row*65;rr(bx-13,by,27,33,5,'#fbfdff');rr(bx-9,by+4,19,25,3,'#9bd5ed');ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(bx,by+4);ctx.lineTo(bx,by+29);ctx.stroke()}rr(x+w/2-15,y+h-53,30,53,5,'#9b7e9e');circle(x+w/2+10,y+h-25,3,'#ffe8b7')}
function truck(){const x=38,y=441;rr(x,y-28,154,61,12,'#f75660');rr(x+93,y-18,56,42,9,'#e94357');rr(x+105,y-15,31,19,5,'#c3f4ff');rr(x+5,y-14,76,7,4,'#ffced1');rr(x+5,y+9,76,7,4,'#ffb4b8');rr(x+7,y-39,92,12,4,'#e8f3ff');ctx.fillStyle='#e9c86b';ctx.fillRect(x+18,y-46,9,8);ctx.fillRect(x+90,y-46,9,8);for(const wx of [x+37,x+126]){circle(wx,y+33,20,'#373850');circle(wx,y+33,10,'#d6e5ef')}rr(x+144,y+8,14,13,4,'#ffeb96');circle(x+88,y-48,9,'#74cbfa');text('🚒',x+75,y-7,16)}
function flame(x,y,intensity,t){const scale=.7+.3*(1-intensity);ctx.save();ctx.translate(x,y);ctx.scale(scale,scale);const flicker=Math.sin(t*8+x)*4;poly([[-27,25],[-25,-12],[-9,-40],[2,-18],[12,-52],[24,-21],[30,19],[18,35],[-13,36]],'#ff784d');poly([[-14,24],[-11,-15],[2,-24],[6,-7],[14,-26],[20,22],[4,34]],'#ffb74f');poly([[-6,28],[-4,-4],[4,-10],[10,24]],'#fff4a5');circle(1,37,9,'#ffe7b7');ctx.restore();if(t%2<1.2){circle(x+29,y-40+Math.sin(t*2)*5,7,'#f9f8e4a8');circle(x+45,y-62+Math.sin(t*2)*8,10,'#f9f8e49c')}}
function burst(x,y,n=18){for(let i=0;i<n;i++){let a=Math.random()*Math.PI*2,v=50+Math.random()*160;confetti.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-50,life:1+Math.random()*.5,c:['#ffe47a','#67dfea','#ff97c3','#9ee59a','#beadff'][i%5]})}}
function splash(x,y){for(let i=0;i<9;i++){const a=Math.random()*Math.PI*2;const v=22+Math.random()*110;splashes.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:.5})}}
function draw(){ctx.clearRect(0,0,W,H);sky();tree(20,380);tree(379,376);for(const b of STAGES[stage].buildings)building(b);for(const f of fires){if(f.done){text('✨',f.x,f.y,30);continue}flame(f.x,f.y,f.health,time);rr(f.x-27,f.y+44,54,9,4,'#ffffff');rr(f.x-24,f.y+46,Math.max(0,48*(1-f.health)),5,3,'#f08e7c')}truck();
 if(boost>0){text('🚰',40,445,37);ctx.fillStyle='#79dbff';ctx.fillRect(65,466,105,7)}
 if(helicopterTime>0){text('🚁',helicopterX,84+Math.sin(time*7)*5,50);ctx.strokeStyle='#80e3ff';ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(helicopterX,105);ctx.lineTo(helicopterX,325);ctx.stroke()}
 const nozzle={x:185,y:436};if(active&&!paused&&spraying){ctx.save();ctx.strokeStyle='#d7f9ff';ctx.lineWidth=12;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(nozzle.x,nozzle.y);ctx.quadraticCurveTo((nozzle.x+aim.x)/2-30,(nozzle.y+aim.y)/2-52,aim.x,aim.y);ctx.stroke();ctx.strokeStyle='#63c9f3';ctx.lineWidth=5;ctx.stroke();ctx.restore();circle(aim.x,aim.y,16,'#bdf5ff78')}
 for(const p of drops){circle(p.x,p.y,p.r,'#ffffffcc')}for(const p of splashes){circle(p.x,p.y,3,'#7bdafa')}for(const p of confetti){rr(p.x,p.y,6,9,2,p.c)}
 if(!active&&hasCompleted){text('🎉',190,114,49);text(STAGES[stage].friend,200,348,54)}
}
function coordinate(e){const r=canvas.getBoundingClientRect();return{x:clamp((e.clientX-r.left)/r.width*W,0,W),y:clamp((e.clientY-r.top)/r.height*H,0,H)}}
function aimAt(e){aim=coordinate(e);if(active&&spraying){for(const f of fires)if(!f.done&&Math.hypot(f.x-aim.x,f.y-aim.y)<64)aim={x:f.x,y:f.y}}}
function stopSpray(){spraying=false;draw()}
canvas.addEventListener('pointerdown',e=>{if(!active||paused)return;e.preventDefault();aimAt(e);spraying=true;canvas.setPointerCapture(e.pointerId)});
canvas.addEventListener('pointermove',e=>{if(!spraying||!active)return;e.preventDefault();aimAt(e)});
canvas.addEventListener('pointerup',stopSpray);canvas.addEventListener('pointercancel',stopSpray);
// 장비는 현장별 한 번씩 사용할 수 있습니다. 실패하거나 시간을 잃지 않습니다.
let sirenContext=null;
function playSiren(){
 if(!voiceOn)return;
 try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;const ac=sirenContext||new AC();sirenContext=ac;if(ac.state==='suspended')ac.resume();let t=ac.currentTime+.03;for(let i=0;i<4;i++){const osc=ac.createOscillator(),gain=ac.createGain();osc.type='sine';osc.frequency.setValueAtTime(i%2?730:470,t+i*.23);osc.frequency.linearRampToValueAtTime(i%2?470:730,t+(i+1)*.23);gain.gain.setValueAtTime(.0001,t+i*.23);gain.gain.linearRampToValueAtTime(.045,t+i*.23+.06);gain.gain.linearRampToValueAtTime(.0001,t+(i+1)*.23);osc.connect(gain).connect(ac.destination);osc.start(t+i*.23);osc.stop(t+(i+1)*.23)} }catch(e){}
}
function finishTime(){if(sessionFinished)return;sessionFinished=true;active=false;paused=false;spraying=false;cancelAnimationFrame(frameId);show('🏆 5분 탐험 완료!','이현이 소방관! 오늘도 정말 멋지게 구조했어! 다른 놀이도 만나볼까요?','🏠 다른 놀이 하기','🏆🚒✨');$('start').onclick=()=>location.href='./requests.html';voice('5분 탐험 성공! 트로피를 받았어!',true)}
$('hydrant').onclick=()=>{if(!active||paused||hydrantUsed)return;hydrantUsed=true;boost=16;splash(65,443);$('status').textContent='🚰 소화전 연결! 16초 동안 물줄기가 세져요!';voice('소화전 연결! 물이 더 세졌어!');update()};
$('helicopter').onclick=()=>{if(!active||paused||helicopterUsed)return;helicopterUsed=true;helicopterTime=2.8;const targets=fires.filter(f=>!f.done);if(targets.length){helicopterX=targets[0].x;for(const f of targets){f.health=Math.min(.9,f.health+.48);splash(f.x,f.y);burst(f.x,f.y,8)}}$('status').textContent='🚁 헬리콥터가 물을 뿌렸어요!';voice('헬리콥터 지원 도착!');update()};
$('ladder').onclick=()=>{if(!active||paused||fires.some(f=>!f.done))return;ladderReady=true;burst(200,320,45);$('status').textContent='🪜 구조 성공! 친구가 안전해요!';win()};
$('spray').addEventListener('pointerdown',e=>{if(!active||paused)return;e.preventDefault();spraying=true});
for(const k of ['pointerup','pointercancel','pointerleave'])$('spray').addEventListener(k,stopSpray);
$('start').onclick=next;$('pause').onclick=()=>paused?resume():pause();$('restart').onclick=()=>{stage=0;score=0;start()};
$('sound').onclick=()=>{voiceOn=!voiceOn;update();try{const o=JSON.parse(localStorage.getItem('hangul-starland-v1')||'{}');o.sound=voiceOn;localStorage.setItem('hangul-starland-v1',JSON.stringify(o))}catch(e){}if(!voiceOn)try{speechSynthesis.cancel()}catch(e){}};
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});window.addEventListener('pagehide',()=>{cancelAnimationFrame(frameId);active=false});window.addEventListener('resize',resize);
function frame(ms){if(!active||paused)return;if(!prev)prev=ms;const dt=Math.min(.05,(ms-prev)/1000);prev=ms;time+=dt;sessionElapsed+=dt;if(sessionElapsed>=300){finishTime();return}boost=Math.max(0,boost-dt);helicopterTime=Math.max(0,helicopterTime-dt);
 if(spraying){
  const near=fires.filter(f=>!f.done&&Math.hypot(f.x-aim.x,f.y-aim.y)<48);
  for(const f of near){f.health=clamp(f.health+dt*(boost>0?1.32:.73),0,1);if(f.health>=1){f.done=true;score++;burst(f.x,f.y);splash(f.x,f.y);voice(['불을 껐어! 멋져!','좋았어, 이현이 소방관!','야호! 구조 성공!'][score%3]);$('status').textContent='💖 잘했어! 불꽃 '+score+'개를 껐어!';update();if(fires.every(v=>v.done)){$('status').textContent='🪜 불이 다 꺼졌어요! 구조 사다리로 친구를 구해요!';voice('불을 다 껐어! 사다리로 구조하자!');update();}}}
  for(let i=0;i<2;i++)drops.push({x:185,y:436,r:2+Math.random()*3,age:0,endX:aim.x+(Math.random()-.5)*17,endY:aim.y+(Math.random()-.5)*17});
 }
 for(const p of drops){p.age+=dt*3.5;p.x+=(p.endX-p.x)*Math.min(1,dt*12);p.y+=(p.endY-p.y)*Math.min(1,dt*12)}drops=drops.filter(p=>p.age<1);
 for(const p of splashes){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt}splashes=splashes.filter(p=>p.life>0);
 for(const p of confetti){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=150*dt;p.life-=dt}confetti=confetti.filter(p=>p.life>0);
 draw();frameId=requestAnimationFrame(frame)
}
update();requestAnimationFrame(resize);
