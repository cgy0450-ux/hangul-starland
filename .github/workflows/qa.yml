name: Joiland JavaScript QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check HTML scripts and app features
        run: node qa/smoke.cjs
      - name: Browser rendered learning hall smoke test
        run: node qa/browser-smoke.cjs
