name: Joiland JavaScript QA

on:
  push:
    branches: [main, v13/02-offline-query-navigation]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check HTML scripts and app features
        run: node qa/smoke.cjs
      - name: Browser rendered learning hall smoke test
        run: |
          set -o pipefail
          node qa/browser-smoke.cjs | tee browser-smoke.log
          node -e "if(!require('fs').readFileSync('browser-smoke.log','utf8').includes('PASS: Chromium rendered 72 live-style pages')) process.exit(1)"
