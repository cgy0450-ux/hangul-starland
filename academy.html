/* v8 unified high-quality kid-friendly academy design */

function speak(t){lastSpoken=t;if(voiceOff||!("speechSynthesis" in window))return;try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.lang=englishSpeech(t)?"en-US":"ko-KR";var voices=speechSynthesis.getVoices().filter(v=>v.lang.toLowerCase().startsWith(u.lang.slice(0,2)));u.voice=voices.find(v=>/natural|neural|google|premium|enhanced/i.test(v.name))||voices[0]||null;u.rate=englishSpeech(t)?.83:.94;u.pitch=1.03;speechSynthesis.speak(u);}catch(e){}}

function start(i){selected=i;const game=games[subject][i];if(game.route){location.href=game.route;return;}round=0;score=0;correct=false;seed=Number(dayKey.replace(/-/g,""))+(subject==="math"?11:subject==="science"?139:subject==="english"?1013:subject==="history"?2081:3209)+i*809;const bank=generate(subject,i);const distinct=shuffled(bank).filter((q,j,a)=>a.findIndex(x=>x.unique===q.unique)===j);deck=distinct.slice(0,5);if(deck.length<5)throw Error("Not enough unique questions: "+subject+" "+i);el("menu-screen").hidden=true;document.body.classList.add("playing");el("game").classList.add("active");render();}
function directionMap(q){
 if(subject!=='coding'||selected!==5)return null;
 const tokens=q.visual.split(/\\s+/).filter(Boolean);
 if(tokens.length!==3)return null;
 const dir={'⬆️':-5,'⬇️':5,'⬅️':-1,'➡️':1}[tokens[1]];
 if(!dir)return null;
 const places=Array(25).fill('');
 places[12]=tokens[0];places[12+dir]=tokens[1];places[12+dir*2]=tokens[2];
 return '<div class="direction-scene" role="img" aria-label="'+q.ask+'">'+places.map((t,i)=>'<span class="'+(i===12?'origin':i===12+dir?'move-arrow':i===12+dir*2?'destination':'')+'">'+t+'</span>').join('')+'</div>';
}
const HISTORY_FACTS={
'세종대왕':'세종대왕은 백성이 쉽게 읽고 쓰도록 한글을 만들었어요.',
'이순신':'이순신 장군은 바다에서 우리나라를 지켰어요.',
'장영실':'장영실은 옛날에 과학 기구를 만드는 데 큰 역할을 했어요.',
'신사임당':'신사임당은 그림을 잘 그린 화가예요.',
'허준':'허준은 사람의 병을 치료하는 방법을 담은 동의보감을 엮었어요.',
'유관순':'유관순은 우리나라 독립을 외쳤어요.',
'김구':'김구는 우리나라의 독립을 위해 애썼어요.',
'훈민정음':'훈민정음은 세종대왕이 새 글자를 알린 책이에요.',
'측우기':'측우기는 빗물이 얼마나 왔는지 재던 통이에요.',
'거북선':'거북선은 이순신 장군과 관련된 전투 배예요.',
'무궁화':'무궁화는 우리나라의 나라꽃이에요.',
'태극기':'태극기는 우리나라 국기예요.',
'애국가':'애국가는 우리나라를 대표하는 노래예요.',
'한복':'한복은 우리나라의 전통 옷이에요.'
};
function render(){correct=false;var q=deck[round];el("counter").textContent=(round+1)+" / 5";el("score").textContent="⭐ "+score;const picture=directionMap(q);if(picture){el("visual").innerHTML=picture;}else{el("visual").textContent=q.visual;}el("visual").style.whiteSpace="pre-line";el("game").classList.toggle("kid-mode",subject==='history'||subject==='coding');el("visual").className="iconbox"+(subject==="math"&&[0,1,4,8,9].includes(selected)?" compact":"")+(subject==="math"&&selected===4?" honey":"");el("prompt").textContent=q.ask;el("hint").textContent=q.hint;el("feedback").textContent="";el("next").hidden=true;el("choices").innerHTML=q.options.map((c,i)=>'<div class="answer-wrap"><button class="choice" data-answer="'+i+'" style="--c:'+["#e8f8ff","#fff1ce","#f7e8ff","#e7ffec"][i]+'">'+c+'</button><button class="hear-option" data-hear="'+i+'" aria-label="선택지 읽어주기">🔊</button></div>').join("");speak(q.speech);}
function answer(i){if(correct)return;var q=deck[round],buttons=el("choices").querySelectorAll("button.choice"),picked=q.options[i];if(picked===q.answer){correct=true;score++;buttons[i].classList.add("correct");el("feedback").textContent=["야호! 정말 잘했어요! 🌟","딩동댕! 멋진 탐험이야! 🐯","대단해! 반짝반짝! ✨"][Math.floor(random()*3)];el("next").hidden=false;speak(subject==='history'?(HISTORY_FACTS[q.answer]||('맞아요! '+q.answer+'예요.')):'정답! 정말 잘했어요!');try{var k="joiland-academy-progress-"+dayKey+"-"+subject;var stats=JSON.parse(localStorage.getItem(k)||"{}");stats[games[subject][selected].name]=(stats[games[subject][selected].name]||0)+1;localStorage.setItem(k,JSON.stringify(stats));}catch(e){}}else{buttons[i].classList.add("wrong");el("feedback").textContent="조금만 더 생각해 볼까? 💛";speak("다시 찾아볼까?");}}
el("menu").addEventListener("click",e=>{var b=e.target.closest("[data-i]");if(b)start(+b.dataset.i);});el("choices").addEventListener("click",e=>{var hear=e.target.closest("[data-hear]");if(hear){speak(deck[round].options[+hear.dataset.hear]);return;}var b=e.target.closest("[data-answer]");if(b)answer(+b.dataset.answer);});el("back").onclick=menu;el("next").onclick=()=>{if(round===4){el("feedback").textContent="🎉 다섯 문제 끝! 오늘도 신나게 배웠어요!";setTimeout(menu,850);}else{round++;render();}};el("listen").onclick=()=>speak(deck[round].speech);el("voice").onclick=()=>{voiceOff=!voiceOff;try{const st=JSON.parse(localStorage.getItem("hangul-starland-v1")||"{}");st.sound=!voiceOff;localStorage.setItem("hangul-starland-v1",JSON.stringify(st));}catch(e){}el("voice").textContent=voiceOff?"🔇 소리 끔":"🔊 소리 켬";el("voice").setAttribute("aria-label",voiceOff?"읽어주기 켜기":"읽어주기 끄기");if(voiceOff&&("speechSynthesis"in window))speechSynthesis.cancel();else if(!voiceOff&&selected>=0&&deck[round])speak(deck[round].speech);};window.addEventListener("pagehide",()=>{try{speechSynthesis.cancel();}catch(e){}});menu();
})();
</script></body></html>
