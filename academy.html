<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#7255cb"><title>쪼이랜드 학습관</title>
<style>
:root{font-family:system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:#34295d;background:#f1edff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 0 10%,#fff4ce,transparent 43%),radial-gradient(circle at 95% 90%,#d2fff1,transparent 44%),#f2eeff;min-height:100dvh}button{font:inherit;cursor:pointer;touch-action:manipulation;border:0}button:focus-visible{outline:3px solid #12a9c2;outline-offset:3px}header{max-width:950px;margin:auto;display:flex;align-items:center;gap:10px;padding:13px 16px}header a,header button{border-radius:16px;background:white;color:#5942a1;text-decoration:none;padding:11px 13px;font-weight:900;box-shadow:0 4px 0 #d9cdec}header h1{margin:0;font-size:clamp(20px,5vw,32px);flex:1}main{max-width:950px;margin:auto;padding:5px 15px 28px}.intro{border:5px solid white;background:linear-gradient(120deg,#ffefc5,#e4d9ff,#d0f8fa);padding:23px;border-radius:32px;margin-bottom:19px;box-shadow:0 8px 0 #cfc6e6}.intro h2{font-size:clamp(24px,6vw,37px);margin:0 0 7px}.intro p{margin:0;line-height:1.6}.menu{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.tile{border:5px solid white;background:var(--bg);box-shadow:0 8px 0 var(--edge);border-radius:28px;padding:15px 9px 20px;min-height:177px;color:#382c6a}.tile .art{display:block;font-size:clamp(51px,10vw,74px);margin-bottom:9px}.tile strong{display:block;font-size:clamp(17px,4vw,23px)}.tile small{display:block;margin-top:6px;font-size:13px;color:#71658e}.game{display:none}.game.active{display:block}.toprow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}.toprow button,.control{border-radius:15px;padding:10px 15px;background:#fff;color:#5a43a6;font-weight:900}.count{color:#785da9;font-weight:900}.panel{background:#fff;border:6px solid #fff;border-radius:31px;box-shadow:0 9px 0 #c9b9e4;padding:clamp(15px,3vw,28px);min-height:350px;text-align:center}.iconbox{border-radius:22px;background:linear-gradient(120deg,#eef9ff,#fff6dd);min-height:120px;display:flex;align-items:center;justify-content:center;gap:10px;padding:12px;overflow:hidden;font-size:clamp(44px,9vw,80px);word-break:keep-all}.prompt{font-size:clamp(24px,6vw,36px);margin:18px 0 12px;line-height:1.38}.hint{font-weight:750;color:#7f75a1;margin:4px 0 16px}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.choice{min-height:85px;padding:12px 7px;border-radius:23px;background:var(--c,#eaf7ff);color:#352862;font-weight:900;font-size:clamp(19px,5vw,27px);box-shadow:0 6px 0 #a9b4d966;word-break:keep-all}.choice.correct{background:#b6f7d7}.choice.wrong{background:#ffc5d3}.bottom{display:flex;gap:9px;justify-content:center;align-items:center;margin-top:18px;flex-wrap:wrap}.bottom button{padding:13px 20px;border-radius:18px;background:#7356d6;color:white;font-weight:900}.bottom .replay{background:#e2f8ff;color:#2d607f}.feedback{font-size:20px;font-weight:900;color:#327a64;margin:14px 0 0;min-height:30px}.stars{margin-left:auto;background:#fff6bd;padding:9px;border-radius:14px}.num-picture{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:7px;max-width:100%}.num-picture span{font-size:clamp(30px,7vw,54px)}footer{text-align:center;color:#8977a4;font-size:12px;padding:24px 12px}body.playing main{min-height:calc(100dvh - 75px);display:flex;flex-direction:column}body.playing .game.active{flex:1;display:flex;flex-direction:column;justify-content:center}@media(max-height:680px){header{padding:6px 12px}.panel{padding:10px;min-height:unset}.iconbox{min-height:76px;font-size:45px}.prompt{font-size:22px;margin:8px 0}.choice{min-height:57px}.bottom{margin-top:8px}.intro{padding:10px}}@media(min-width:700px){.menu{grid-template-columns:repeat(4,1fr)}}
</style></head><body><header><a href="./index.html">⌂ 과목 선택</a><h1 id="top-title">🐯 쪼이랜드</h1><button id="music">🎵</button></header><main><section id="menu-screen"><div class="intro"><h2 id="heading">재미있는 놀이를 골라봐!</h2><p>하루에 조금씩, 신나는 탐험을 떠나요. 오늘은 다른 문제가 기다려요! 🌟</p></div><div id="menu" class="menu"></div></section><section class="game" id="game"><div class="toprow"><button id="back">‹ 놀이 선택</button><b class="count" id="counter"></b><span class="stars" id="score">⭐ 0</span></div><div class="panel"><div id="visual" class="iconbox"></div><h2 id="prompt" class="prompt"></h2><p id="hint" class="hint"></p><div class="choices" id="choices"></div><p class="feedback" id="feedback" role="status"></p><div class="bottom"><button id="listen" class="replay">🔊 다시 듣기</button><button id="next" hidden>다음 문제 ➜</button></div></div></section></main><footer>🌈 5세 아이를 위한 천천히 놀이 · 정답은 한 번 더 생각해도 괜찮아요!</footer><script src="./bgm.js?v=1"></script><script>
(function(){"use strict";
var p=new URLSearchParams(location.search);var subject=p.get("subject");if(["math","science","english"].indexOf(subject)<0)subject="math";
var INFO={math:{label:"수학 놀이터",icon:"🔢",title:"🐯 수학 모험",desc:"수, 모양, 규칙을 만나요"},science:{label:"과학 탐험",icon:"🔬",title:"🌱 과학 탐험",desc:"관찰하고 생각해 봐요"},english:{label:"영어 친구들",icon:"🔤",title:"🌈 영어 모험",desc:"그림과 소리로 익혀요"}};
document.title="쪼이랜드 · "+INFO[subject].label;document.getElementById("top-title").textContent=INFO[subject].title;document.getElementById("heading").textContent=INFO[subject].icon+" "+INFO[subject].label;
var today=new Date();var dayKey=[today.getFullYear(),String(today.getMonth()+1).padStart(2,"0"),String(today.getDate()).padStart(2,"0")].join("-");var seed=Number(dayKey.replace(/-/g,""))+(subject==="math"?11:subject==="science"?139:1013);
function random(){seed=(Math.imul(seed,1664525)+1013904223)|0;return(seed>>>0)/4294967296;}
function shuffled(a){var b=a.slice();for(var i=b.length-1;i>0;i--){var j=Math.floor(random()*(i+1));var t=b[i];b[i]=b[j];b[j]=t;}return b;}
function shuffleChoices(answer,wrong){return shuffled([answer].concat(wrong.filter(x=>x!==answer).slice(0,3))); }
function Q(visual,ask,answer,others,speech,hint){return{visual:visual,ask:ask,answer:String(answer),options:shuffleChoices(String(answer),others.map(String)),speech:speech||ask,hint:hint||"그림을 잘 보고 골라요!"};}
var games={
math:[
{name:"동물 수 세기",icon:"🐥",bg:"#fff0cc",edge:"#f9ce78",desc:"1부터 10까지",make:function(){var z=Math.floor(random()*7)+1,emoji=["🐥","🚗","🍓","🐟"][Math.floor(random()*4)];return Q(Array(z).fill(emoji).join(" "),"몇 개일까요?",z,[z+1,Math.max(1,z-1),z+2],"하나씩 세어볼까? 몇 개일까요?");}},
{name:"숫자 더하기",icon:"🍎",bg:"#e3f7ff",edge:"#8bd4ee",desc:"함께 모으면?",make:function(){var a=1+Math.floor(random()*4),b=1+Math.floor(random()*4);return Q(Array(a).fill("🍎").join("")+" + "+Array(b).fill("🍎").join(""),a+"개와 "+b+"개를 합치면?",a+b,[a+b+1,a+b-1,a+b+2],"사과를 모두 세어볼까?");}},
{name:"도형 탐험",icon:"🔺",bg:"#f6e5ff",edge:"#dbaaf0",desc:"동그라미와 세모",make:function(){var arr=[["동그라미","🔴"],["세모","🔺"],["네모","🟦"],["별","⭐"]],v=arr[Math.floor(random()*arr.length)];return Q(v[1],"이 모양의 이름은?",v[0],arr.filter(x=>x!==v).map(x=>x[0]),"어떤 모양일까요?");}},
{name:"다음 규칙",icon:"🧩",bg:"#e4ffde",edge:"#a5dc8e",desc:"규칙을 찾아요",make:function(){var arr=[["🔴","🔵"],["⭐","🌙"],["🐯","🐰"],["🚗","🚕"]],v=arr[Math.floor(random()*arr.length)],flip=random()>.5?1:0;return Q(v[flip]+" "+v[1-flip]+" "+v[flip]+" ?", "다음에 올 그림은?",v[1-flip],[v[flip],"🌻","🎈"],"차례대로 반복되는 규칙을 찾아보자!");}},
{name:"누가 더 많을까?",icon:"⚖️",bg:"#ffe6e8",edge:"#eeacaf",desc:"많고 적음 비교",make:function(){var a=2+Math.floor(random()*4),b=a+1+Math.floor(random()*3);var flip=random()>.5;var bear=flip?b:a,tiger=flip?a:b;return Q("🐻 "+Array(bear).fill("🍯").join("")+"   🐯 "+Array(tiger).fill("🍯").join(""),"꿀이 더 많은 친구는?",flip?"곰":"호랑이",["곰","호랑이","똑같아요","아무도 없어요"],"누가 꿀을 더 많이 가지고 있을까?");}}
],
science:[
{name:"동물의 집",icon:"🦁",bg:"#fff0cc",edge:"#edc77f",desc:"어디에서 살까?",make:function(){var arr=[["🐟","물속",["숲","하늘","사막"]],["🐰","풀밭",["물속","하늘","바다"]],["🐧","추운 곳",["사막","뜨거운 숲","화산"]],["🐪","사막",["바다","얼음","물속"]],["🐒","나무가 많은 숲",["물속","우주","얼음"]]];var v=arr[Math.floor(random()*arr.length)];return Q(v[0],"이 친구가 사는 곳은?",v[1],v[2],"이 동물은 어디에 살까요?","동물이 사는 곳을 생각해 보자.");}},
{name:"식물 성장 탐험",icon:"🌱",bg:"#e0fbdf",edge:"#9be2a3",desc:"씨앗이 자라요",make:function(){var v=[["🌰","씨앗",["꽃","나무","열매"]],["🌱","새싹",["씨앗","달","열매"]],["🌼","꽃",["돌","컵","얼음"]],["🌳","나무",["새싹","비","모래"]]][Math.floor(random()*4)];return Q(v[0],"이것은 무엇일까요?",v[1],v[2],"식물 관찰! 무엇이 보이나요?");}},
{name:"날씨 연구소",icon:"🌦️",bg:"#e7f5ff",edge:"#94d4ed",desc:"날씨와 옷차림",make:function(){var v=[["☔🌧️","우산",["선글라스","수영복","장갑"]],["❄️⛄","두꺼운 외투",["수영복","반팔만","샌들"]],["☀️🏖️","모자",["목도리","장갑","두꺼운 털모자"]]][Math.floor(random()*3)];return Q(v[0],"이 날씨에 필요한 것은?",v[1],v[2],"날씨를 관찰하고 골라 보자!");}},
{name:"오감 탐정",icon:"👀",bg:"#fde6f8",edge:"#eda4ca",desc:"눈·귀·코 탐험",make:function(){var v=[["🌸","코",["귀","발","손"]],["🔔","귀",["코","발","배"]],["🌈","눈",["코","발","귀"]],["🍋","혀",["귀","눈","발"]]][Math.floor(random()*4)];return Q(v[0],"어디로 느낄까요?",v[1],v[2],"우리 몸의 감각을 찾아보자!");}},
{name:"같은 친구 찾기",icon:"🔍",bg:"#edeaff",edge:"#b7a6ef",desc:"관찰하고 분류",make:function(){var v=[["🦒 🐯 🐢","동물",["자동차","과일","장난감"]],["🍎 🍓 🍌","과일",["동물","비행기","집"]],["🚗 🚒 🚕","자동차",["과일","식물","별"]],["🌳 🌼 🌱","식물",["자동차","동물","연필"]]][Math.floor(random()*4)];return Q(v[0],"모두 어떤 친구일까요?",v[1],v[2],"공통점을 찾아보자!");}}
],
english:[
{name:"동물 영어",icon:"🐯",bg:"#fff0d6",edge:"#efc67e",desc:"동물 이름 듣기",make:function(){var v=[["🐱","cat",["dog","fish","bird"]],["🐶","dog",["cat","duck","lion"]],["🐯","tiger",["rabbit","panda","fish"]],["🐰","rabbit",["tiger","dog","duck"]],["🐟","fish",["cat","tiger","rabbit"]]];var x=v[Math.floor(random()*v.length)];return Q(x[0],"영어로 무엇일까요?",x[1],x[2],x[1],"영어 소리를 들어보세요.");}},
{name:"색깔 영어",icon:"🌈",bg:"#e6f7ff",edge:"#96d5eb",desc:"색깔 이름 듣기",make:function(){var v=[["🔴","red",["blue","green","yellow"]],["🔵","blue",["red","green","pink"]],["🟢","green",["red","blue","yellow"]],["🟡","yellow",["red","blue","pink"]]];var x=v[Math.floor(random()*v.length)];return Q(x[0],"어떤 색깔 영어일까요?",x[1],x[2],x[1],"색깔을 듣고 골라요.");}},
{name:"숫자 영어",icon:"🔢",bg:"#f8e8ff",edge:"#dba6e6",desc:"One, Two, Three",make:function(){var n=1+Math.floor(random()*5),words=["one","two","three","four","five"];return Q(Array(n).fill("⭐").join(""),"영어 숫자는?",words[n-1],words.filter((x,i)=>i!==n-1),words[n-1],"별을 세어보고 소리를 들어봐요.");}},
{name:"탈것 영어",icon:"🚗",bg:"#e3ffeb",edge:"#9bdfa8",desc:"좋아하는 자동차",make:function(){var v=[["🚗","car",["bus","train","plane"]],["🚌","bus",["car","boat","train"]],["🚂","train",["bus","car","plane"]],["✈️","plane",["boat","car","bus"]]];var x=v[Math.floor(random()*v.length)];return Q(x[0],"영어 이름을 찾아요!",x[1],x[2],x[1],"탈것의 영어 이름을 들어봐요.");}},
{name:"인사 영어",icon:"👋",bg:"#ffe5e9",edge:"#e7a6b4",desc:"Hello! Thank you!",make:function(){var v=[["👋","Hello",["Good night","Thank you","Bye"]],["🙏","Thank you",["Hello","Bye","Yes"]],["🌙😴","Good night",["Good morning","Hello","Thank you"]],["👋🚪","Bye",["Thank you","Hello","Good night"]]];var x=v[Math.floor(random()*v.length)];return Q(x[0],"이럴 때 하는 인사는?",x[1],x[2],x[1],"영어 인사를 들어봐요.");}}
]};
var el=id=>document.getElementById(id),round=0,selected=-1,deck=[],correct=false,score=0,lastSpoken="",voiceOff=false;
function englishSpeech(t){return subject==="english" && /[a-z]/i.test(t);}
function speak(t){lastSpoken=t;if(voiceOff||!("speechSynthesis" in window))return;try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.lang=englishSpeech(t)?"en-US":"ko-KR";var voices=speechSynthesis.getVoices().filter(v=>v.lang.toLowerCase().startsWith(u.lang.slice(0,2)));u.voice=voices.find(v=>/natural|neural|google|premium|enhanced/i.test(v.name))||voices[0]||null;u.rate=englishSpeech(t)?.83:.94;u.pitch=1.03;speechSynthesis.speak(u);}catch(e){}}
function menu(){document.body.classList.remove("playing");el("menu-screen").hidden=false;el("game").classList.remove("active");el("menu").innerHTML=games[subject].map((g,i)=>'<button class="tile" data-i="'+i+'" style="--bg:'+g.bg+';--edge:'+g.edge+'"><span class="art">'+g.icon+'</span><strong>'+g.name+'</strong><small>'+g.desc+'</small></button>').join("");}
function start(i){selected=i;round=0;score=0;correct=false;seed=Number(dayKey.replace(/-/g,""))+(subject==="math"?11:subject==="science"?139:1013)+i*809;deck=Array.from({length:5},()=>games[subject][i].make());el("menu-screen").hidden=true;document.body.classList.add("playing");el("game").classList.add("active");render();}
function render(){correct=false;var q=deck[round];el("counter").textContent=(round+1)+" / 5";el("score").textContent="⭐ "+score;el("visual").textContent=q.visual;el("prompt").textContent=q.ask;el("hint").textContent=q.hint;el("feedback").textContent="";el("next").hidden=true;el("choices").innerHTML=q.options.map((c,i)=>'<button class="choice" data-answer="'+i+'" style="--c:'+["#e8f8ff","#fff1ce","#f7e8ff","#e7ffec"][i]+'">'+c+'</button>').join("");speak(q.speech);}
function answer(i){if(correct)return;var q=deck[round],buttons=el("choices").querySelectorAll("button"),picked=q.options[i];if(picked===q.answer){correct=true;score++;buttons[i].classList.add("correct");el("feedback").textContent=["야호! 정말 잘했어요! 🌟","딩동댕! 멋진 탐험이야! 🐯","대단해! 반짝반짝! ✨"][Math.floor(random()*3)];el("next").hidden=false;speak("정답! 정말 잘했어요!");try{var k="joiland-academy-progress-"+dayKey+"-"+subject;var stats=JSON.parse(localStorage.getItem(k)||"{}");stats[games[subject][selected].name]=(stats[games[subject][selected].name]||0)+1;localStorage.setItem(k,JSON.stringify(stats));}catch(e){}}else{buttons[i].classList.add("wrong");el("feedback").textContent="조금만 더 생각해 볼까? 💛";speak("다시 찾아볼까?");}}
el("menu").addEventListener("click",e=>{var b=e.target.closest("[data-i]");if(b)start(+b.dataset.i);});el("choices").addEventListener("click",e=>{var b=e.target.closest("[data-answer]");if(b)answer(+b.dataset.answer);});el("back").onclick=menu;el("next").onclick=()=>{if(round===4){el("feedback").textContent="🎉 다섯 문제 끝! 오늘도 신나게 배웠어요!";setTimeout(menu,850);}else{round++;render();}};el("listen").onclick=()=>speak(deck[round].speech);el("music").onclick=()=>{if(window.JoyBgm){window.JoyBgm.setMuted(!window.JoyBgm.muted);el("music").textContent=window.JoyBgm.muted?"🔇":"🎵";}else{voiceOff=!voiceOff;el("music").textContent=voiceOff?"🔇":"🎵";}};window.addEventListener("pagehide",()=>{try{speechSynthesis.cancel();}catch(e){}});menu();
})();
</script></body></html>
