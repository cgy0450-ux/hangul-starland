function render(){correct=false;var q=deck[round];el("counter").textContent=(round+1)+" / 5";el("score").textContent="⭐ "+score;el("visual").textContent=q.visual;el("visual").style.whiteSpace="pre-line";el("prompt").textContent=q.ask;el("hint").textContent=q.hint;el("feedback").textContent="";el("next").hidden=true;el("choices").innerHTML=q.options.map((c,i)=>'<button class="choice" data-answer="'+i+'" style="--c:'+["#e8f8ff","#fff1ce","#f7e8ff","#e7ffec"][i]+'">'+c+'</button>').join("");speak(q.speech);}

el("menu").addEventListener("click",e=>{var b=e.target.closest("[data-i]");if(b)start(+b.dataset.i);});el("choices").addEventListener("click",e=>{var b=e.target.closest("[data-answer]");if(b)answer(+b.dataset.answer);});el("back").onclick=menu;el("next").onclick=()=>{if(round===4){el("feedback").textContent="🎉 다섯 문제 끝! 오늘도 신나게 배웠어요!";setTimeout(menu,850);}else{round++;render();}};el("listen").onclick=()=>speak(deck[round].speech);el("music").onclick=()=>{if(window.JoyBgm){window.JoyBgm.setMuted(!window.JoyBgm.muted);el("music").textContent=window.JoyBgm.muted?"🔇":"🎵";}else{voiceOff=!voiceOff;el("music").textContent=voiceOff?"🔇":"🎵";}};window.addEventListener("pagehide",()=>{try{speechSynthesis.cancel();}catch(e){}});menu();
})();
</script></body></html>
