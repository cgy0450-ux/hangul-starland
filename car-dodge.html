<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#674ab4"><title>쪼이랜드 · 자동차 장애물 피하기</title>
<style>
:root{font-family:system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:#45336e}*{box-sizing:border-box}html,body{margin:0;min-height:100%;overscroll-behavior:none}body{background:radial-gradient(circle at 10% 8%,#fff6bc,transparent 43%),radial-gradient(circle at 95% 90%,#bff9ff,transparent 48%),#eae4ff;display:flex;flex-direction:column;min-height:100dvh}header{display:flex;align-items:center;gap:9px;justify-content:space-between;padding:9px 12px;max-width:750px;width:100%;margin:0 auto}header a,header button{border:3px solid #fff;background:white;border-radius:15px;color:#60439f;padding:9px 11px;font-size:14px;font-weight:900;text-decoration:none}h1{font-size:clamp(17px,4vw,26px);margin:0;flex:1;text-align:center}main{max-width:750px;width:100%;margin:0 auto;padding:3px 11px 12px;flex:1;min-height:0;display:flex;flex-direction:column;align-items:stretch;gap:8px}.scorebar{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:clamp(14px,3vw,19px);font-weight:950}.scorebar span{background:#fff;border:3px solid white;border-radius:14px;padding:8px 12px}.board{position:relative;width:100%;max-width:510px;min-height:260px;flex:1;margin:auto;border:7px solid #fff;border-radius:26px;overflow:hidden;background:#b4eac7;box-shadow:0 8px 0 #c9b6e7;touch-action:none;user-select:none;max-height:72dvh}canvas{height:100%;width:100%;display:block;touch-action:none}.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#201a5b99;padding:13px}.overlay.hidden{display:none}.modal{max-width:360px;background:#fff8e3;border:6px solid white;border-radius:25px;text-align:center;padding:17px;box-shadow:0 8px 0 #d3bc6c}.modal h2{font-size:clamp(23px,5vw,32px);margin:4px 0 8px}.modal p{font-size:15px;line-height:1.5}.modal button,.actions button,.steer button{border:0;background:#7455d5;border-radius:17px;padding:12px 19px;color:white;font-weight:950;font-size:18px;box-shadow:0 5px 0 #4e359a;touch-action:manipulation}.actions{display:flex;justify-content:center;gap:9px;align-items:center}.actions button{background:#fff;color:#6445a0;box-shadow:0 4px 0 #cdb9e4;padding:10px}.steer{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:min(450px,100%);margin:0 auto}.steer button{background:#f7e5ff;color:#523e91;border:4px solid white;min-height:63px;touch-action:none}.hint{text-align:center;font-size:12px;color:#72618d;margin:0}.modal button:focus-visible,.steer button:focus-visible{outline:4px solid #27bbcc}@media(max-height:700px){header{padding:4px}.board{min-height:190px;max-height:60dvh}.steer button{min-height:48px;padding:6px}.scorebar span{padding:4px 7px}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body><header><a href="./requests.html">‹ 요청 놀이터</a><h1>🚙 자동차 장애물 피하기</h1><button id="sound" aria-label="소리 설정">🔊</button></header><main>
<div class="scorebar"><span id="score">⭐ 0점</span><span id="best">🏆 최고 0점</span><span id="lives">💛💛💛</span></div>
<div class="board" id="board"><canvas id="road" aria-label="차선을 바꾸며 장애물을 피하는 자동차 게임"></canvas>
<div class="overlay" id="overlay"><div class="modal"><h2 id="message-title">🚗 쪼이 자동차 출발!</h2><p id="message">화면을 좌우로 움직이거나 아래 화살표를 눌러 장애물을 피하세요. 자동차는 3번까지 부딪혀도 괜찮아요!</p><button id="start">▶ 출발!</button></div></div></div>
<div class="steer"><button id="left" aria-label="왼쪽으로 차선 변경">◀ 왼쪽</button><button id="right" aria-label="오른쪽으로 차선 변경">오른쪽 ▶</button></div>
<div class="actions"><button id="pause">⏸ 잠깐 멈추기</button><button id="restart">↻ 처음부터</button></div>
<p class="hint">👆 좌우 버튼 · 도로 터치 · 손가락 좌우 움직이기로 운전해요</p>
</main>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),canvas=$('road'),board=$('board'),ctx=canvas.getContext('2d');
let playElapsed=0,timedOut=false;let w=400,h=570,carLane=1,obstacles=[],score=0,lives=3,best=0,running=false,paused=false,last=0,spawnClock=0,roadOffset=0,invulnerable=0,raf=0,started=false,soundOn=true;
try{best=Number(localStorage.getItem('joiland-car-best')||0)}catch(e){}
try{soundOn=JSON.parse(localStorage.getItem('hangul-starland-v1')||'{}').sound!==false}catch(e){}
function updateUI(){$('score').textContent='⭐ '+score+'점';$('best').textContent='🏆 최고 '+best+'점';$('lives').textContent='💛'.repeat(lives)+'🤍'.repeat(3-lives);$('sound').textContent=soundOn?'🔊':'🔇';$('pause').textContent=paused?'▶ 계속하기':'⏸ 잠깐 멈추기'}
function beep(){if(!soundOn||!('speechSynthesis'in window))return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance('앗! 다시 해보자!');u.lang='ko-KR';u.rate=1.1;speechSynthesis.speak(u)}catch(e){}}
function resize(){const r=board.getBoundingClientRect();w=Math.max(200,r.width-14);h=Math.max(220,r.height-14);const d=Math.min(2,devicePixelRatio||1);canvas.width=Math.round(w*d);canvas.height=Math.round(h*d);ctx.setTransform(d,0,0,d,0,0);draw()}
function laneX(i){return w*(.23+i*.27)}
function roundRect(x,y,width,height,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(x,y,width,height,r);ctx.fill()}
function car(x,y,bad=false){ctx.save();ctx.translate(x,y);const width=Math.max(37,Math.min(57,w*.13));roundRect(-width/2,-34,width,68,13,bad?'#eb676d':'#5088e9');roundRect(-width*.37,-22,width*.74,24,7,bad?'#ffe4a8':'#d9f8ff');roundRect(-width*.38,11,width*.76,13,4,bad?'#aa303a':'#274dac');roundRect(-width*.62,-18,8,20,3,'#383d58');roundRect(width*.48,-18,8,20,3,'#383d58');ctx.fillStyle='#fffcad';ctx.fillRect(-width*.35,-33,10,6);ctx.fillRect(width*.35-10,-33,10,6);ctx.restore()}
function draw(){ctx.clearRect(0,0,w,h);ctx.fillStyle='#a1e4a6';ctx.fillRect(0,0,w,h);const roadLeft=w*.075,roadWidth=w*.85;roundRect(roadLeft,0,roadWidth,h,12,'#626c7e');ctx.fillStyle='#f7edbb';ctx.fillRect(roadLeft+6,0,5,h);ctx.fillRect(roadLeft+roadWidth-11,0,5,h);ctx.fillStyle='#eaf6ff';for(let i=1;i<3;i++){const x=roadLeft+roadWidth*i/3;for(let y=(roadOffset%72)-72;y<h;y+=72)ctx.fillRect(x-3,y,6,36)}ctx.font=Math.max(20,Math.min(34,w*.075))+'px sans-serif';for(const o of obstacles){const y=o.y; if(o.type==='cone'){ctx.textAlign='center';ctx.fillText('🚧',laneX(o.lane),y+10)}else car(laneX(o.lane),y,true)}if(invulnerable<=0||Math.floor(invulnerable*8)%2===0)car(laneX(carLane),h-80,false)}
function hideOverlay(){$('overlay').classList.add('hidden')}
function showOverlay(title,msg,button){$('message-title').textContent=title;$('message').textContent=msg;$('start').textContent=button;$('overlay').classList.remove('hidden')}
function reset(){playElapsed=0;timedOut=false;carLane=1;obstacles=[];score=0;lives=3;spawnClock=0;roadOffset=0;invulnerable=0;running=true;paused=false;started=true;last=0;hideOverlay();updateUI();cancelAnimationFrame(raf);raf=requestAnimationFrame(frame)}
function finishTime(){if(timedOut)return;timedOut=true;running=false;paused=false;started=false;cancelAnimationFrame(raf);showOverlay('🏆 5분 자동차 챔피언!','5분 동안 장애물 사이를 멋지게 달렸어요! 트로피를 받았어요!','🏠 다른 놀이 하기');updateUI()}
function end(){running=false;paused=false;started=false;cancelAnimationFrame(raf);showOverlay('🎉 '+score+'점! 잘했어!','다시 도전해서 장애물을 더 많이 피할 수 있어요.','↻ 다시 출발');updateUI()}
function shift(n){if(!running||paused)return;carLane=Math.max(0,Math.min(2,carLane+n));draw()}
function setLane(x){if(!running||paused)return;const r=board.getBoundingClientRect(),px=(x-r.left-7)/Math.max(1,w);carLane=px<.36?0:px<.63?1:2;draw()}
function frame(time){if(!running||paused)return;if(!last)last=time;const dt=Math.min(.055,(time-last)/1000);last=time;playElapsed+=dt;if(playElapsed>=300){finishTime();return}roadOffset+=dt*(240+score*2);spawnClock+=dt;const interval=Math.max(.95,1.6-score*.012);if(spawnClock>=interval){spawnClock=0;const lane=Math.floor(Math.random()*3);obstacles.push({lane,y:-50,type:Math.random()<.6?'cone':'car',passed:false})}
const speed=Math.min(370,185+score*4);invulnerable=Math.max(0,invulnerable-dt);
for(const o of obstacles){o.y+=speed*dt;if(!o.passed&&o.y>h-15){o.passed=true;score++;if(score>best){best=score;try{localStorage.setItem('joiland-car-best',String(best))}catch(e){}}}if(invulnerable===0&&o.lane===carLane&&Math.abs(o.y-(h-80))<47){lives--;invulnerable=1.5;o.passed=true;o.y=h+100;beep();if(lives<=0){updateUI();draw();end();return}}}
obstacles=obstacles.filter(o=>o.y<h+90);updateUI();draw();raf=requestAnimationFrame(frame)}
$('start').onclick=()=>{if(timedOut){location.href='./requests.html';return}if(paused){paused=false;hideOverlay();last=0;raf=requestAnimationFrame(frame)}else reset()};
$('left').onclick=()=>shift(-1);$('right').onclick=()=>shift(1);
$('pause').onclick=()=>{if(!running)return;if(paused){paused=false;hideOverlay();last=0;raf=requestAnimationFrame(frame)}else{paused=true;cancelAnimationFrame(raf);showOverlay('⏸ 잠깐 쉬어요','준비되면 계속하기를 눌러 주세요.','▶ 계속하기')}updateUI()};
$('restart').onclick=reset;
let startX=0;board.addEventListener('pointerdown',e=>{if(e.target.closest('.overlay'))return;startX=e.clientX;e.preventDefault()});board.addEventListener('pointerup',e=>{if(e.target.closest('.overlay'))return;if(Math.abs(e.clientX-startX)>30)shift(e.clientX>startX?1:-1);else setLane(e.clientX);e.preventDefault()});
window.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a'){shift(-1);e.preventDefault()}if(e.key==='ArrowRight'||e.key==='d'){shift(1);e.preventDefault()}});
$('sound').onclick=()=>{soundOn=!soundOn;updateUI();try{const o=JSON.parse(localStorage.getItem('hangul-starland-v1')||'{}');o.sound=soundOn;localStorage.setItem('hangul-starland-v1',JSON.stringify(o))}catch(e){}};
window.addEventListener('resize',resize);document.addEventListener('visibilitychange',()=>{if(document.hidden&&running&&!paused){paused=true;cancelAnimationFrame(raf);showOverlay('⏸ 잠깐 쉬어요','돌아오면 계속할 수 있어요.','▶ 계속하기');updateUI()}});
updateUI();requestAnimationFrame(resize);
})();
</script><script src="./joiland-unified.js"></script></body></html>
