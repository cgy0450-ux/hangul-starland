<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>새 쪼이 목소리 듣기</title><style>body{margin:0;padding:22px;font:17px/1.7 system-ui;background:#f2f3e7;color:#31563e}main{max-width:560px;margin:20px auto;background:#fffdf2;padding:24px;border-radius:26px}img{display:block;width:140px;height:140px;object-fit:contain;margin:auto}h1{font-size:27px}h2{font-size:19px}audio{width:100%;min-height:54px}a{display:inline-block;padding:12px;color:#31563e}p{font-size:14px}</style></head><body><main><img src="./joyi-read.svg" alt="쪼이 호랑이"><h1>새 쪼이 목소리를 들어봐요</h1><p>무료 공개 AI 모델로 미리 제작한 실제 음원이에요. 재생 버튼을 눌러 들어보세요.</p><h2>쪼이의 인사</h2><audio id="greeting" aria-label="쪼이 인사말 듣기" controls preload="metadata" src="./assets/audio/c414605bd5ef9d109335.mp3"></audio><h2>동화 읽어주기</h2><audio aria-label="새 목소리 동화 듣기" controls preload="metadata" src="./assets/audio/d9ee613dff527edecb36.mp3"></audio><p>동화 전 장면과 주요 안내에 적용했어요. 아직 제작하지 않은 문장과 영어는 기기 음성으로 읽어요.</p><a href="./stories.html">동화 보러 가기</a><a href="./parent.html">목소리 설정</a><a href="./requests.html">놀이터</a></main><script>document.querySelectorAll('audio').forEach(a=>a.addEventListener('play',()=>document.querySelectorAll('audio').forEach(b=>{if(a!==b)b.pause()})));if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});</script></body></html>
