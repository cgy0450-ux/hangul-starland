.installbox{margin:22px 0;padding:20px;border:3px solid #d7d0fb;border-radius:22px;background:#f6f3ff}.installbox h3{font-size:22px;color:#5948a8;margin:0 0 8px}.installbox p{font-size:15px;line-height:1.7}.installbox .largebtn{min-height:52px;font-size:18px;padding:9px 16px}
/* 3.0: 5세 놀이 중심 한글 길잡이 · 음성 설정 */
.journey-banner{border:0;display:flex;align-items:center;justify-content:space-between;gap:18px;width:100%;text-align:left;background:linear-gradient(110deg,#fff3a6,#ffe3bd 45%,#ffe3f1);border-radius:27px;padding:20px 25px;margin:8px 0 15px;border-bottom:7px solid #f5c36c;box-shadow:0 9px 22px #a3786a22;color:#624094}

.lesson-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:15px 0}.lesson-help{font-size:17px;color:#766f99;text-align:center;font-weight:850}.lesson-number{font-size:13px;color:#766f99;font-weight:850}
.voice-panel{background:#fff9e1;border:2px solid #f6db98;border-radius:23px;padding:18px;margin:18px 0}.voice-panel h3{margin:0 0 7px;font-size:23px}.voice-panel p{font-size:15px;line-height:1.6;margin:8px 0}.voice-select{width:100%;min-height:52px;border:2px solid #cfc3f5;background:white;border-radius:13px;color:#3d318a;font-size:18px;font-weight:850;padding:8px;margin:5px 0 13px}.tone-choices{display:flex;flex-wrap:wrap;gap:9px}.tone-choice{min-height:48px;border:2px solid #cfc3f5;background:#fff;border-radius:15px;padding:10px;color:#5348a4;font-weight:900}.tone-choice.active{background:#5f4dcb;color:white;border-color:#5f4dcb}.voice-hint{font-size:13px!important;color:#6a6082}

/* v4 — 독창적인 동물·자동차 학습 테마와 손가락 획순 길잡이 */
:root{--sunshine:#fff8cb;--peach:#ffcfaa;--minty:#dcfff0}
.topbar .refresh-pill{background:#e7fff6;color:#207967;font-size:15px}
.modegrid{grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}
.modecard{min-height:186px;border-radius:25px;overflow:hidden;position:relative;transform-origin:center}
.modecard::before{content:'✦';position:absolute;right:20px;top:15px;color:#ffffffaa;font-size:38px}
.modecard:hover{filter:saturate(1.13);transform:translateY(-3px)}
.hero{min-height:200px}.hero h1{font-size:clamp(30px,4.5vw,51px)}
.zoo-scene{width:100%;height:200px;border-radius:40% 43% 22% 22%;background:linear-gradient(#d8f7ff 0%,#f2fff7 70%,#96e6a5 71%);filter:none;overflow:hidden;position:relative;box-shadow:inset 0 -8px #66c5a0,0 10px 20px #b8e8db}

 {id:'build',name:'낱말 만들기',desc:'글자를 순서대로 놓아요',emoji:'🧩',bg:'#fff1d3',edge:'#f5c879'},
 {id:'trace',name:'글씨 쓰기',desc:'손가락으로 쓱쓱 써요',emoji:'✍️',bg:'#e5ffeb',edge:'#98e3a8'},
 {id:'space',name:'우주 글자 탐험',desc:'별나라에서 글자를 찾아요',emoji:'🚀',bg:'#e6e4ff',edge:'#aaa4ec'},
 {id:'color',name:'무지개 글씨',desc:'알록달록 색칠해요',emoji:'🎨',bg:'#ffe5e8',edge:'#f5abb9'},
  {id:'family',name:'우리 가족 이름',desc:'내 이름, 엄마·아빠 이름 써요',emoji:'🏠',bg:'#f9e8d7',edge:'#edba89'},
  {id:'safari',name:'동물 자동차 여행',desc:'동물 친구와 드라이브해요',emoji:'🚗',bg:'#e1fff2',edge:'#77d9b4'}
];
// 3.0 한글 놀이 경로: 그림·말 → 모음 → 자음 → 자모 결합 → 낱말
const LESSONS=[
 {name:'그림과 소리',emoji:'🍎',desc:'친숙한 물건의 이름을 들어요',kind:'picture',items:[['사과','🍎'],['나무','🌳'],['우유','🥛'],['오리','🦆'],['포도','🍇']]},
 {name:'모음 친구',emoji:'🌈',desc:'아, 어, 오, 우, 이',kind:'vowel',items:[['ㅏ','아','아기'],['ㅓ','어','어항'],['ㅗ','오','오리'],['ㅜ','우','우산'],['ㅣ','이','이빨']]},
 {name:'자음 친구',emoji:'🐣',desc:'기역, 니은, 디귿, 미음, 시옷',kind:'consonant',items:[['ㄱ','기역','가방'],['ㄴ','니은','나무'],['ㄷ','디귿','다리'],['ㅁ','미음','모자'],['ㅅ','시옷','사과']]},
 {name:'글자 합치기',emoji:'🧩',desc:'ㄱ과 ㅏ가 만나면 가!',kind:'blend',items:[['ㄱ','ㅏ','가'],['ㄴ','ㅏ','나'],['ㅁ','ㅏ','마'],['ㅅ','ㅏ','사'],['ㄱ','ㅗ','고']]},
 {name:'낱말 읽기',emoji:'📖',desc:'그림을 보고 글자를 골라요',kind:'word',items:[['사과','🍎'],['나무','🌳'],['바다','🌊'],['하마','🦛'],['오리','🦆']]}
];
// 첫걸음 글자는 모양 길잡이로 시범을 보여주며, 획순 자체를 자동 채점하지 않습니다.
// 한글 쓰기 길잡이는 아래의 벡터 경로 데이터를 사용합니다.
const PRAISE_VARIANTS=[name=>`${name} 참 잘했어요!`,name=>`우리 ${name} 잘하네!`,name=>`와, ${name} 정말 멋지다!`,name=>`${name} 최고야!`];
function childNickname(){const name=String(state.family?.kid||'');const chars=[...name];return chars.length>=2?chars.slice(-2).join('')+'이':'친구';}
function praiseText(){return PRAISE_VARIANTS[(state.stars+(view.round||0))%PRAISE_VARIANTS.length](childNickname());}
function sayPraise(){say(praiseText());}
const TONES={warm:{label:'🌷 다정하게',rate:.88,pitch:1.02},bright:{label:'🌟 밝게',rate:.98,pitch:1.15},slow:{label:'🐢 또박또박',rate:.76,pitch:1.0}};
let installPrompt=null;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;});
const ROOT=document.getElementById('app');const STOREKEY='hangul-starland-v1';
function initialState(){return {sound:true,stars:0,seen:{},counts:{},daily:{},breakShown:false,voiceKey:'',voiceTone:'warm',lessonLevel:0,lessonDone:{},family:{kid:'',mom:'',dad:''},familyDone:{}};}
let state=initialState();try{const existing=JSON.parse(localStorage.getItem(STOREKEY)||'null');if(existing&&typeof existing==='object'){state={...initialState(),...existing};}}catch(e){}
// 1회 설정용 URL 프래그먼트: 이름은 웹서버로 전송하지 않고 기기 내부에만 저장합니다.
try{const raw=new URLSearchParams(location.hash.replace(/^#/,'' )).get('family');if(raw){const names=raw.split('|').map(x=>x.trim());if(names.length===3&&names.every(x=>/^[가-힣]{2,5}$/.test(x))){state.family={kid:names[0],mom:names[1],dad:names[2]};try{localStorage.setItem(STOREKEY,JSON.stringify(state));}catch(e){}history.replaceState(null,'',location.href.split('#')[0]);}}}catch(e){}
const today=()=>new Date().toLocaleDateString('sv-SE');
function persist(){try{localStorage.setItem(STOREKEY,JSON.stringify(state));}catch(e){}}
function gain(mode,id){const key=today()+':'+mode+':'+id;if(state.seen[key])return false;state.seen[key]=1;state.stars+=1;state.counts[mode]=(state.counts[mode]||0)+1;state.daily[today()]=(state.daily[today()]||0)+1;persist();return true;}
function scrambleWord(word){const target=[...word];let arr=target.map((s,i)=>({s,i}));if(target.length<2)return arr;for(let n=0;n<12;n++){const shuffled=random(arr);if(shuffled.map(x=>x.s).join('')!==word)return shuffled;}return arr.reverse();}
function random(a){const b=a.slice();for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}
let view={mode:'home',tab:'consonants',selected:0,round:0,deck:[],q:null,answered:false,wrong:null,chosen:[],palette:'#ff6584',strokes:[],drawing:false,lesson:0};
let toastTimer=null,sessionStart=Date.now(),breakDismissed=false;
// 휴대기기에 설치된 무료 한국어 음성만 사용합니다. 유료 TTS API를 호출하지 않습니다. 일부 시스템 음성은 인터넷을 사용할 수 있습니다.
let speechToken=0,speechTimer=null,voiceList=[];
function availableKoreanVoices(){if(!('speechSynthesis' in window))return [];try{return window.speechSynthesis.getVoices().filter(v=>String(v.lang).toLowerCase().startsWith('ko'));}catch(e){return [];}}
function refreshVoices(){voiceList=availableKoreanVoices();const select=document.getElementById('voice-choice');if(!select)return;const current=state.voiceKey||'';select.innerHTML='<option value="">기본 한국어 목소리</option>'+voiceList.map(v=>`<option value="${esc(v.voiceURI||v.name)}">${esc(v.name)}${v.localService?' · 기기 음성':''}</option>`).join('');select.value=voiceList.some(v=>(v.voiceURI||v.name)===current)?current:'';const status=document.getElementById('voice-status');if(status)status.textContent=voiceList.length?`한국어 목소리 ${voiceList.length}개 발견 · 선택 즉시 저장됩니다.`:'한국어 목소리를 아직 찾지 못했어요. 기기 음성 설정을 확인해 주세요.';}
function esc(value){return String(value).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
if('speechSynthesis' in window){window.speechSynthesis.addEventListener?.('voiceschanged',refreshVoices);refreshVoices();}
function stopSpeech(){speechToken++;if(speechTimer!==null){clearTimeout(speechTimer);speechTimer=null;}try{window.speechSynthesis?.cancel();}catch(e){}}
function speakParts(parts,pauseMs=560){stopSpeech();if(!state.sound||!('speechSynthesis' in window))return;const token=speechToken;const phrases=parts.map(x=>String(x||'').trim()).filter(Boolean);let index=0;
 function nextPart(){if(token!==speechToken||!state.sound||index>=phrases.length)return;const u=new SpeechSynthesisUtterance(phrases[index++]);u.lang='ko-KR';const tone=TONES[state.voiceTone]||TONES.warm;u.rate=tone.rate;u.pitch=tone.pitch;u.volume=1;const voices=availableKoreanVoices();const chosen=voices.find(v=>(v.voiceURI||v.name)===state.voiceKey);u.voice=chosen||voices.find(v=>/female|woman|여성|google.*한국어/i.test(v.name))||voices[0]||null;
  let finished=false;function advance(){if(finished||token!==speechToken)return;finished=true;if(index<phrases.length)speechTimer=setTimeout(()=>{speechTimer=null;nextPart();},pauseMs);}
  u.onend=advance;u.onerror=advance;try{window.speechSynthesis.speak(u);}catch(e){advance();}
 }
 nextPart();
}
function say(text){speakParts([text]);}
function sayLetterExample(entry,tab){const first=tab==='consonants'?entry[1]:tab==='vowels'?entry[1]:entry[0];speakParts([first,entry[2]],650);}

function alertToast(message){document.querySelector('.toast')?.remove();const d=document.createElement('div');d.className='toast';d.setAttribute('role','status');d.textContent=message;document.body.appendChild(d);clearTimeout(toastTimer);toastTimer=setTimeout(()=>d.remove(),2600);}

function setupGuidedCanvas(strokes){const c=document.querySelector('#trace-canvas');if(!c)return;const ctx=c.getContext('2d'),dpr=Math.min(devicePixelRatio||1,2);const size=c.clientWidth||340;c.width=Math.round(size*dpr);c.height=Math.round(size*dpr);ctx.setTransform(c.width/100,0,0,c.height/100,0,0);let active=null,points=[];

if(action==='trace-undo'){view.traceDone=view.traceDone||[];view.traceDone.pop();view.answered=false;guidedWrite();return;}
if(action==='trace-clear'){view.traceDone=[];view.answered=false;guidedWrite();return;}
if(action==='journey-map'){journeyMap();return;}if(action==='journey-level'){startJourney(el.dataset.index);return;}if(action==='journey-hear'){speakParts(journeyPrompt());return;}if(action==='journey-answer'){if(view.answered)return;const i=Number(el.dataset.index),opt=view.q[i],kind=LESSONS[view.lesson].kind;const picked=kind==='blend'?opt[2]:opt[0];if(picked!==journeyCorrect()){view.wrong=i;journeyPlay();say('다시 한 번 해 볼까?');return;}view.answered=true;gain('journey',view.lesson+':'+journeyCorrect());journeyPlay();sayPraise();return;}if(action==='tone'){if(!TONES[el.dataset.tone])return;state.voiceTone=el.dataset.tone;persist();parent();sayPraise();return;}if(action==='voice-test'){sayPraise();return;}if(action==='show-stroke'){const el=document.getElementById('stroke-demo');if(el){el.classList.remove('play');void el.offsetWidth;el.classList.add('play');}return;}if(action==='home'){home();return;}if(action==='sound'){state.sound=!state.sound;if(!state.sound)stopSpeech();persist();const m=view.mode;if(m==='home')home();else if(m==='learn')learn();else if(m==='parent')parent();else renderMode();if(state.sound)say('안녕! 함께 한글 놀이 해요!');return;}if(action==='open'){start(el.dataset.mode);return;}if(action==='break'){breakDismissed=true;renderCurrent();return;}if(action==='parent'){parent();return;}if(action==='install'){if(installPrompt){const prompt=installPrompt;installPrompt=null;prompt.prompt().catch(()=>{alertToast('브라우저 메뉴에서 홈 화면에 추가해 주세요.');});}else{alertToast('브라우저 메뉴에서 앱 설치 또는 홈 화면에 추가를 눌러 주세요.');}return;}if(action==='reset'){const answer=window.confirm('정말 모든 별과 학습 기록을 지울까요?');if(answer){const family=state.family,voiceKey=state.voiceKey,voiceTone=state.voiceTone;state={...initialState(),family,voiceKey,voiceTone};persist();parent();}return;}if(action==='next'){next();return;}if(action==='read'){say(el.dataset.text);return;}if(action==='tab'){view.tab=el.dataset.tab;view.selected=0;learn();return;}if(action==='letter'){view.selected=+el.dataset.index;const x=dataset()[view.selected];gain('learn',view.tab+':'+view.selected);learn();sayLetterExample(x,view.tab);return;}if(action==='read-letter'){const x=dataset()[view.selected];sayLetterExample(x,view.tab);return;}
 if(action==='answer-quiz'||action==='answer-space'){if(view.answered)return;const i=+el.dataset.index;const right=view.mode==='quiz'?view.q[i].w===view.deck[view.round].w:view.q[i][0]===view.deck[view.round][0];if(!right){view.wrong=i;el.classList.add('bad');markAnswer(false);return;}markAnswer(true,view.mode,view.deck[view.round].w||view.deck[view.round][0]);return;}
 if(action==='pick'){if(view.answered)return;const i=+el.dataset.index;if(view.chosen.includes(i))return;view.chosen.push(i);const item=view.deck[view.round];if(view.chosen.length===[...item.w].length){const attempt=view.chosen.map(x=>view.q[x].s).join('');if(attempt===item.w){view.answered=true;gain('build',item.w);sayPraise();renderMode();}else{alertToast('순서를 바꿔서 다시 만들어 봐요 💗');say('한 번 더 해 볼까요?');renderMode();}}else renderMode();return;}
 if(action==='undo'){view.chosen.pop();renderMode();return;}if(action==='clear-choose'){view.chosen=[];renderMode();return;}
 if(action==='color'){view.palette=el.dataset.color;document.querySelectorAll('.color-dot').forEach(x=>x.classList.toggle('selected',x.dataset.color===view.palette));return;}
 if(action==='undo-stroke'){view.strokes.pop();renderMode();return;}if(action==='clear-strokes'){view.strokes=[];renderMode();return;}
 if(action==='finish-draw'){if(view.mode!=='color'||!view.strokes.some(s=>s.points.length>=3))return;view.answered=true;gain('color',view.deck[view.round][0]);say('멋지게 꾸몄네!');renderMode();return;}
}
async function refreshApp(){if(!navigator.onLine){alertToast('지금은 인터넷이 꺼져 있어요. 연결한 뒤 다시 눌러 주세요.');return;}alertToast('새 버전을 확인하고 있어요…');try{if('serviceWorker' in navigator){const reg=await navigator.serviceWorker.getRegistration();if(reg)await reg.update();}const url=new URL('./index.html',location.href);url.searchParams.set('_refresh',Date.now().toString());const reply=await fetch(url.toString(),{cache:'no-store'});if(!reply.ok)throw Error('HTTP '+reply.status);location.reload();}catch(e){alertToast('새로고침을 완료하지 못했어요. 인터넷을 확인해 주세요.');}}
function renderCurrent(){if(view.mode==='journey-map')journeyMap();else if(view.mode==='home')home();else if(view.mode==='learn')learn();else if(view.mode==='parent')parent();else if(view.mode==='family-home')familyHome();else if(view.mode==='stickers')stickerBook();else renderMode();}
ROOT.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b)handle(b.dataset.a,b);});ROOT.addEventListener('submit',e=>{if(e.target?.id!=='family-form')return;e.preventDefault();const input=new FormData(e.target);const family=Object.fromEntries(['kid','mom','dad'].map(k=>[k,String(input.get(k)||'').trim()]));if(!Object.values(family).every(v=>/^[가-힣]{2,5}$/.test(v))){alertToast('이름은 한글 2~5글자로 입력해 주세요.');return;}state.family=family;persist();parent();alertToast('가족 이름을 태블릿에 안전하게 저장했어요!');});
ROOT.addEventListener('change',e=>{if(e.target?.id==='voice-choice'){state.voiceKey=e.target.value;persist();sayPraise();}});
window.addEventListener('resize',()=>{if((view.mode==='trace'||view.mode==='color')&&!view.answered)renderMode();});
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){window.addEventListener('load',()=>{navigator.serviceWorker.register('./sw.js').catch(()=>{});});}
home();
window.HANGUL_QA={state:()=>JSON.parse(JSON.stringify(state)),go:start,view:()=>({mode:view.mode,round:view.round,lesson:view.lesson,answered:view.answered,chosen:view.chosen.slice()}),journey:(n)=>startJourney(n),voices:()=>availableKoreanVoices().map(v=>v.name),speakParts,glyphStrokes,traceEvaluation,family:()=>familyData(),reset:()=>{state=initialState();persist();home();}};
})();
</script>
