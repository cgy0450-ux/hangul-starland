const STROKE_GUIDES={
 'ㄱ':['M17 25 H82 V83'],'ㄴ':['M23 17 V82 H83'],
 'ㅏ':['M44 15 V86','M44 50 H80'],'ㅓ':['M19 50 H59','M59 15 V86'],

const PRAISE='잘했어! 쪼이~!';
const TONES={warm:{label:'🌷 다정하게',rate:.88,pitch:1.02},bright:{label:'🌟 밝게',rate:.98,pitch:1.15},slow:{label:'🐢 또박또박',rate:.76,pitch:1.0}};
let installPrompt=null;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;});
const ROOT=document.getElementById('app');const STOREKEY='hangul-starland-v1';
function initialState(){return {sound:true,stars:0,seen:{},counts:{},daily:{},breakShown:false,voiceKey:'',voiceTone:'warm',lessonLevel:0,lessonDone:{}};}
let state=initialState();try{const existing=JSON.parse(localStorage.getItem(STOREKEY)||'null');if(existing&&typeof existing==='object'){state={...initialState(),...existing};}}catch(e){}
const today=()=>new Date().toLocaleDateString('sv-SE');
function persist(){try{localStorage.setItem(STOREKEY,JSON.stringify(state));}catch(e){}}
function gain(mode,id){const key=today()+':'+mode+':'+id;if(state.seen[key])return false;state.seen[key]=1;state.stars+=1;state.counts[mode]=(state.counts[mode]||0)+1;state.daily[today()]=(state.daily[today()]||0)+1;persist();return true;}
function scrambleWord(word){const target=[...word];let arr=target.map((s,i)=>({s,i}));if(target.length<2)return arr;for(let n=0;n<12;n++){const shuffled=random(arr);if(shuffled.map(x=>x.s).join('')!==word)return shuffled;}return arr.reverse();}
function random(a){const b=a.slice();for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}
let view={mode:'home',tab:'consonants',selected:0,round:0,deck:[],q:null,answered:false,wrong:null,chosen:[],palette:'#ff6584',strokes:[],drawing:false,lesson:0};
let toastTimer=null,sessionStart=Date.now(),breakDismissed=false;
// 휴대기기에 설치된 무료 한국어 음성만 사용합니다. 유료 TTS API를 호출하지 않습니다. 일부 시스템 음성은 인터넷을 사용할 수 있습니다.
let speechToken=0,speechTimer=null,voiceList=[];
function availableKoreanVoices(){if(!('speechSynthesis' in window))return [];try{return window.speechSynthesis.getVoices().filter(v=>String(v.lang).toLowerCase().startsWith('ko'));}catch(e){return [];}}
function refreshVoices(){voiceList=availableKoreanVoices();const select=document.getElementById('voice-choice');if(!select)return;const current=state.voiceKey||'';select.innerHTML='<option value="">기본 한국어 목소리</option>'+voiceList.map(v=>`<option value="${esc(v.voiceURI||v.name)}">${esc(v.name)}${v.localService?' · 기기 음성':''}</option>`).join('');select.value=voiceList.some(v=>(v.voiceURI||v.name)===current)?current:'';const status=document.getElementById('voice-status');if(status)status.textContent=voiceList.length?`한국어 목소리 ${voiceList.length}개 발견 · 선택 즉시 저장됩니다.`:'한국어 목소리를 아직 찾지 못했어요. 기기 음성 설정을 확인해 주세요.';}
function esc(value){return String(value).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
if('speechSynthesis' in window){window.speechSynthesis.addEventListener?.('voiceschanged',refreshVoices);refreshVoices();}
function stopSpeech(){speechToken++;if(speechTimer!==null){clearTimeout(speechTimer);speechTimer=null;}try{window.speechSynthesis?.cancel();}catch(e){}}
function speakParts(parts,pauseMs=560){stopSpeech();if(!state.sound||!('speechSynthesis' in window))return;const token=speechToken;const phrases=parts.map(x=>String(x||'').trim()).filter(Boolean);let index=0;
 function nextPart(){if(token!==speechToken||!state.sound||index>=phrases.length)return;const u=new SpeechSynthesisUtterance(phrases[index++]);u.lang='ko-KR';const tone=TONES[state.voiceTone]||TONES.warm;u.rate=tone.rate;u.pitch=tone.pitch;u.volume=1;const voices=availableKoreanVoices();const chosen=voices.find(v=>(v.voiceURI||v.name)===state.voiceKey);u.voice=chosen||voices.find(v=>/female|woman|여성|google.*한국어/i.test(v.name))||voices[0]||null;
  let finished=false;function advance(){if(finished||token!==speechToken)return;finished=true;if(index<phrases.length)speechTimer=setTimeout(()=>{speechTimer=null;nextPart();},pauseMs);}
  u.onend=advance;u.onerror=advance;try{window.speechSynthesis.speak(u);}catch(e){advance();}
 }
 nextPart();
}
function say(text){speakParts([text]);}
function sayLetterExample(entry,tab){const first=tab==='consonants'?entry[1]:tab==='vowels'?entry[1]:entry[0];speakParts([first,entry[2]],650);}

function alertToast(message){document.querySelector('.toast')?.remove();const d=document.createElement('div');d.className='toast';d.setAttribute('role','status');d.textContent=message;document.body.appendChild(d);clearTimeout(toastTimer);toastTimer=setTimeout(()=>d.remove(),2600);}
function header(){return `<header class="topbar"><button class="brand" data-a="home" aria-label="처음 화면으로" style="border:0;background:none;padding:0"><span class="brand-buddy">😊</span><span>글자별나라 <span aria-hidden="true">✨</span></span></button><div class="top-actions"><span class="pill star-pill">⭐ <span id="star-number">${state.stars}</span>개</span><button class="pill" data-a="sound" aria-label="소리 ${state.sound?'끄기':'켜기'}">${state.sound?'🔊 소리 켬':'🔇 소리 끔'}</button></div></header>`;}
function wrap(body){ROOT.innerHTML=`<div class="shell">${header()}<main class="mainpanel">${body}</main><footer class="footer"><span>🌈 틀려도 괜찮아요. 천천히 즐겨요!</span><button class="textbtn" data-a="parent">보호자</button></footer></div>`;}
function progress(){return `<div class="progress" aria-label="${Math.min(view.round,5)} / 5"><span class="topright-status">${Math.min(view.round+1,5)}/5</span>${[0,1,2,3,4].map(i=>`<span class="progdot ${i<=view.round?'on':''}"></span>`).join('')}</div>`;}
function screenHead(t,withProgress=true){return `<div class="screenhead"><button class="backbtn" data-a="home">⌂ 처음으로</button><h2>${t}</h2>${withProgress?progress():`<span class="topright-status">✨</span>`}</div>`;}
function breakHtml(){return !breakDismissed&&(Date.now()-sessionStart>=10*60*1000)?`<div class="break-banner" role="status">🌿 10분 동안 멋지게 놀았어요! 눈과 몸을 잠깐 쉬어볼까요? <button class="small-action" data-a="break">알겠어요</button></div>`:'';}
function home(){stopSpeech();view.mode='home';const cards=MODES.map(m=>`<button class="modecard" style="--bg:${m.bg};--edge:${m.edge}" data-a="open" data-mode="${m.id}"><span class="emoji" aria-hidden="true">${m.emoji}</span><strong>${m.name}</strong><span>${m.desc}</span></button>`).join('');const recommended=LESSONS[Math.min(Number(state.lessonLevel)||0,4)];wrap(`<div class="hero"><div><span class="eyebrow">💛 오늘도 신나는 한글 탐험</span><h1>글자 친구들과<br>함께 놀자!</h1><p>어떤 놀이부터 시작할까요?</p></div><div class="mascot-scene" aria-hidden="true">🌟</div></div><button class="journey-banner" data-a="journey-map"><span><strong>🚀 오늘의 한글 모험</strong><small>추천: ${recommended.emoji} ${recommended.name} · 5문제씩 천천히!</small></span><span class="rocket">🚀</span></button><div class="modegrid">${cards}</div>${breakHtml()}<div class="home-note"><span>✔ 광고 없음 · ✔ 로그인 없음 · ✔ 기록은 이 기기에만 저장</span><span>즐겁게 5~10분 놀이하고 쉬어요</span></div>`);}
function start(mode){stopSpeech();view={...view,mode,round:0,answered:false,wrong:null,chosen:[],deck:[],q:null,strokes:[],drawing:false};if(mode==='learn'){view.tab='consonants';view.selected=0;learn();return;}if(mode==='quiz'){view.deck=random(WORDS).slice(0,5);}if(mode==='build'){view.deck=random(WORDS.filter(x=>[...x.w].length>=2&&[...x.w].length<=3)).slice(0,5);}if(mode==='space'){view.deck=random(SYLLABLES).slice(0,5);}if(mode==='trace'){view.deck=random(['ㅏ','ㅓ','ㅗ','ㅜ','ㅣ','ㄱ','ㄴ'].map(x=>[x,x,x,'✏️'])).slice(0,5);}if(mode==='color'){view.deck=random(SYLLABLES).slice(0,5);}renderMode();}
function finish(){const thisMode=MODES.find(m=>m.id===view.mode);wrap(`${screenHead(thisMode.name,false)}<div class="board endboard"><div class="trophy">🏆</div><h3>잘했어! 쪼이~!</h3><p>글자 친구 다섯 명과 즐겁게 놀았어요.</p><div class="controls"><button class="largebtn green" data-a="open" data-mode="${view.mode}">한 번 더! ↻</button><button class="largebtn white" data-a="home">다른 놀이 하기</button></div></div>`);say(PRAISE);}
function markAnswer(correct,mode,identifier){if(!correct){alertToast('괜찮아요! 다시 찾아볼까요? 💗');say('다시 찾아볼까요?');return;}if(view.answered)return;view.answered=true;const gained=gain(mode,identifier);const counter=document.getElementById('star-number');if(counter)counter.textContent=state.stars;say(PRAISE);if(gained)alertToast('별 하나를 얻었어요! ⭐');renderMode();}
function renderMode(){if(view.round>=5){if(view.mode==='journey')journeyFinish();else finish();return;}if(view.mode==='journey')journeyPlay();if(view.mode==='quiz')quiz();if(view.mode==='build')build();if(view.mode==='space')space();if(view.mode==='trace')drawMode(false);if(view.mode==='color')drawMode(true);}
function next(){stopSpeech();view.round+=1;view.answered=false;view.wrong=null;view.chosen=[];view.strokes=[];view.q=null;renderMode();if(view.mode==='journey'&&view.round<5)speakParts(journeyPrompt());}
function nextBtn(){return `<button class="largebtn green" data-a="next">${view.round===4?'놀이 마치기 🎉':'다음 문제 ➜'}</button>`;}
function quiz(){const item=view.deck[view.round];if(!view.q){const distractors=random(WORDS.filter(x=>x.w!==item.w&&[...x.w].length>1)).slice(0,2);view.q=random([item,...distractors]);}
 wrap(`${screenHead('🍎 그림 낱말 퀴즈')}<p class="sectionhint">그림과 같은 낱말을 눌러 주세요!</p><div class="board"><div class="question-image" aria-label="${item.w}">${item.e}</div><div class="controls"><button class="small-action" data-a="read" data-text="${item.w}">🔊 이름 듣기</button></div><div class="choices">${view.q.map((x,i)=>`<button class="choice ${view.answered&&x.w===item.w?'good':view.wrong===i?'bad':''}" data-a="answer-quiz" data-index="${i}" ${view.answered?'disabled':''}>${x.w}</button>`).join('')}</div>${view.answered?`<div class="feedback">🎉 잘했어! 쪼이~! ${item.e} ${item.w}</div>${nextBtn()}`:'<span class="help">그림을 보고 세 가지 중에 골라요!</span>'}</div>${breakHtml()}`);}
function build(){const item=view.deck[view.round];if(!view.q){view.q=scrambleWord(item.w);}const chars=[...item.w];const taken=new Set(view.chosen);const assembled=view.chosen.map(i=>view.q[i].s).join('');const filled=chars.map((s,i)=>`<div class="slot ${view.chosen.length>i?'filled':''}">${view.chosen.length>i?[...assembled][i]:'?'}</div>`).join('');
 wrap(`${screenHead('🧩 낱말 만들기')}<p class="sectionhint">글자를 차례대로 눌러 낱말을 완성해요!</p><div class="board"><div class="question-image">${item.e}</div><button class="small-action" data-a="read" data-text="${item.w}">🔊 ${item.w} 듣기</button><div class="word-zone" aria-label="내가 만든 낱말">${filled}</div><div class="word-zone">${view.q.map((x,i)=>`<button class="syllable ${taken.has(i)?'used':''}" data-a="pick" data-index="${i}" ${taken.has(i)||view.answered?'disabled':''}>${x.s}</button>`).join('')}</div>${view.answered?`<div class="feedback">🎊 잘했어! 쪼이~! ${item.w}</div>${nextBtn()}`:`<div class="controls"><button class="largebtn white" data-a="undo" ${view.chosen.length?'':'disabled'}>↶ 하나 지우기</button><button class="largebtn white" data-a="clear-choose">처음부터</button></div>`}</div>${breakHtml()}`);}
function space(){const item=view.deck[view.round];if(!view.q){const distractors=random(SYLLABLES.filter(x=>x[0]!==item[0])).slice(0,2);view.q=random([item,...distractors]);}const colors=['#f8c64a','#7be7f0','#fa93c0'];wrap(`${screenHead('🚀 우주 글자 탐험')}<p class="sectionhint">${item[0]} 글자를 찾아 별을 모아요!</p><div class="board spacebg"><h3 class="question-title">“${item[0]}”를 찾아라!</h3><button class="largebtn gold" data-a="read" data-text="${item[0]}">🔊 글자 소리 듣기</button><div class="planetchoices">${view.q.map((x,i)=>`<button class="planet ${view.answered&&x[0]===item[0]?'good':view.wrong===i?'bad':''}" style="--planet:${colors[i]}" data-a="answer-space" data-index="${i}" ${view.answered?'disabled':''}>${x[0]}</button>`).join('')}</div>${view.answered?`<div class="feedback">🌟 잘했어! 쪼이~! ${item[0]}</div>${nextBtn()}`:'<p class="help" style="color:#ece7ff">동그란 행성을 눌러 보세요.</p>'}</div>${breakHtml()}`);}
function journeyMap(){stopSpeech();view.mode='journey-map';const current=Math.min(Number(state.lessonLevel)||0,4);wrap(`${screenHead('🚀 한글 모험 지도',false)}<p class="sectionhint">하루에 다 할 필요 없어요. 하고 싶은 단계를 골라요!</p><div class="lesson-map">${LESSONS.map((lesson,i)=>`<button class="lesson-tile ${state.lessonDone?.[i]?'done':''} ${i===current?'active':''}" data-a="journey-level" data-index="${i}"><span class="lesson-emoji">${lesson.emoji}</span><span>${i+1}. ${lesson.name}</span><span class="lesson-number">${state.lessonDone?.[i]?'✅ 해봤어요':i===current?'🌟 추천 단계':'언제든 해보기'}</span></button>`).join('')}</div><div class="board" style="min-height:240px"><h3 class="question-title">${LESSONS[current].emoji} 다음 모험: ${LESSONS[current].name}</h3><p class="sectionhint">${LESSONS[current].desc}</p><button class="largebtn green" data-a="journey-level" data-index="${current}">모험 시작! 🚀</button></div>`);}
function startJourney(level){stopSpeech();const n=Math.max(0,Math.min(LESSONS.length-1,Number(level)||0));view={...view,mode:'journey',lesson:n,round:0,answered:false,wrong:null,q:null,deck:LESSONS[n].items.slice()};journeyPlay();speakParts(journeyPrompt());}
function journeyCorrect(){const lesson=LESSONS[view.lesson];const answer=view.deck[view.round];if(lesson.kind==='picture'||lesson.kind==='word')return answer[0];if(lesson.kind==='blend')return answer[2];return answer[0];}
function journeyOptions(){const lesson=LESSONS[view.lesson];if(!view.q){const answer=view.deck[view.round];const other=lesson.items.filter(x=>x!==answer);view.q=random([answer,...random(other).slice(0,2)]);}return view.q;}
function journeyPrompt(){const kind=LESSONS[view.lesson].kind;const x=view.deck[view.round];if(kind==='picture')return [x[0]];if(kind==='vowel')return [x[1]];if(kind==='consonant')return [x[1]];if(kind==='blend')return [x[2]];return [x[0]];}
function journeyPlay(){if(view.round>=5){journeyFinish();return;}const lesson=LESSONS[view.lesson],x=view.deck[view.round],opts=journeyOptions();const k=lesson.kind;const target=k==='picture'?'🔊 귀로 듣고 그림을 골라요':k==='vowel'?'🔊 들리는 모음을 골라요':k==='consonant'?'🔊 들리는 자음을 골라요':k==='blend'?'🔊 두 글자가 만나면?':'🍎 그림에 맞는 낱말을 골라요';const big=k==='picture'?'👂':k==='vowel'?'🌈':k==='consonant'?'🐣':k==='blend'?`<span class="split">${x[0]} <small>+</small> ${x[1]} <small>= ?</small></span>`:x[1];const label=o=>k==='picture'?o[1]:k==='vowel'||k==='consonant'?o[0]:k==='blend'?o[2]:o[0];wrap(`${screenHead(`${lesson.emoji} ${lesson.name}`)}<div class="lesson-hero"><span>${view.lesson+1}단계 · ${view.round+1}/5</span><strong>${big}</strong></div><p class="sectionhint">${target}</p><div class="board" style="min-height:300px"><button class="largebtn gold" data-a="journey-hear">🔊 다시 듣기</button><div class="choices">${opts.map((o,i)=>`<button class="choice ${view.answered&&journeyCorrect()=== (k==='blend'?o[2]:o[0])?'good':''} ${view.wrong===i?'bad':''}" data-a="journey-answer" data-index="${i}" ${view.answered?'disabled':''}>${label(o)}</button>`).join('')}</div>${view.answered?`<div class="feedback">⭐ 잘했어! 쪼이~!</div>${nextBtn()}`:'<p class="lesson-help">틀려도 괜찮아! 다시 눌러 보자.</p>'}</div>${breakHtml()}`);}
function journeyFinish(){const n=view.lesson;state.lessonDone=state.lessonDone||{};state.lessonDone[n]=true;const nextIdx=n+1;if(nextIdx<LESSONS.length&&Number(state.lessonLevel)<=n)state.lessonLevel=nextIdx;persist();wrap(`${screenHead('🎊 모험 완료!',false)}<div class="board endboard"><div class="trophy">🏆</div><h3>잘했어! 쪼이~!</h3><p>${LESSONS[n].name} 모험을 완성했어!</p><div class="controls"><button class="largebtn green" data-a="journey-map">모험 지도 🗺️</button><button class="largebtn white" data-a="home">다른 놀이 🌈</button></div></div>`);say(PRAISE);}
function dataset(){return view.tab==='consonants'?CONSONANTS:view.tab==='vowels'?VOWELS:SYLLABLES;}
function learn(){const data=dataset(),entry=data[Math.min(view.selected,data.length-1)];wrap(`${screenHead('🔤 글자 만나기',false)}<div class="learn-tabs"><button class="tab ${view.tab==='consonants'?'active':''}" data-a="tab" data-tab="consonants">ㄱㄴㄷ 자음</button><button class="tab ${view.tab==='vowels'?'active':''}" data-a="tab" data-tab="vowels">ㅏㅑㅓ 모음</button><button class="tab ${view.tab==='syllables'?'active':''}" data-a="tab" data-tab="syllables">가나다 글자</button></div><p class="sectionhint">글자를 누르면 ‘라’ · (쉬고) · ‘라디오’처럼 또박또박 들려줘요!</p><div class="letter-grid">${data.map((x,i)=>`<button class="letter ${i===view.selected?'active':''} ${state.seen[today()+':learn:'+view.tab+':'+i]?'seen':''}" data-a="letter" data-index="${i}">${x[0]}</button>`).join('')}</div><div class="detail-card"><div class="detail-glyph">${entry[0]}</div><div class="detail-ex"><div class="exampleemoji">${entry[3]}</div><div>${entry[1]}</div><div>${entry[2]}</div><button class="small-action" data-a="read-letter">🔊 들어 보기</button></div></div>${breakHtml()}`);}
function drawMode(color){const item=view.deck[view.round],title=color?'🎨 무지개 글씨':'✍️ 글씨 쓰기';wrap(`${screenHead(title)}<p class="sectionhint">${color?'마음에 드는 색을 골라 자유롭게 꾸며요!':'먼저 쓰는 순서를 보고 연한 글자를 따라 써 보세요!'}</p><div class="board"><div class="draw-layout"><div class="drawpad"><canvas id="writing" aria-label="${item[0]} 글자 그리기 판"></canvas></div><div class="draw-side">${!color&&STROKE_GUIDES[item[0]]?`<button class="small-action stroke-guide-btn" data-a="show-stroke">🎬 쓰는 순서 보기</button><div id="stroke-demo" class="stroke-example" aria-label="${item[0]} 쓰기 순서 시범">${strokeGuide(item[0])}</div>`:''}<button class="small-action" data-a="read" data-text="${item[0]}">🔊 ${item[0]} 듣기</button>${color?`<div class="palette">${['#ff6584','#f3a927','#50ca96','#4da9f4','#9b75ed','#44416f'].map(c=>`<button class="color-dot ${view.palette===c?'selected':''}" style="--c:${c}" data-a="color" data-color="${c}" aria-label="${c} 색 선택"></button>`).join('')}</div>`:''}<button class="small-action" style="background:#957fcb" data-a="undo-stroke">↶ 되돌리기</button><button class="small-action" style="background:#957fcb" data-a="clear-strokes">🧽 지우기</button></div></div><div class="help">${color?'글자를 마음대로 색칠해 보세요.':'잘 썼는지 채점하지 않아요. 연습한 것만으로도 멋져요!'}</div><div class="controls">${view.answered?`<div class="feedback">🌟 잘했어! 쪼이~!</div>${nextBtn()}`:`<button class="largebtn gold" data-a="finish-draw" ${view.strokes.some(s=>s.points.length>=3)?'':'disabled'}>${color?'그림 완성! 🎨':'다 썼어요! ⭐'}</button>`}</div></div>${breakHtml()}`);setupCanvas(item[0],color);}
function strokeGuide(letter){const strokes=STROKE_GUIDES[letter];if(!strokes)return '';return `<svg viewBox="0 0 100 100" role="img" aria-label="${letter}의 기본 획 안내">${strokes.map((path,i)=>`<path d="${path}" style="--i:${i}"/>`).join('')}</svg><div class="stroke-caption">${letter} · ${strokes.length}획 모양 길잡이</div>`;}
function setupCanvas(letter,color){const c=document.querySelector('#writing');if(!c)return;const ctx=c.getContext('2d');const pxr=Math.min(window.devicePixelRatio||1,2);const width=c.clientWidth,height=c.clientHeight;c.width=Math.floor(width*pxr);c.height=Math.floor(height*pxr);ctx.setTransform(pxr,0,0,pxr,0,0);
 function paint(){ctx.clearRect(0,0,width,height);ctx.fillStyle='#fff';ctx.fillRect(0,0,width,height);ctx.strokeStyle='#e4ddf2';ctx.lineWidth=2;ctx.setLineDash([9,9]);ctx.beginPath();ctx.moveTo(width/2,15);ctx.lineTo(width/2,height-15);ctx.moveTo(15,height/2);ctx.lineTo(width-15,height/2);ctx.stroke();ctx.setLineDash([]);const fs=Math.min(width*.59,height*.72,255);ctx.font=`900 ${fs}px system-ui, 'Malgun Gothic', sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineWidth=4;ctx.strokeStyle=color?'#bba7ec':'#d4c5f3';ctx.fillStyle=color?'#fbf8ff':'#ede7fb';ctx.fillText(letter,width/2,height/2+fs*.055);ctx.strokeText(letter,width/2,height/2+fs*.055);for(const stroke of view.strokes){const points=stroke.points;if(!points.length)continue;ctx.strokeStyle=stroke.color;ctx.fillStyle=stroke.color;ctx.lineWidth=stroke.size;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(points[0][0]*width,points[0][1]*height);for(const p of points.slice(1)){ctx.lineTo(p[0]*width,p[1]*height);}ctx.stroke();if(points.length===1){ctx.beginPath();ctx.arc(points[0][0]*width,points[0][1]*height,stroke.size/2,0,2*Math.PI);ctx.fill();}}}
 paint();function point(e){const r=c.getBoundingClientRect();return [Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)),Math.max(0,Math.min(1,(e.clientY-r.top)/r.height))];}
 c.addEventListener('pointerdown',e=>{e.preventDefault();c.setPointerCapture(e.pointerId);view.drawing=true;view.strokes.push({color:color?view.palette:'#6d51d9',size:color?23:14,points:[point(e)]});paint();});
 c.addEventListener('pointermove',e=>{if(!view.drawing)return;e.preventDefault();view.strokes[view.strokes.length-1].points.push(point(e));paint();});
 c.addEventListener('pointerup',e=>{if(!view.drawing)return;view.drawing=false;const b=document.querySelector('[data-a="finish-draw"]');if(b&&view.strokes.some(s=>s.points.length>=3))b.disabled=false;});c.addEventListener('pointercancel',()=>{view.drawing=false;});
 }
function parent(){stopSpeech();view.mode='parent';const entries=MODES.map(m=>`<div class="statrow"><span>${m.emoji} ${m.name}</span><span>${state.counts[m.id]||0}개</span></div>`).join('');wrap(`<div class="parentbox"><h2>🔒 보호자 화면</h2><p>이 정보는 태블릿 안에만 저장되며 외부로 전송하지 않습니다.</p><div class="statrow"><span>모은 별</span><strong>⭐ ${state.stars}개</strong></div><div class="statrow"><span>오늘 모은 별</span><strong>${state.daily[today()]||0}개</strong></div><div class="statrow"><span>한글 모험 완료</span><strong>${Object.keys(state.lessonDone||{}).length}/5 단계</strong></div>${entries}<p>※ 위 활동별 숫자는 각 날짜에 새롭게 별을 얻은 문제 수입니다. 필기의 정확도를 자동 채점하지 않습니다.</p>
<div class="voice-panel"><h3>🎙️ 목소리 선택</h3><p>태블릿에 있는 한국어 목소리를 골라 주세요. 따뜻한 말투와 속도도 바꿀 수 있어요.</p><label for="voice-choice">목소리</label><select class="voice-select" id="voice-choice" aria-label="한국어 목소리 고르기"><option value="">기본 한국어 목소리</option></select><p id="voice-status" class="voice-hint">목소리를 찾는 중입니다.</p><div class="tone-choices">${Object.entries(TONES).map(([id,t])=>`<button class="tone-choice ${state.voiceTone===id?'active':''}" data-a="tone" data-tone="${id}">${t.label}</button>`).join('')}</div><div class="lesson-actions"><button class="small-action" data-a="voice-test">🔊 목소리 미리 듣기</button></div><p class="voice-hint">기기에 목소리가 하나뿐이라면 선택지도 하나입니다. 이 앱은 유료 음성 API를 사용하지 않습니다. 시스템 음성은 기기 설정에 따라 인터넷이 필요할 수 있습니다.</p></div>
<div class="installbox"><h3>📱 태블릿 홈 화면에 설치하기</h3>
<p>웹주소(https://)로 처음 접속한 상태에서 설치하세요. 설치 후 비행기 모드에서도 앱을 다시 열어 오프라인 동작을 확인할 수 있습니다.</p>
<div class="controls"><button class="largebtn green" data-a="install">📲 설치하기</button></div>
<p>안드로이드 크롬: 오른쪽 위 ⋮ → <b>앱 설치</b> 또는 <b>홈 화면에 추가</b><br>
아이패드: 사파리 공유 버튼 → <b>홈 화면에 추가</b></p>
<p>설치 버튼에서 별도 창이 나타나지 않으면 위의 브라우저 메뉴를 이용해 주세요. 파일(file://)로 연 경우는 홈 화면 앱 설치가 지원되지 않을 수 있습니다.</p>
</div><button class="danger" data-a="reset">모든 학습 기록 초기화</button><div style="height:16px"></div><button class="largebtn white" data-a="home">돌아가기</button></div>`);refreshVoices();}
function handle(action,el){if(action==='journey-map'){journeyMap();return;}if(action==='journey-level'){startJourney(el.dataset.index);return;}if(action==='journey-hear'){speakParts(journeyPrompt());return;}if(action==='journey-answer'){if(view.answered)return;const i=Number(el.dataset.index),opt=view.q[i],kind=LESSONS[view.lesson].kind;const picked=kind==='blend'?opt[2]:opt[0];if(picked!==journeyCorrect()){view.wrong=i;journeyPlay();say('다시 한 번 해 볼까?');return;}view.answered=true;gain('journey',view.lesson+':'+journeyCorrect());journeyPlay();say(PRAISE);return;}if(action==='tone'){if(!TONES[el.dataset.tone])return;state.voiceTone=el.dataset.tone;persist();parent();say(PRAISE);return;}if(action==='voice-test'){say(PRAISE);return;}if(action==='show-stroke'){const el=document.getElementById('stroke-demo');if(el){el.classList.remove('play');void el.offsetWidth;el.classList.add('play');}return;}if(action==='home'){home();return;}if(action==='sound'){state.sound=!state.sound;if(!state.sound)stopSpeech();persist();const m=view.mode;if(m==='home')home();else if(m==='learn')learn();else if(m==='parent')parent();else renderMode();if(state.sound)say('안녕! 함께 한글 놀이 해요!');return;}if(action==='open'){start(el.dataset.mode);return;}if(action==='break'){breakDismissed=true;renderCurrent();return;}if(action==='parent'){parent();return;}if(action==='install'){if(installPrompt){const prompt=installPrompt;installPrompt=null;prompt.prompt().catch(()=>{alertToast('브라우저 메뉴에서 홈 화면에 추가해 주세요.');});}else{alertToast('브라우저 메뉴에서 앱 설치 또는 홈 화면에 추가를 눌러 주세요.');}return;}if(action==='reset'){const answer=window.confirm('정말 모든 별과 학습 기록을 지울까요?');if(answer){state=initialState();persist();parent();}return;}if(action==='next'){next();return;}if(action==='read'){say(el.dataset.text);return;}if(action==='tab'){view.tab=el.dataset.tab;view.selected=0;learn();return;}if(action==='letter'){view.selected=+el.dataset.index;const x=dataset()[view.selected];gain('learn',view.tab+':'+view.selected);learn();sayLetterExample(x,view.tab);return;}if(action==='read-letter'){const x=dataset()[view.selected];sayLetterExample(x,view.tab);return;}
 if(action==='answer-quiz'||action==='answer-space'){if(view.answered)return;const i=+el.dataset.index;const right=view.mode==='quiz'?view.q[i].w===view.deck[view.round].w:view.q[i][0]===view.deck[view.round][0];if(!right){view.wrong=i;el.classList.add('bad');markAnswer(false);return;}markAnswer(true,view.mode,view.deck[view.round].w||view.deck[view.round][0]);return;}
 if(action==='pick'){if(view.answered)return;const i=+el.dataset.index;if(view.chosen.includes(i))return;view.chosen.push(i);const item=view.deck[view.round];if(view.chosen.length===[...item.w].length){const attempt=view.chosen.map(x=>view.q[x].s).join('');if(attempt===item.w){view.answered=true;gain('build',item.w);say(PRAISE);renderMode();}else{alertToast('순서를 바꿔서 다시 만들어 봐요 💗');say('한 번 더 해 볼까요?');renderMode();}}else renderMode();return;}
 if(action==='undo'){view.chosen.pop();renderMode();return;}if(action==='clear-choose'){view.chosen=[];renderMode();return;}
 if(action==='color'){view.palette=el.dataset.color;document.querySelectorAll('.color-dot').forEach(x=>x.classList.toggle('selected',x.dataset.color===view.palette));return;}
 if(action==='undo-stroke'){view.strokes.pop();renderMode();return;}if(action==='clear-strokes'){view.strokes=[];renderMode();return;}
 if(action==='finish-draw'){if(!view.strokes.some(s=>s.points.length>=3))return;view.answered=true;gain(view.mode,view.deck[view.round][0]);say(PRAISE);renderMode();return;}
}
function renderCurrent(){if(view.mode==='journey-map')journeyMap();else if(view.mode==='home')home();else if(view.mode==='learn')learn();else if(view.mode==='parent')parent();else renderMode();}
ROOT.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b)handle(b.dataset.a,b);});ROOT.addEventListener('change',e=>{if(e.target?.id==='voice-choice'){state.voiceKey=e.target.value;persist();say(PRAISE);}});
window.addEventListener('resize',()=>{if((view.mode==='trace'||view.mode==='color')&&!view.answered)renderMode();});
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){window.addEventListener('load',()=>{navigator.serviceWorker.register('./sw.js').catch(()=>{});});}
home();
window.HANGUL_QA={state:()=>JSON.parse(JSON.stringify(state)),go:start,view:()=>({mode:view.mode,round:view.round,lesson:view.lesson,answered:view.answered,chosen:view.chosen.slice()}),journey:(n)=>startJourney(n),voices:()=>availableKoreanVoices().map(v=>v.name),speakParts,reset:()=>{state=initialState();persist();home();}};
})();
</script>
</body></html>
