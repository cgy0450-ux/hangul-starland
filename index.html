.installbox{margin:22px 0;padding:20px;border:3px solid #d7d0fb;border-radius:22px;background:#f6f3ff}.installbox h3{font-size:22px;color:#5948a8;margin:0 0 8px}.installbox p{font-size:15px;line-height:1.7}.installbox .largebtn{min-height:52px;font-size:18px;padding:9px 16px}

:root{--sunshine:#fff8cb;--peach:#ffcfaa;--minty:#dcfff0}
.topbar .refresh-pill{background:#e7fff6;color:#207967;font-size:15px}
.modegrid{grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}

.hero{min-height:200px}.hero h1{font-size:clamp(30px,4.5vw,51px)}

.modegrid{grid-template-columns:repeat(4,minmax(0,1fr));gap:15px}.modecard{background:var(--bg);border:4px solid white;border-bottom:8px solid var(--edge);min-height:224px;display:flex;position:relative;flex-direction:column;align-items:center;justify-content:space-between;text-align:center;padding:13px 10px 15px;box-shadow:0 9px 16px #785f9720;transition:transform .2s,box-shadow .2s}.modecard::before{content:'✦';position:absolute;right:16px;top:6px;font-size:28px;color:#ffffff}.modecard:hover,.modecard:focus-visible{transform:translateY(-5px) rotate(-1deg);box-shadow:0 14px 21px #785f9740}.card-art{height:118px;min-width:0;width:100%;display:flex;align-items:center;justify-content:center;overflow:hidden}.card-art img{height:118px;width:100%;object-fit:contain;border-radius:18px;animation:tiny-bob 4s ease-in-out infinite}.card-art .emoji{font-size:clamp(60px,7.6vw,86px);animation:tiny-bob 4s ease-in-out infinite}.modecard .card-copy{display:flex;align-items:center;flex-direction:column;gap:6px;width:100%}.modecard .card-copy strong{font-size:clamp(16px,1.8vw,23px);line-height:1.2;color:#342763}.modecard .card-copy>span{font-size:12px;line-height:1.4;color:#666083;font-weight:850}.card-arrow{position:absolute;right:10px;bottom:10px;font-size:18px;color:#8b74b8}.modecard .emoji,.modecard span:last-child{color:inherit}

/* Cosmic exploration with independent decorative layers that cannot block buttons */
.spacebg{isolation:isolate;min-height:540px;background:radial-gradient(ellipse at 20% 16%,#593aab 0%,transparent 45%),radial-gradient(ellipse at 86% 75%,#395ac1 0%,transparent 48%),linear-gradient(140deg,#120c39,#18134c 48%,#0f103e 100%);border:5px solid #373073;box-shadow:inset 0 0 60px #715ad330,0 15px 30px #21184f38;overflow:hidden}.spacebg::before{display:none}.spacebg .space-ui{position:relative;z-index:5;width:100%;display:flex;flex-direction:column;align-items:center;gap:20px}.space-mission-chip{background:#ffffff24;color:#ffe9a5;border:2px solid #fff5b272;padding:9px 20px;border-radius:99px;font-weight:950}.spacebg .question-title{color:#fff;text-shadow:0 4px 0 #342767;font-size:clamp(34px,4vw,48px)}.cosmos-nebula{position:absolute;inset:0;background:radial-gradient(ellipse at 15% 66%,#8b36b933 0,transparent 34%),radial-gradient(ellipse at 68% 10%,#39bce03b 0,transparent 32%);z-index:0;pointer-events:none;animation:nebula-breathe 7s ease-in-out infinite}.cosmos-stars{position:absolute;inset:0;z-index:1;pointer-events:none}.cosmos-stars span{position:absolute;left:var(--x);top:var(--y);color:#f5edff;opacity:.7;transform:scale(var(--scale));font-size:16px;text-shadow:0 0 9px #fff;animation:star-blink 3.2s ease-in-out var(--delay) infinite}.meteor{position:absolute;z-index:2;height:3px;width:135px;border-radius:99px;transform:rotate(-27deg);background:linear-gradient(90deg,transparent,#89edff,#fffbe1);box-shadow:0 0 18px #72efff;left:110%;top:10%;pointer-events:none;animation:meteor-fly 6.3s linear infinite}.meteor-b{top:44%;animation-delay:-2.6s;animation-duration:8.5s;opacity:.65}.meteor-c{top:71%;animation-delay:-5.1s;animation-duration:10.5s;opacity:.7}.cosmos-moon{position:absolute;top:5%;right:9%;font-size:67px;z-index:1;animation:tiny-bob 5s ease-in-out infinite}.cosmos-ship{position:absolute;left:2%;bottom:18px;z-index:4;pointer-events:none;display:flex;flex-direction:column;align-items:center;transform:rotate(15deg);animation:rocket-hover 3.1s ease-in-out infinite}.ship-body{font-size:85px;filter:drop-shadow(0 10px 15px #0008)}.ship-fire{font-size:35px;animation:fire-flicker .35s alternate infinite}.rocket-launch .cosmos-ship{animation:rocket-launch 1.25s ease-in forwards}.planetchoices{position:relative;z-index:5}.planet{position:relative;isolation:isolate;border:6px solid rgba(255,255,255,.36)!important;box-shadow:inset -20px -18px 0 #0002,0 13px 0 #160f4760,0 0 35px #d4b7ff62;animation:planet-float 3.8s ease-in-out infinite;animation-delay:calc(var(--p)*-.85s);color:#241b62!important;text-shadow:0 3px 1px #fff9;font-size:clamp(54px,7.2vw,104px);font-weight:1000}.planet-glow{position:absolute;inset:12%;border-top:4px solid #fff8;border-radius:50%;transform:rotate(-18deg);pointer-events:none}.planet:hover{transform:scale(1.06)}

function playJoyChime(){if(!state.sound)return;try{const Context=window.AudioContext||window.webkitAudioContext;if(!Context)return;const ctx=new Context();const now=ctx.currentTime;[523,659,784,1047].forEach((hz,i)=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.setValueAtTime(hz,now+i*.082);g.gain.setValueAtTime(.0001,now+i*.082);g.gain.exponentialRampToValueAtTime(.075,now+i*.082+.015);g.gain.exponentialRampToValueAtTime(.0001,now+i*.082+.21);o.connect(g).connect(ctx.destination);o.start(now+i*.082);o.stop(now+i*.082+.22);});setTimeout(()=>ctx.close().catch(()=>{}),1200);}catch(e){}}

state.studySteps=state.studySteps||{};state.studySteps[today()]=(state.studySteps[today()]||0)+1;state.counts[mode]=(state.counts[mode]||0)+1;
let award=false;if(state.studySteps[today()]%STEPS_PER_STAR===0&&todayStars()<DAILY_STAR_CAP){state.stars++;state.daily[today()]=(state.daily[today()]||0)+1;award=true;}
persist();return award;}
function resetStarsOnly(){if(!window.confirm('모은 별과 스티커 잠금 상태만 초기화할까요? 학습 단계와 가족 이름은 그대로 남아요.'))return;
state.stars=0;state.daily={};state.studySteps={};state.seen={};persist();parent();alertToast('별만 초기화했어요. 다시 멋진 모험을 시작해요!');}

function scrambleWord(word){const target=[...word];let arr=target.map((s,i)=>({s,i}));if(target.length<2)return arr;for(let n=0;n<12;n++){const shuffled=random(arr);if(shuffled.map(x=>x.s).join('')!==word)return shuffled;}return arr.reverse();}
function random(a){const b=a.slice();for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}
let view={mode:'home',tab:'consonants',selected:0,round:0,deck:[],q:null,answered:false,wrong:null,chosen:[],palette:'#ff6584',strokes:[],drawing:false,lesson:0};
let toastTimer=null,sessionStart=Date.now(),breakDismissed=false;
// 휴대기기에 설치된 무료 한국어 음성만 사용합니다. 유료 TTS API를 호출하지 않습니다. 일부 시스템 음성은 인터넷을 사용할 수 있습니다.
let speechToken=0,speechTimer=null,voiceList=[];
function availableKoreanVoices(){if(!('speechSynthesis' in window))return [];try{return window.speechSynthesis.getVoices().filter(v=>String(v.lang).toLowerCase().startsWith('ko'));}catch(e){return [];}}
function refreshVoices(){voiceList=availableKoreanVoices();const select=document.getElementById('voice-choice');if(!select)return;const current=state.voiceKey||'';select.innerHTML='<option value="">기본 한국어 목소리</option>'+voiceList.map(v=>`<option value="${esc(v.voiceURI||v.name)}">${esc(v.name)}${v.localService?' · 기기 음성':''}</option>`).join('');select.value=voiceList.some(v=>(v.voiceURI||v.name)===current)?current:'';const status=document.getElementById('voice-status');if(status)status.textContent=voiceList.length?`한국어 목소리 ${voiceList.length}개 발견 · 선택 즉시 저장됩니다.`:'한국어 목소리를 아직 찾지 못했어요. 기기 음성 설정을 확인해 주세요.';}
function esc(value){return String(value).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
if('speechSynthesis' in window){window.speechSynthesis.addEventListener?.('voiceschanged',refreshVoices);refreshVoices();}
function stopSpeech(){speechToken++;if(speechTimer!==null){clearTimeout(speechTimer);speechTimer=null;}try{window.speechSynthesis?.cancel();}catch(e){}}
function speakParts(parts,pauseMs=560,cheerful=false){stopSpeech();if(!state.sound||!('speechSynthesis' in window))return;const token=speechToken;const phrases=parts.map(x=>String(x||'').trim()).filter(Boolean);let index=0;
 function nextPart(){if(token!==speechToken||!state.sound||index>=phrases.length)return;const u=new SpeechSynthesisUtterance(phrases[index++]);u.lang='ko-KR';const tone=TONES[state.voiceTone]||TONES.warm;u.rate=cheerful?Math.min(1.04,Math.max(.81,tone.rate+(.035*index))):tone.rate;u.pitch=cheerful?Math.min(1.7,Math.max(1.13,tone.pitch+.13+(index%2)*.05)):tone.pitch;u.volume=1;const voices=availableKoreanVoices();const chosen=voices.find(v=>(v.voiceURI||v.name)===state.voiceKey);u.voice=chosen||voices.find(v=>/female|woman|여성|google.*한국어/i.test(v.name))||voices[0]||null;
  let finished=false;function advance(){if(finished||token!==speechToken)return;finished=true;if(index<phrases.length)speechTimer=setTimeout(()=>{speechTimer=null;nextPart();},pauseMs);}
  u.onend=advance;u.onerror=advance;try{window.speechSynthesis.speak(u);}catch(e){advance();}
 }
 nextPart();
}
function say(text){speakParts([text]);}
function sayLetterExample(entry,tab){const first=tab==='consonants'?entry[1]:tab==='vowels'?entry[1]:entry[0];speakParts([first,entry[2]],650);}

function alertToast(message){document.querySelector('.toast')?.remove();const d=document.createElement('div');d.className='toast';d.setAttribute('role','status');d.textContent=message;document.body.appendChild(d);clearTimeout(toastTimer);toastTimer=setTimeout(()=>d.remove(),2600);}
function header(){return `<header class="topbar"><button class="brand" data-a="home" aria-label="쪼이랜드 처음 화면" style="border:0;background:none;padding:0"><span class="brand-buddy"><img src="./icon-512.png?v=6.3" alt="웃는 호랑이 쪼이"/></span><span class="brand-name">쪼이랜드<small>🐯 놀면서 자라요</small></span></button><div class="top-actions"><span class="pill star-pill" aria-label="오늘 별 ${todayStars()}개 누적 ${state.stars}개">⭐ <span id="star-number">${todayStars()}</span> / ${DAILY_STAR_CAP}<small>오늘의 별</small></span><button class="pill refresh-pill" data-a="refresh" title="최신 버전 새로고침" aria-label="최신 버전 업데이트 확인"><svg class="refresh-icon" width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2 6"/><path d="M20 4v7h-7"/></svg><span>업데이트</span></button><button class="pill bgm-pill" data-a="bgm" title="배경음악 켜기·끄기" aria-label="배경음악 켜기 또는 끄기">🎵 음악</button><button class="pill sound-pill" data-a="sound" aria-label="소리 ${state.sound?'끄기':'켜기'}">${state.sound?'🔊 소리 켬':'🔇 소리 끔'}</button></div></header>`;}
function wrap(body){ROOT.innerHTML=`<div class="shell">${header()}<main class="mainpanel">${body}</main><footer class="footer"><span>🌈 천천히 해도 괜찮아! 차근차근 해보자.</span><button class="textbtn" data-a="parent">보호자</button></footer></div>`;}
function progress(){return `<div class="progress" aria-label="${Math.min(view.round,5)} / 5"><span class="topright-status">${Math.min(view.round+1,5)}/5</span>${[0,1,2,3,4].map(i=>`<span class="progdot ${i<=view.round?'on':''}"></span>`).join('')}</div>`;}

function home(){stopSpeech();view.mode='home';const cards=MODES.map((m,i)=>{const artMap={safari:ASSET_CAR,space:ASSET_ROCKET,color:ASSET_RAINBOW,trace:ASSET_TRACE,learn:ASSET_LEARN,quiz:ASSET_QUIZ,build:ASSET_BUILD,family:ASSET_FAMILY};const art=artMap[m.id]||null;const crop=({build:[26,10,409,138,458,216],trace:[14,8,417,143,446,226],family:[23,7,406,184,452,268]})[m.id];const artHtml=art?(crop?`<svg viewBox="${crop[0]} ${crop[1]} ${crop[2]} ${crop[3]}" preserveAspectRatio="xMidYMid meet" role="presentation"><image href="${art}" x="0" y="0" width="${crop[4]}" height="${crop[5]}"/></svg>`:`<img src="${art}" alt=""/>`):`<span class="emoji">${m.emoji}</span>`;return `<button class="modecard mode-${m.id}" style="--bg:${m.bg};--edge:${m.edge};--i:${i}" data-a="open" data-mode="${m.id}"><span class="card-art" aria-hidden="true">${artHtml}</span><span class="card-copy"><strong>${m.name}</strong><span>${m.desc}</span></span><span class="card-arrow" aria-hidden="true">↗</span></button>`}).join('');const recommended=LESSONS[Math.min(Number(state.lessonLevel)||0,4)];const steps=todaySteps(),stars=todayStars();wrap(`<div class="joiland-hero"><div class="sky-confetti" aria-hidden="true"><span>✦</span><span>🌸</span><span>✨</span><span>☁️</span></div><div class="hero-tiger"><img src="${ASSET_TIGER}" alt="쪼이랜드 호랑이 친구"/><span class="tiger-hi">반가워!</span></div><div class="hero-logo"><img src="${ASSET_LOGO}" alt="쪼이랜드"/><div class="hero-subtitle">호랑이 쪼이와 함께 떠나는<br/>신나는 한글 탐험!</div><div class="hero-buddies" aria-hidden="true"><span>🐰</span><span>🐻</span><span>🚗</span><span>☀️</span></div></div><span class="floating-rocket" aria-hidden="true">🚀</span></div><section class="daily-mission" aria-label="오늘의 놀이 미션"><div class="mission-leading"><span class="mission-icon">🏆</span><div><strong>오늘의 탐험 미션</strong><p>서로 다른 놀이 ${DAILY_STAR_CAP*STEPS_PER_STAR}개 · 하루 별 ${DAILY_STAR_CAP}개까지</p></div></div><div class="daily-bar"><span class="daily-bar-fill" style="width:${Math.min(100,steps/(DAILY_STAR_CAP*STEPS_PER_STAR)*100)}%"></span></div><span class="mission-count">⭐ ${stars}/${DAILY_STAR_CAP} · ${Math.min(steps,DAILY_STAR_CAP*STEPS_PER_STAR)}/${DAILY_STAR_CAP*STEPS_PER_STAR}</span></section><div class="home-features"><button class="feature-journey" data-a="journey-map"><span class="feature-icon">📚</span><span><strong>오늘의 한글 모험</strong><small>${recommended.emoji} ${recommended.name} · 5문제씩 천천히</small></span><b>시작 ➜</b></button><button class="feature-sticker" data-a="stickers"><span class="feature-icon">🌟</span><span><strong>내 스티커 도감</strong><small>동물과 자동차 친구를 만나자!</small></span><b>보기 ➜</b></button></div><div class="section-title"><h2>✨ 어떤 놀이를 해볼까?</h2><span>골라서 톡! 재미가 팡!</span></div><div class="modegrid">${cards}</div><div class="section-title"><h2>📚 새로운 쪼이랜드 놀이터</h2><span>책도 읽고 길도 찾아요!</span></div><div class="joiland-extra"><a href="./stories.html" class="joiland-extracard story-card"><span class="xo-icon">📖🐯</span><strong>쪼이가 읽어주는 동화</strong><small>책장을 넘기며 이야기 다섯 편!</small></a><a href="./mazes.html" class="joiland-extracard maze-card"><span class="xo-icon">🧩🌟</span><strong>미로 탐험대</strong><small>20개의 길을 찾아 떠나요!</small></a></div>${breakHtml()}<div class="home-note"><span>🐯 광고 없음 · 로그인 없음 · 별과 이름은 태블릿 안에만</span><span>쉬엄쉬엄 10~15분 놀자!</span></div>`);}
function start(mode){stopSpeech();view={...view,mode,round:0,answered:false,wrong:null,chosen:[],deck:[],q:null,strokes:[],drawing:false};view.praise='';if(mode==='learn'){view.tab='consonants';view.selected=0;learn();return;}if(mode==='quiz'){view.deck=random(WORDS).slice(0,5);}if(mode==='build'){view.deck=random(WORDS.filter(x=>[...x.w].length>=2&&[...x.w].length<=3)).slice(0,5);}if(mode==='space'){view.deck=random(SYLLABLES).slice(0,5);}if(mode==='trace'){view.deck=random(['ㅏ','ㅓ','ㅗ','ㅜ','ㅣ','ㄱ','ㄴ','ㄷ','ㅁ','ㅅ','가','나','다','라','마','바','사','자','차','하'].map(x=>[x,x,x,'✏️'])).slice(0,5);}if(mode==='color'){view.deck=random(COLOR_WORDS.map(x=>[x.w,x.w,x.w,x.e])).slice(0,5);view.colorLetter=0;view.traceColors=[];}if(mode==='family'){familyHome();return;}if(mode==='safari'){view.deck=random(ANIMALS).slice(0,5);}renderMode();}
function finish(){const thisMode=MODES.find(m=>m.id===view.mode);wrap(`${screenHead(thisMode.name,false)}<div class="board endboard"><div class="trophy">🏆</div><h3>${praiseText()}</h3><p>글자 친구 다섯 명과 즐겁게 놀았어요.</p><div class="controls"><button class="largebtn green" data-a="open" data-mode="${view.mode}">한 번 더! ↻</button><button class="largebtn white" data-a="home">다른 놀이 하기</button></div></div>`);sayPraise();}
function markAnswer(correct,mode,identifier){if(!correct){alertToast('괜찮아요! 다시 찾아볼까요? 💗');say('다시 찾아볼까요?');return;}if(view.answered)return;view.answered=true;const gained=gain(mode,identifier);const counter=document.getElementById('star-number');if(counter)counter.textContent=todayStars();sayPraise();if(gained)alertToast('오늘의 별을 얻었어요! ⭐');renderMode();}
function renderMode(){if(view.round >= (view.mode==='family'?([...(familyById(view.familyId)?.name||'')].length):5)){if(view.mode==='journey')journeyFinish();else if(view.mode==='family')familyFinish();else finish();return;}if(view.mode==='journey')journeyPlay();if(view.mode==='quiz')quiz();if(view.mode==='build')build();if(view.mode==='space')space();if(view.mode==='trace')drawMode(false);if(view.mode==='color')drawMode(true);if(view.mode==='safari')animalRace();if(view.mode==='family')guidedWrite();}
function next(){stopSpeech();view.round+=1;view.answered=false;view.wrong=null;view.chosen=[];view.strokes=[];view.traceDone=[];view.traceStep=0;view.traceColors=[];view.colorLetter=0;view.praise='';view.q=null;renderMode();if(view.mode==='journey'&&view.round<5)speakParts(journeyPrompt());}
function nextBtn(){return `<button class="largebtn green" data-a="next">${view.round===4?'놀이 마치기 🎉':'다음 문제 ➜'}</button>`;}
function quiz(){const item=view.deck[view.round];if(!view.q){const distractors=random(WORDS.filter(x=>x.w!==item.w&&[...x.w].length>1)).slice(0,2);view.q=random([item,...distractors]);}
 wrap(`${screenHead('🍎 그림 낱말 퀴즈')}<p class="sectionhint">그림과 같은 낱말을 눌러 주세요!</p><div class="board"><div class="question-image" aria-label="${item.w}">${item.e}</div><div class="controls"><button class="small-action" data-a="read" data-text="${item.w}">🔊 이름 듣기</button></div><div class="choices">${view.q.map((x,i)=>`<button class="choice ${view.answered&&x.w===item.w?'good':view.wrong===i?'bad':''}" data-a="answer-quiz" data-index="${i}" ${view.answered?'disabled':''}>${x.w}</button>`).join('')}</div>${view.answered?`<div class="feedback">🎉 ${praiseText()} ${item.e} ${item.w}</div>${nextBtn()}`:'<span class="help">그림을 보고 세 가지 중에 골라요!</span>'}</div>${breakHtml()}`);}
function build(){const item=view.deck[view.round];if(!view.q){view.q=scrambleWord(item.w);}const chars=[...item.w];const taken=new Set(view.chosen);const assembled=view.chosen.map(i=>view.q[i].s).join('');const filled=chars.map((s,i)=>`<div class="slot ${view.chosen.length>i?'filled':''}">${view.chosen.length>i?[...assembled][i]:'?'}</div>`).join('');
 wrap(`${screenHead('🧩 낱말 만들기')}<p class="sectionhint">글자를 차례대로 눌러 낱말을 완성해요!</p><div class="board"><div class="question-image">${item.e}</div><button class="small-action" data-a="read" data-text="${item.w}">🔊 ${item.w} 듣기</button><div class="word-zone" aria-label="내가 만든 낱말">${filled}</div><div class="word-zone">${view.q.map((x,i)=>`<button class="syllable ${taken.has(i)?'used':''}" data-a="pick" data-index="${i}" ${taken.has(i)||view.answered?'disabled':''}>${x.s}</button>`).join('')}</div>${view.answered?`<div class="feedback">🎊 ${praiseText()} ${item.w}</div>${nextBtn()}`:`<div class="controls"><button class="largebtn white" data-a="undo" ${view.chosen.length?'':'disabled'}>↶ 하나 지우기</button><button class="largebtn white" data-a="clear-choose">처음부터</button></div>`}</div>${breakHtml()}`);}
function space(){const item=view.deck[view.round];if(!view.q){const distractors=random(SYLLABLES.filter(x=>x[0]!==item[0])).slice(0,2);view.q=random([item,...distractors]);}const colors=['#ffdc7b','#81edff','#f5a3ec'];const stars=Array.from({length:23},(_,i)=>`<span style="--x:${(i*43+11)%97}%;--y:${(i*31+3)%88}%;--delay:${(i%7)*-.7}s;--scale:${.7+(i%4)*.27}">✦</span>`).join('');wrap(`${screenHead('🚀 우주 글자 탐험')}<p class="sectionhint">우주선에 타자! '${item[0]}' 글자를 찾아봐!</p><div class="board spacebg ${view.answered?'rocket-launch':''}"><div class="cosmos-nebula" aria-hidden="true"></div><div class="cosmos-stars" aria-hidden="true">${stars}</div><div class="meteor meteor-a" aria-hidden="true"></div><div class="meteor meteor-b" aria-hidden="true"></div><div class="meteor meteor-c" aria-hidden="true"></div><div class="cosmos-moon" aria-hidden="true">🌙</div><div class="cosmos-ship" aria-hidden="true"><span class="ship-body">🚀</span><span class="ship-fire">🔥</span></div><div class="space-ui"><div class="space-mission-chip">🌌 우주 탐사 ${view.round+1} / 5</div><h3 class="question-title">“${item[0]}”를 찾아라!</h3><button class="largebtn gold" data-a="read" data-text="${item[0]}">🔊 글자 소리 듣기</button><div class="planetchoices">${view.q.map((x,i)=>`<button class="planet ${view.answered&&x[0]===item[0]?'good':view.wrong===i?'bad':''}" style="--planet:${colors[i]};--p:${i}" data-a="answer-space" data-index="${i}" ${view.answered?'disabled':''}><span class="planet-glow"></span>${x[0]}</button>`).join('')}</div>${view.answered?`<div class="feedback">🌟 ${praiseText()} ${item[0]}</div>${nextBtn()}`:'<p class="help" style="color:#ece7ff">행성 위의 글자를 눌러봐! 우주선이 기다려.</p>'}</div></div>${breakHtml()}`);}
function startJourney(level){stopSpeech();const n=Math.max(0,Math.min(LESSONS.length-1,Number(level)||0));view={...view,mode:'journey',lesson:n,round:0,answered:false,wrong:null,q:null,deck:LESSONS[n].items.slice()};journeyPlay();speakParts(journeyPrompt());}
function journeyCorrect(){const lesson=LESSONS[view.lesson];const answer=view.deck[view.round];if(lesson.kind==='picture'||lesson.kind==='word')return answer[0];if(lesson.kind==='blend')return answer[2];return answer[0];}
function journeyOptions(){const lesson=LESSONS[view.lesson];if(!view.q){const answer=view.deck[view.round];const other=lesson.items.filter(x=>x!==answer);view.q=random([answer,...random(other).slice(0,2)]);}return view.q;}

const ANIMALS=[{name:'토끼',emoji:'🐰'},{name:'곰',emoji:'🐻'},{name:'고양이',emoji:'🐱'},{name:'코끼리',emoji:'🐘'},{name:'강아지',emoji:'🐶'},{name:'돼지',emoji:'🐷'},{name:'사자',emoji:'🦁'},{name:'원숭이',emoji:'🐵'},{name:'판다',emoji:'🐼'},{name:'기린',emoji:'🦒'}];
const STICKERS=[['🐯','쪼이 호랑이',3],['🐰','토끼 친구',6],['🚗','빨간 자동차',10],['🦁','용감한 사자',15],['🐘','코끼리 탐험가',22],['🏎️','멋진 경주차',30],['🚀','우주 탐험대',45],['🏆','쪼이랜드 마스터',60]];
function stickerBook(){view.mode='stickers';wrap(`${screenHead('🎁 반짝반짝 스티커 도감',false)}<div class="family-intro"><span class="house-emoji">🎁</span><div><h3>별을 모으면 친구들이 찾아와!</h3><p>모은 별 ${state.stars}개 · 정답과 따라 쓰기로 하나씩 모으자!</p></div></div><div class="sticker-grid">${STICKERS.map(([icon,title,need])=>`<div class="sticker-tile ${state.stars>=need?'unlocked':'locked'}"><span>${state.stars>=need?icon:'🔒'}</span><strong>${state.stars>=need?title:'???'}</strong><small>${state.stars>=need?'모았어요! ✨':`별 ${need}개가 필요해`}</small></div>`).join('')}</div><div class="controls"><button class="largebtn green" data-a="home">다른 놀이 하러 가기</button></div>`);}
function animalRace(){const target=view.deck[view.round];if(!view.q)view.q=random([target,...random(ANIMALS.filter(x=>x!==target)).slice(0,2)]);wrap(`${screenHead('🚗 동물 자동차 여행')}<div class="road-banner"><span>🌳</span><span>🏁 동물 친구를 찾아 출발!</span><span>🏡</span></div><div class="race-track"><span class="race-car" style="left:${4+view.round*19}%" role="img" aria-label="오른쪽으로 달리는 자동차">🚙</span><span class="race-finish">🏁</span></div><div class="board"><p class="sectionhint">소리를 듣고 알맞은 동물 친구를 태워 줘!</p><button class="largebtn gold" data-a="race-hear">🔊 동물 이름 듣기</button><div class="animal-choices">${view.q.map((x,i)=>`<button class="animal-tile ${view.answered&&x.name===target.name?'good':view.wrong===i?'bad':''}" data-a="race-pick" data-index="${i}" ${view.answered?'disabled':''}><span class="animal-big">${x.emoji}</span><strong>${x.name}</strong></button>`).join('')}</div>${view.answered?`<div class="feedback">${target.emoji} 동물 친구가 자동차에 탔어! <b>${praiseText()}</b></div>${nextBtn()}`:'<p class="help">틀려도 괜찮아. 다시 들어 보자!</p>'}</div>`);}
function familyData(){const d=state.family||{};return [{id:'kid',role:'내 이름',name:String(d.kid||''),icon:'🧒'},{id:'mom',role:'엄마 이름',name:String(d.mom||''),icon:'👩'},{id:'dad',role:'아빠 이름',name:String(d.dad||''),icon:'👨'}];}
function familyById(id){return familyData().find(x=>x.id===id);}
function familyHome(){view.mode='family-home';wrap(`${screenHead('🏠 우리 가족 이름 쓰기',false)}<div class="family-intro"><span class="house-emoji">🏡</span><div><h3>우리 가족 이름을 써 볼까?</h3><p>손가락으로 한 글자씩, 시작점과 화살표를 따라 써 보자!</p></div></div><div class="family-cards">${familyData().map(person=>`<button class="family-card" data-a="family-choose" data-person="${person.id}" ${person.name?'':'disabled'}><span>${person.icon}</span><small>${person.role}</small><strong>${person.name?esc(person.name):'이름 미등록'}</strong><em>${state.familyDone?.[person.id]?'🌟 완성했어요':'✍️ 따라 쓰기'}</em></button>`).join('')}</div>${familyData().some(x=>!x.name)?'<div class="family-tip">🔒 이름은 보호자 화면에서 한 번만 등록하면 돼요. 공개 웹사이트에는 올리지 않아요.</div>':''}<div class="controls"><button class="largebtn white" data-a="parent">🔒 보호자 이름 등록</button><button class="largebtn green" data-a="home">다른 놀이 하기</button></div>`);}
function startFamily(id){const person=familyById(id);if(!person?.name)return;view={...view,mode:'family',familyId:id,round:0,answered:false,traceDone:[],traceStep:0,strokes:[],deck:[]};guidedWrite();}
function familyFinish(){const person=familyById(view.familyId);state.familyDone=state.familyDone||{};state.familyDone[view.familyId]=true;persist();wrap(`${screenHead('🏠 우리 가족 이름 완성!',false)}<div class="board family-celebrate"><span class="house-emoji">${person.icon}</span><h3>${esc(person.name)}</h3><p>${person.role}을 끝까지 썼네! ${praiseText()}</p><div class="controls"><button class="largebtn green" data-a="open" data-mode="family">다른 가족 이름도 쓰기</button><button class="largebtn white" data-a="home">처음으로</button></div></div>`);sayPraise();}
function parent(){stopSpeech();view.mode='parent';const entries=MODES.map(m=>`<div class="statrow"><span>${m.emoji} ${m.name}</span><span>${state.counts[m.id]||0}개</span></div>`).join('');wrap(`<div class="parentbox"><h2>🔒 보호자 화면</h2><p>이 정보는 태블릿 안에만 저장되며 외부로 전송하지 않습니다.</p><div class="statrow"><span>모은 별</span><strong>⭐ ${state.stars}개</strong></div><div class="statrow"><span>오늘 모은 별</span><strong>${todayStars()}/${DAILY_STAR_CAP}개</strong></div><div class="statrow"><span>오늘 완료한 서로 다른 놀이</span><strong>${todaySteps()}/${DAILY_STAR_CAP*STEPS_PER_STAR}개</strong></div><p>🌟 서로 다른 정답·필기 완료 ${STEPS_PER_STAR}개당 별 1개, 하루 최대 ${DAILY_STAR_CAP}개입니다. 단순 글자 탭과 자유 색칠에는 별을 주지 않습니다.</p><div class="statrow"><span>한글 모험 완료</span><strong>${Object.keys(state.lessonDone||{}).length}/5 단계</strong></div>${entries}<p>※ 위 활동별 숫자는 각 날짜에 새롭게 별을 얻은 문제 수입니다. 따라 쓰기는 획의 시작·순서·방향·모양을 기준으로 간단히 검사하지만, 전문가 손글씨 평가를 대체하지 않습니다. 색칠은 자유 그림으로 채점하지 않습니다.</p>
<form id="family-form" class="family-settings"><h3>🏠 가족 이름 등록 · 이 기기에만 저장</h3><p>가족 실명은 공개 GitHub에 올리지 않습니다. 태블릿 내부에만 저장되어 이름 따라 쓰기와 칭찬에 사용돼요.</p><div class="family-fields">${[['kid','🧒 내 이름'],['mom','👩 엄마 이름'],['dad','👨 아빠 이름']].map(([id,label])=>`<label>${label}<input name="${id}" type="text" autocomplete="off" maxlength="5" value="${esc(state.family?.[id]||'')}" placeholder="2~5글자 한글 이름"/></label>`).join('')}</div><button class="largebtn green" type="submit">이름 저장하기 🔒</button><p class="voice-hint">우리 아이 이름을 등록하면 칭찬할 때 자동으로 이름을 불러줘요.</p></form><div class="voice-panel"><h3>🎙️ 목소리 선택</h3><p>태블릿에 있는 한국어 목소리를 골라 주세요. 따뜻한 말투와 속도도 바꿀 수 있어요.</p><label for="voice-choice">목소리</label><select class="voice-select" id="voice-choice" aria-label="한국어 목소리 고르기"><option value="">기본 한국어 목소리</option></select><p id="voice-status" class="voice-hint">목소리를 찾는 중입니다.</p><div class="tone-choices">${Object.entries(TONES).map(([id,t])=>`<button class="tone-choice ${state.voiceTone===id?'active':''}" data-a="tone" data-tone="${id}">${t.label}</button>`).join('')}</div><div class="lesson-actions"><button class="small-action" data-a="voice-test">🔊 목소리 미리 듣기</button></div><p class="voice-hint">기기에 목소리가 하나뿐이라면 선택지도 하나입니다. 이 앱은 유료 음성 API를 사용하지 않습니다. 시스템 음성은 기기 설정에 따라 인터넷이 필요할 수 있습니다.</p></div>
<div class="installbox"><h3>📱 태블릿 홈 화면에 설치하기</h3>
<p>웹주소(https://)로 처음 접속한 상태에서 설치하세요. 설치 후 비행기 모드에서도 앱을 다시 열어 오프라인 동작을 확인할 수 있습니다.</p>
<div class="controls"><button class="largebtn green" data-a="install">📲 설치하기</button></div>
<p>안드로이드 크롬: 오른쪽 위 ⋮ → <b>앱 설치</b> 또는 <b>홈 화면에 추가</b><br>
아이패드: 사파리 공유 버튼 → <b>홈 화면에 추가</b></p>
<p>설치 버튼에서 별도 창이 나타나지 않으면 위의 브라우저 메뉴를 이용해 주세요. 파일(file://)로 연 경우는 홈 화면 앱 설치가 지원되지 않을 수 있습니다.</p>
</div><button class="danger star-reset" data-a="reset-stars">⭐ 별만 초기화 (가족 이름·학습 진도 유지)</button><div style="height:12px"></div><button class="danger" data-a="reset">모든 학습 기록 초기화</button><div style="height:16px"></div><button class="largebtn white" data-a="home">돌아가기</button></div>`);refreshVoices();}
function handle(action,el){
if(action==='bgm'){if(window.JoyBgm){window.JoyBgm.setMuted(!window.JoyBgm.muted);alertToast(window.JoyBgm.muted?'배경음악을 껐어요.':'배경음악을 켰어요!');}return;}if(action==='refresh'){refreshApp();return;}if(action==='reset-stars'){resetStarsOnly();return;}if(action==='stickers'){stickerBook();return;}
if(action==='family-choose'){startFamily(el.dataset.person);return;}
if(action==='race-hear'){say(view.deck[view.round].name);return;}
if(action==='race-pick'){if(view.answered)return;const pick=view.q[+el.dataset.index];if(pick.name!==view.deck[view.round].name){view.wrong=+el.dataset.index;animalRace();say('다시 들어 볼까?');return;}view.answered=true;gain('safari',view.deck[view.round].name);animalRace();sayPraise();return;}
if(action==='trace-demo'){revealStrokeDemo();return;}
if(action==='trace-undo'){view.traceDone=view.traceDone||[];view.traceDone.pop();view.answered=false;guidedWrite();return;}
if(action==='trace-clear'){view.traceDone=[];view.answered=false;guidedWrite();return;}
if(action==='journey-map'){journeyMap();return;}if(action==='journey-level'){startJourney(el.dataset.index);return;}if(action==='journey-hear'){speakParts(journeyPrompt());return;}if(action==='journey-answer'){if(view.answered)return;const i=Number(el.dataset.index),opt=view.q[i],kind=LESSONS[view.lesson].kind;const picked=kind==='blend'?opt[2]:opt[0];if(picked!==journeyCorrect()){view.wrong=i;journeyPlay();say('다시 한 번 해 볼까?');return;}view.answered=true;gain('journey',view.lesson+':'+journeyCorrect());journeyPlay();sayPraise();return;}if(action==='tone'){if(!TONES[el.dataset.tone])return;state.voiceTone=el.dataset.tone;persist();parent();sayPraise();return;}if(action==='voice-test'){view.praise='';sayPraise();return;}if(action==='show-stroke'){const el=document.getElementById('stroke-demo');if(el){el.classList.remove('play');void el.offsetWidth;el.classList.add('play');}return;}if(action==='home'){home();return;}if(action==='sound'){state.sound=!state.sound;if(!state.sound)stopSpeech();persist();const m=view.mode;if(m==='home')home();else if(m==='learn')learn();else if(m==='parent')parent();else renderMode();if(state.sound)say('안녕! 함께 한글 놀이 해요!');return;}if(action==='open'){start(el.dataset.mode);return;}if(action==='break'){breakDismissed=true;renderCurrent();return;}if(action==='parent'){parent();return;}if(action==='install'){if(installPrompt){const prompt=installPrompt;installPrompt=null;prompt.prompt().catch(()=>{alertToast('브라우저 메뉴에서 홈 화면에 추가해 주세요.');});}else{alertToast('브라우저 메뉴에서 앱 설치 또는 홈 화면에 추가를 눌러 주세요.');}return;}if(action==='reset'){const answer=window.confirm('정말 모든 별과 학습 기록을 지울까요?');if(answer){const family=state.family,voiceKey=state.voiceKey,voiceTone=state.voiceTone;state={...initialState(),family,voiceKey,voiceTone};persist();parent();}return;}if(action==='next'){next();return;}if(action==='read'){say(el.dataset.text);return;}if(action==='tab'){view.tab=el.dataset.tab;view.selected=0;learn();return;}if(action==='letter'){view.selected=+el.dataset.index;const x=dataset()[view.selected];learn();sayLetterExample(x,view.tab);return;}if(action==='read-letter'){const x=dataset()[view.selected];sayLetterExample(x,view.tab);return;}
 if(action==='answer-quiz'||action==='answer-space'){if(view.answered)return;const i=+el.dataset.index;const right=view.mode==='quiz'?view.q[i].w===view.deck[view.round].w:view.q[i][0]===view.deck[view.round][0];if(!right){view.wrong=i;el.classList.add('bad');markAnswer(false);return;}markAnswer(true,view.mode,view.deck[view.round].w||view.deck[view.round][0]);return;}
 if(action==='pick'){if(view.answered)return;const i=+el.dataset.index;if(view.chosen.includes(i))return;view.chosen.push(i);const item=view.deck[view.round];if(view.chosen.length===[...item.w].length){const attempt=view.chosen.map(x=>view.q[x].s).join('');if(attempt===item.w){view.answered=true;gain('build',item.w);sayPraise();renderMode();}else{alertToast('순서를 바꿔서 다시 만들어 봐요 💗');say('한 번 더 해 볼까요?');renderMode();}}else renderMode();return;}
 if(action==='undo'){view.chosen.pop();renderMode();return;}if(action==='clear-choose'){view.chosen=[];renderMode();return;}
 if(action==='color'){view.palette=el.dataset.color;document.querySelectorAll('.color-dot').forEach(x=>x.classList.toggle('selected',x.dataset.color===view.palette));return;}
 if(action==='undo-stroke'){view.strokes.pop();renderMode();return;}if(action==='clear-strokes'){view.strokes=[];renderMode();return;}
 if(action==='finish-draw'){if(view.mode!=='color'||!view.strokes.some(s=>s.points.length>=3))return;view.answered=true;say('멋지게 꾸몄네!');renderMode();return;}
}
async function refreshApp(){if(!navigator.onLine){alertToast('지금은 인터넷이 꺼져 있어요. 연결한 뒤 다시 눌러 주세요.');return;}alertToast('새 버전을 확인하고 있어요…');try{if('serviceWorker' in navigator){const reg=await navigator.serviceWorker.getRegistration();if(reg)await reg.update();}const url=new URL('./index.html',location.href);url.searchParams.set('_refresh',Date.now().toString());const reply=await fetch(url.toString(),{cache:'no-store'});if(!reply.ok)throw Error('HTTP '+reply.status);location.reload();}catch(e){alertToast('새로고침을 완료하지 못했어요. 인터넷을 확인해 주세요.');}}
function renderCurrent(){if(view.mode==='journey-map')journeyMap();else if(view.mode==='home')home();else if(view.mode==='learn')learn();else if(view.mode==='parent')parent();else if(view.mode==='family-home')familyHome();else if(view.mode==='stickers')stickerBook();else renderMode();}
ROOT.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b)handle(b.dataset.a,b);});ROOT.addEventListener('submit',e=>{if(e.target?.id!=='family-form')return;e.preventDefault();const input=new FormData(e.target);const family=Object.fromEntries(['kid','mom','dad'].map(k=>[k,String(input.get(k)||'').trim()]));if(!Object.values(family).every(v=>/^[가-힣]{2,5}$/.test(v))){alertToast('이름은 한글 2~5글자로 입력해 주세요.');return;}state.family=family;persist();parent();alertToast('가족 이름을 태블릿에 안전하게 저장했어요!');});
ROOT.addEventListener('change',e=>{if(e.target?.id==='voice-choice'){state.voiceKey=e.target.value;persist();sayPraise();}});
window.addEventListener('resize',()=>{if((view.mode==='trace'||view.mode==='color')&&!view.answered)renderMode();});
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){window.addEventListener('load',()=>{navigator.serviceWorker.register('./sw.js').catch(()=>{});});}
home();
// Reveal the ready app only after the full-screen welcome scene has been visible briefly.
(function dismissWelcome(){const splash=document.getElementById('joy-splash');if(!splash)return;setTimeout(()=>{splash.classList.add('is-hiding');setTimeout(()=>splash.remove(),560);},1050);})();
window.HANGUL_QA={state:()=>JSON.parse(JSON.stringify(state)),go:start,view:()=>({mode:view.mode,round:view.round,lesson:view.lesson,answered:view.answered,chosen:view.chosen.slice()}),journey:(n)=>startJourney(n),voices:()=>availableKoreanVoices().map(v=>v.name),speakParts,glyphStrokes,traceEvaluation,family:()=>familyData(),reset:()=>{state=initialState();persist();home();}};
})();
</script>
