.installbox{margin:22px 0;padding:20px;border:3px solid #d7d0fb;border-radius:22px;background:#f6f3ff}.installbox h3{font-size:22px;color:#5948a8;margin:0 0 8px}.installbox p{font-size:15px;line-height:1.7}.installbox .largebtn{min-height:52px;font-size:18px;padding:9px 16px}

:root{--sunshine:#fff8cb;--peach:#ffcfaa;--minty:#dcfff0}
.topbar .refresh-pill{background:#e7fff6;color:#207967;font-size:15px}
.modegrid{grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}

.hero{min-height:200px}.hero h1{font-size:clamp(30px,4.5vw,51px)}

.modegrid{grid-template-columns:repeat(4,minmax(0,1fr));gap:15px}.modecard{background:var(--bg);border:4px solid white;border-bottom:8px solid var(--edge);min-height:224px;display:flex;position:relative;flex-direction:column;align-items:center;justify-content:space-between;text-align:center;padding:13px 10px 15px;box-shadow:0 9px 16px #785f9720;transition:transform .2s,box-shadow .2s}.modecard::before{content:'✦';position:absolute;right:16px;top:6px;font-size:28px;color:#ffffff}.modecard:hover,.modecard:focus-visible{transform:translateY(-5px) rotate(-1deg);box-shadow:0 14px 21px #785f9740}.card-art{height:118px;min-width:0;width:100%;display:flex;align-items:center;justify-content:center;overflow:hidden}.card-art img{height:118px;width:100%;object-fit:contain;border-radius:18px;animation:tiny-bob 4s ease-in-out infinite}.card-art .emoji{font-size:clamp(60px,7.6vw,86px);animation:tiny-bob 4s ease-in-out infinite}.modecard .card-copy{display:flex;align-items:center;flex-direction:column;gap:6px;width:100%}.modecard .card-copy strong{font-size:clamp(16px,1.8vw,23px);line-height:1.2;color:#342763}.modecard .card-copy>span{font-size:12px;line-height:1.4;color:#666083;font-weight:850}.card-arrow{position:absolute;right:10px;bottom:10px;font-size:18px;color:#8b74b8}.modecard .emoji,.modecard span:last-child{color:inherit}

/* Cosmic exploration with independent decorative layers that cannot block buttons */
.spacebg{isolation:isolate;min-height:540px;background:radial-gradient(ellipse at 20% 16%,#593aab 0%,transparent 45%),radial-gradient(ellipse at 86% 75%,#395ac1 0%,transparent 48%),linear-gradient(140deg,#120c39,#18134c 48%,#0f103e 100%);border:5px solid #373073;box-shadow:inset 0 0 60px #715ad330,0 15px 30px #21184f38;overflow:hidden}.spacebg::before{display:none}.spacebg .space-ui{position:relative;z-index:5;width:100%;display:flex;flex-direction:column;align-items:center;gap:20px}.space-mission-chip{background:#ffffff24;color:#ffe9a5;border:2px solid #fff5b272;padding:9px 20px;border-radius:99px;font-weight:950}.spacebg .question-title{color:#fff;text-shadow:0 4px 0 #342767;font-size:clamp(34px,4vw,48px)}.cosmos-nebula{position:absolute;inset:0;background:radial-gradient(ellipse at 15% 66%,#8b36b933 0,transparent 34%),radial-gradient(ellipse at 68% 10%,#39bce03b 0,transparent 32%);z-index:0;pointer-events:none;animation:nebula-breathe 7s ease-in-out infinite}.cosmos-stars{position:absolute;inset:0;z-index:1;pointer-events:none}.cosmos-stars span{position:absolute;left:var(--x);top:var(--y);color:#f5edff;opacity:.7;transform:scale(var(--scale));font-size:16px;text-shadow:0 0 9px #fff;animation:star-blink 3.2s ease-in-out var(--delay) infinite}.meteor{position:absolute;z-index:2;height:3px;width:135px;border-radius:99px;transform:rotate(-27deg);background:linear-gradient(90deg,transparent,#89edff,#fffbe1);box-shadow:0 0 18px #72efff;left:110%;top:10%;pointer-events:none;animation:meteor-fly 6.3s linear infinite}.meteor-b{top:44%;animation-delay:-2.6s;animation-duration:8.5s;opacity:.65}.meteor-c{top:71%;animation-delay:-5.1s;animation-duration:10.5s;opacity:.7}.cosmos-moon{position:absolute;top:5%;right:9%;font-size:67px;z-index:1;animation:tiny-bob 5s ease-in-out infinite}.cosmos-ship{position:absolute;left:2%;bottom:18px;z-index:4;pointer-events:none;display:flex;flex-direction:column;align-items:center;transform:rotate(15deg);animation:rocket-hover 3.1s ease-in-out infinite}.ship-body{font-size:85px;filter:drop-shadow(0 10px 15px #0008)}.ship-fire{font-size:35px;animation:fire-flicker .35s alternate infinite}.rocket-launch .cosmos-ship{animation:rocket-launch 1.25s ease-in forwards}.planetchoices{position:relative;z-index:5}.planet{position:relative;isolation:isolate;border:6px solid rgba(255,255,255,.36)!important;box-shadow:inset -20px -18px 0 #0002,0 13px 0 #160f4760,0 0 35px #d4b7ff62;animation:planet-float 3.8s ease-in-out infinite;animation-delay:calc(var(--p)*-.85s);color:#241b62!important;text-shadow:0 3px 1px #fff9;font-size:clamp(54px,7.2vw,104px);font-weight:1000}.planet-glow{position:absolute;inset:12%;border-top:4px solid #fff8;border-radius:50%;transform:rotate(-18deg);pointer-events:none}.planet:hover{transform:scale(1.06)}

function playJoyChime(){if(!state.sound)return;try{const Context=window.AudioContext||window.webkitAudioContext;if(!Context)return;const ctx=new Context();const now=ctx.currentTime;[523,659,784,1047].forEach((hz,i)=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.setValueAtTime(hz,now+i*.082);g.gain.setValueAtTime(.0001,now+i*.082);g.gain.exponentialRampToValueAtTime(.075,now+i*.082+.015);g.gain.exponentialRampToValueAtTime(.0001,now+i*.082+.21);o.connect(g).connect(ctx.destination);o.start(now+i*.082);o.stop(now+i*.082+.22);});setTimeout(()=>ctx.close().catch(()=>{}),1200);}catch(e){}}

const key=today()+':'+mode+':'+id;if(state.seen[key])return false;state.seen[key]=1;
state.studySteps=state.studySteps||{};state.studySteps[today()]=(state.studySteps[today()]||0)+1;state.counts[mode]=(state.counts[mode]||0)+1;
let award=false;if(state.studySteps[today()]%STEPS_PER_STAR===0&&todayStars()<DAILY_STAR_CAP){state.stars++;state.daily[today()]=(state.daily[today()]||0)+1;award=true;}

function scrambleWord(word){const target=[...word];let arr=target.map((s,i)=>({s,i}));if(target.length<2)return arr;for(let n=0;n<12;n++){const shuffled=random(arr);if(shuffled.map(x=>x.s).join('')!==word)return shuffled;}return arr.reverse();}
function random(a){const b=a.slice();for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}

let speechToken=0,speechTimer=null,voiceList=[];
function availableKoreanVoices(){if(!('speechSynthesis' in window))return [];try{return window.speechSynthesis.getVoices().filter(v=>String(v.lang).toLowerCase().startsWith('ko'));}catch(e){return [];}}
function refreshVoices(){voiceList=availableKoreanVoices();const select=document.getElementById('voice-choice');if(!select)return;const current=state.voiceKey||'';select.innerHTML='<option value="">기본 한국어 목소리</option>'+voiceList.map(v=>`<option value="${esc(v.voiceURI||v.name)}">${esc(v.name)}${v.localService?' · 기기 음성':''}</option>`).join('');select.value=voiceList.some(v=>(v.voiceURI||v.name)===current)?current:'';const status=document.getElementById('voice-status');if(status)status.textContent=voiceList.length?`한국어 목소리 ${voiceList.length}개 발견 · 선택 즉시 저장됩니다.`:'한국어 목소리를 아직 찾지 못했어요. 기기 음성 설정을 확인해 주세요.';}
function esc(value){return String(value).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
if('speechSynthesis' in window){window.speechSynthesis.addEventListener?.('voiceschanged',refreshVoices);refreshVoices();}
function stopSpeech(){speechToken++;if(speechTimer!==null){clearTimeout(speechTimer);speechTimer=null;}try{window.speechSynthesis?.cancel();}catch(e){}}
function speakParts(parts,pauseMs=560,cheerful=false){stopSpeech();if(!state.sound||!('speechSynthesis' in window))return;const token=speechToken;const phrases=parts.map(x=>String(x||'').trim()).filter(Boolean);let index=0;
 function nextPart(){if(token!==speechToken||!state.sound||index>=phrases.length)return;const u=new SpeechSynthesisUtterance(phrases[index++]);u.lang='ko-KR';const tone=TONES[state.voiceTone]||TONES.warm;u.rate=cheerful?Math.min(1.04,Math.max(.81,tone.rate+(.035*index))):tone.rate;u.pitch=cheerful?Math.min(1.7,Math.max(1.13,tone.pitch+.13+(index%2)*.05)):tone.pitch;u.volume=1;const voices=availableKoreanVoices();const chosen=voices.find(v=>(v.voiceURI||v.name)===state.voiceKey);u.voice=chosen||voices.find(v=>/female|woman|여성|google.*한국어/i.test(v.name))||voices[0]||null;
  let finished=false;function advance(){if(finished||token!==speechToken)return;finished=true;if(index<phrases.length)speechTimer=setTimeout(()=>{speechTimer=null;nextPart();},pauseMs);}
  u.onend=advance;u.onerror=advance;try{window.speechSynthesis.speak(u);}catch(e){advance();}
 }
 nextPart();
}

function setupGuidedCanvas(strokes){const c=document.querySelector('#trace-canvas');if(!c)return;const ctx=c.getContext('2d'),dpr=Math.min(devicePixelRatio||1,2);const size=c.clientWidth||340;c.width=Math.round(size*dpr);c.height=Math.round(size*dpr);ctx.setTransform(c.width/100,0,0,c.height/100,0,0);let active=null,points=[];

async function refreshApp(){if(!navigator.onLine){alertToast('지금은 인터넷이 꺼져 있어요. 연결한 뒤 다시 눌러 주세요.');return;}alertToast('새 버전을 확인하고 있어요…');try{if('serviceWorker' in navigator){const reg=await navigator.serviceWorker.getRegistration();if(reg)await reg.update();}const url=new URL('./index.html',location.href);url.searchParams.set('_refresh',Date.now().toString());const reply=await fetch(url.toString(),{cache:'no-store'});if(!reply.ok)throw Error('HTTP '+reply.status);location.reload();}catch(e){alertToast('새로고침을 완료하지 못했어요. 인터넷을 확인해 주세요.');}}
function renderCurrent(){if(view.mode==='journey-map')journeyMap();else if(view.mode==='home')home();else if(view.mode==='learn')learn();else if(view.mode==='parent')parent();else if(view.mode==='family-home')familyHome();else if(view.mode==='stickers')stickerBook();else renderMode();}
ROOT.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b)handle(b.dataset.a,b);});ROOT.addEventListener('submit',e=>{if(e.target?.id!=='family-form')return;e.preventDefault();const input=new FormData(e.target);const family=Object.fromEntries(['kid','mom','dad'].map(k=>[k,String(input.get(k)||'').trim()]));if(!Object.values(family).every(v=>/^[가-힣]{2,5}$/.test(v))){alertToast('이름은 한글 2~5글자로 입력해 주세요.');return;}state.family=family;persist();parent();alertToast('가족 이름을 태블릿에 안전하게 저장했어요!');});
ROOT.addEventListener('change',e=>{if(e.target?.id==='voice-choice'){state.voiceKey=e.target.value;persist();sayPraise();}});
window.addEventListener('resize',()=>{if((view.mode==='trace'||view.mode==='color')&&!view.answered)renderMode();});
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){window.addEventListener('load',()=>{navigator.serviceWorker.register('./sw.js').catch(()=>{});});}
home();
// Reveal the ready app only after the full-screen welcome scene has been visible briefly.
(function dismissWelcome(){const splash=document.getElementById('joy-splash');if(!splash)return;setTimeout(()=>{splash.classList.add('is-hiding');setTimeout(()=>splash.remove(),560);},1050);})();
window.HANGUL_QA={state:()=>JSON.parse(JSON.stringify(state)),go:start,view:()=>({mode:view.mode,round:view.round,lesson:view.lesson,answered:view.answered,chosen:view.chosen.slice()}),journey:(n)=>startJourney(n),voices:()=>availableKoreanVoices().map(v=>v.name),speakParts,glyphStrokes,traceEvaluation,family:()=>familyData(),reset:()=>{state=initialState();persist();home();}};
})();
