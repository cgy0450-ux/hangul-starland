<!doctype html><html lang="ko"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/><meta name="theme-color" content="#7756bf"/><title>쪼이랜드 미로 탐험</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(circle at 12% 8%,#fff6c6,transparent 40%),radial-gradient(circle at 85% 85%,#c6ffe9,transparent 40%),#f3edff;color:#382a6b;font-family:"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;font-weight:800}button{font:inherit;touch-action:manipulation;cursor:pointer;border:0}header{display:flex;align-items:center;padding:10px 16px;gap:10px;max-width:1000px;margin:auto}header a{padding:11px 13px;background:#fff;border-radius:17px;color:#6648a1;text-decoration:none;box-shadow:0 4px 0 #d8c9f0}header h1{font-size:clamp(21px,5vw,30px);margin:0}header button{margin-left:auto;background:#fff5bb;padding:10px;border-radius:15px}main{max-width:980px;margin:auto;padding:4px 15px 22px}.intro{margin:8px 0 16px;font-size:14px;color:#766c91}.levels{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}.level{background:var(--bg);padding:15px 10px;border:5px solid #fff;border-radius:25px;box-shadow:0 7px 0 #cfbce6,0 11px 20px #9992ac44;min-height:134px;color:#443376;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:4px}.level b{font-size:19px}.level small{font-size:11px;color:#7c689a}.level .e{font-size:40px}.game{display:none}.game.active{display:flex;flex-direction:column;align-items:center;gap:6px}.levels.hidden,.intro.hidden{display:none}.gamehead{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px}.gamehead button{background:#fff;border-radius:12px;padding:11px;color:#694bb0;font-weight:900}.gamehead strong{font-size:clamp(18px,4vw,26px)}.scene{width:100%;max-width:650px;min-height:50px;border-radius:23px;text-align:center;background:linear-gradient(100deg,#d7efff,#fff8df,#d8f8de);padding:8px;font-size:clamp(17px,4vw,25px);box-shadow:0 4px 0 #d5cde7}.scene .big{font-size:30px}.board{margin:4px auto;display:grid;grid-template-columns:repeat(var(--n),1fr);width:min(calc(100vw - 48px),55dvh,520px);height:min(calc(100vw - 48px),55dvh,520px);border:5px solid #fefefd;border-radius:12px;box-shadow:0 6px 0 #d0b4e9,0 12px 23px #8170ac55;overflow:hidden;touch-action:none;background:#fff}.cell{background:#f6fcff;position:relative;display:flex;align-items:center;justify-content:center;font-size:clamp(9px,4vmin,27px);border-top:var(--t) solid #6a4da5;border-right:var(--r) solid #6a4da5;border-bottom:var(--b) solid #6a4da5;border-left:var(--l) solid #6a4da5;user-select:none}.cell.done{background:#dbf8e7}.cell.here{background:#ffe3ac}.cell.goal{background:#edfff0}.pad{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(2,44px);gap:4px;justify-content:center;margin-top:5px}.pad button{font-size:23px;border-radius:13px;background:#ffd874;color:#785a29;box-shadow:0 4px 0 #d4a84b}.pad .up{grid-column:2}.pad .left{grid-column:1;grid-row:2}.pad .down{grid-column:2;grid-row:2}.pad .right{grid-column:3;grid-row:2}.actions{display:flex;gap:9px;justify-content:center;margin-top:8px}.actions button{min-width:120px;border-radius:17px;padding:13px 15px;font-weight:900;background:#70cdb9;color:#fff;box-shadow:0 4px 0 #4a9c8a}.actions .again{background:#fff;color:#5f4ba0;box-shadow:0 4px 0 #d9c7f1}.msg{text-align:center;min-height:27px;color:#7153a8;font-weight:900}.foot{font-size:12px;color:#827c94;text-align:center;margin-top:15px}@media(min-width:800px){.levels{grid-template-columns:repeat(4,1fr)}.board{width:min(58dvh,600px);height:min(58dvh,600px)}}@media(max-height:660px){header{padding:5px 12px}.board{width:min(55dvh,calc(100vw - 50px));height:min(55dvh,calc(100vw - 50px))}.scene{min-height:35px;padding:4px}.pad{grid-template-columns:repeat(3,44px);grid-template-rows:repeat(2,35px)}.pad button{font-size:18px}} 
html:has(.game.active),body:has(.game.active){height:100%;overflow:hidden!important;overscroll-behavior:none}body:has(.game.active){height:100dvh;display:flex;flex-direction:column}body:has(.game.active) header{padding:5px 10px;min-height:48px}body:has(.game.active) main{height:calc(100dvh - 58px);flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;padding:4px 10px}body:has(.game.active) .game.active{flex:1;min-height:0;gap:4px;justify-content:center;overflow:hidden}body:has(.game.active) .board{height:min(48dvh,calc(100vw - 36px),480px);width:min(48dvh,calc(100vw - 36px),480px);flex-shrink:1}body:has(.game.active) .scene{padding:5px;font-size:clamp(13px,3vw,20px)}body:has(.game.active) .gamehead button{padding:7px 9px}</style><link rel="stylesheet" href="./joiland-theme-v11.css"></head><body><header><a href="./index.html?subject=hangul">⌂ 한글 홈</a><h1>🧩 쪼이의 미로 탐험</h1></header><main><div class="intro" id="intro">손가락으로 쪼이부터 길을 이어서 목표에 도착해 보세요! 20단계 미로가 기다려요.</div><div class="levels" id="levels"></div><div class="game" id="game"><div class="gamehead"><button id="back">‹ 미로 선택</button><strong id="label"></strong><span id="count"></span></div><div class="scene" id="scene"></div><div class="board" id="board"></div><div class="msg" id="msg">🐯 호랑이부터 손가락으로 길을 그려봐!</div><div class="pad" style="display:none" aria-hidden="true"><button class="up" data-d="0">↑</button><button class="left" data-d="3">←</button><button class="down" data-d="2">↓</button><button class="right" data-d="1">→</button></div><div class="actions"><button class="again" id="again">다시 시작</button><button id="next">다음 미로 ➜</button></div></div><p class="foot">20개 학습 단어와 난이도는 이전 미로 프로젝트를 기준으로 했습니다. 실제 종이학습지의 배경 그림은 아직 별도로 이전하지 않았습니다.</p></main>
<script>
const topics=[["별","⭐"],["달","🌙"],["꽃","🌼"],["나비","🦋"],["책","📚"],["나무","🌳"],["강아지","🐶"],["고양이","🐱"],["사과","🍎"],["자동차","🚗"],["해","☀️"],["비행기","✈️"],["우산","☂️"],["바나나","🍌"],["물고기","🐠"],["토끼","🐰"],["집","🏠"],["연필","✏️"],["컵","🥤"],["별자리","🌌"]];
const palette=["#e6f1ff","#fff5d8","#fce8fb","#e1f9e8","#ffe9df"];
let current=-1,n=0,cells=[],pos=0,seen=new Set(),solved=false,drag=false,trail=[0],lastPointer=null;
function rnd(seed){let a=seed|0;return()=>{a^=a<<13;a^=a>>>17;a^=a<<5;return (a>>>0)/4294967296;};}
function carve(idx){n=idx<5?5:idx<10?7:idx<15?9:11;const r=rnd(123456+idx*9127);cells=Array.from({length:n*n},()=>[1,1,1,1]);const visited=new Set([0]),stack=[0];while(stack.length){const v=stack[stack.length-1],x=v%n,y=Math.floor(v/n),options=[];if(y>0&&!visited.has(v-n))options.push([0,v-n,2]);if(x<n-1&&!visited.has(v+1))options.push([1,v+1,3]);if(y<n-1&&!visited.has(v+n))options.push([2,v+n,0]);if(x>0&&!visited.has(v-1))options.push([3,v-1,1]);if(!options.length){stack.pop();continue;}const [d,to,rev]=options[Math.floor(r()*options.length)];cells[v][d]=0;cells[to][rev]=0;visited.add(to);stack.push(to);}pos=0;seen=new Set([0]);trail=[0];solved=false;}
function draw(){const b=document.getElementById('board');b.style.setProperty('--n',n);b.style.position='relative';const tiles=cells.map((walls,i)=>'<div data-cell="'+i+'" class="cell '+(seen.has(i)?'done ':'')+(pos===i?'here ':'')+(i===n*n-1?'goal':'')+'" style="--t:'+(walls[0]?'3px':'0')+';--r:'+(walls[1]?'3px':'0')+';--b:'+(walls[2]?'3px':'0')+';--l:'+(walls[3]?'3px':'0')+'">'+(pos===i?'🐯':i===n*n-1?topics[current][1]:'')+'</div>').join('');const line=trail.map(i=>((i%n+.5)*100/n).toFixed(2)+','+((Math.floor(i/n)+.5)*100/n).toFixed(2)).join(' ');const overlay='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true" style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2;overflow:visible"><polyline points="'+line+'" fill="none" stroke="#fff" stroke-width="'+(60/n/10)+'" stroke-linecap="round" stroke-linejoin="round"/><polyline points="'+line+'" fill="none" stroke="#ff7aa5" stroke-width="'+(40/n/10)+'" stroke-linecap="round" stroke-linejoin="round"/></svg>';b.innerHTML=tiles+overlay;}
function select(i){current=i;carve(i);document.getElementById('levels').classList.add('hidden');document.getElementById('intro').classList.add('hidden');document.getElementById('game').classList.add('active');document.getElementById('label').textContent=topics[i][1]+' '+topics[i][0];document.getElementById('count').textContent=(i+1)+'/20';document.getElementById('scene').innerHTML='<span class="big">'+topics[i][1]+'</span> 쪼이가 '+topics[i][0]+'을(를) 찾아가요!';document.getElementById('msg').textContent='🐯 호랑이부터 손가락으로 길을 그려봐!';draw();}
function move(dir){if(solved||cells[pos][dir])return;pos+=[-n,1,n,-1][dir];if(trail.length>1&&pos===trail[trail.length-2])trail.pop();else trail.push(pos);seen.add(pos);draw();if(pos===n*n-1){solved=true;const arr=JSON.parse(localStorage.getItem('joiland-maze-done')||'[]');if(!arr.includes(current)){arr.push(current);localStorage.setItem('joiland-maze-done',JSON.stringify(arr));}document.getElementById('msg').textContent='🎉 도착! 잘했어! 정말 멋진 탐험이야!';if(window.speechSynthesis){const u=new SpeechSynthesisUtterance('우와! 미로를 찾았어요! 참 잘했어요!');u.lang='ko-KR';u.rate=.85;speechSynthesis.speak(u);}}}
function tryCell(i){const x=pos%n,y=Math.floor(pos/n),tx=i%n,ty=Math.floor(i/n);if(tx===x&&ty===y-1)move(0);else if(tx===x+1&&ty===y)move(1);else if(tx===x&&ty===y+1)move(2);else if(tx===x-1&&ty===y)move(3);}
const levels=document.getElementById('levels');function renderLevels(){const done=JSON.parse(localStorage.getItem('joiland-maze-done')||'[]');levels.innerHTML=topics.map((a,i)=>'<button class="level" style="--bg:'+palette[i%palette.length]+'" data-index="'+i+'"><span class="e">'+a[1]+'</span><b>'+(i+1)+'. '+a[0]+'</b><small>'+(i<5?'쉬움':i<10?'보통':i<15?'어려움':'도전')+(done.includes(i)?' · ⭐ 완료':'')+'</small></button>').join('');}renderLevels();
levels.addEventListener('click',e=>{const b=e.target.closest('[data-index]');if(b)select(Number(b.dataset.index));});document.getElementById('back').onclick=()=>{document.getElementById('game').classList.remove('active');levels.classList.remove('hidden');document.getElementById('intro').classList.remove('hidden');renderLevels();};document.getElementById('again').onclick=()=>select(current);document.getElementById('next').onclick=()=>select((current+1)%topics.length);
document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>move(Number(b.dataset.d)));
const board=document.getElementById('board');
function cellAt(x,y){const r=board.getBoundingClientRect();const cx=Math.floor((x-r.left)/r.width*n),cy=Math.floor((y-r.top)/r.height*n);if(cx<0||cx>=n||cy<0||cy>=n)return -1;return cy*n+cx;}
function drawMove(x,y){if(!lastPointer)return;const dx=x-lastPointer.x,dy=y-lastPointer.y;const len=Math.hypot(dx,dy),size=Math.max(2,board.clientWidth/n/3);const steps=Math.min(250,Math.ceil(len/size));for(let i=1;i<=steps;i++){const index=cellAt(lastPointer.x+dx*i/steps,lastPointer.y+dy*i/steps);if(index>=0)tryCell(index);if(solved)break;}lastPointer={x,y};}
board.addEventListener('pointerdown',e=>{if(solved)return;const index=cellAt(e.clientX,e.clientY);if(index!==pos)return;drag=true;lastPointer={x:e.clientX,y:e.clientY};board.setPointerCapture(e.pointerId);e.preventDefault();});
board.addEventListener('pointermove',e=>{if(!drag)return;e.preventDefault();drawMove(e.clientX,e.clientY);});
board.addEventListener('pointerup',e=>{if(drag)drawMove(e.clientX,e.clientY);drag=false;lastPointer=null;});
board.addEventListener('pointercancel',()=>{drag=false;lastPointer=null;});

</script><script src="./joiland-unified.js"></script></body></html>
