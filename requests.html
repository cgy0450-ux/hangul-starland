<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#7755ce"><title>쪼이랜드 · 이현이의 놀이터</title>
<style>
:root{font-family:system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:#47336e}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(circle at 8% 9%,#fff1b5,transparent 45%),radial-gradient(circle at 95% 90%,#bff9ed,transparent 50%),#f1ebff}header{max-width:980px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px}header a,header button{font-size:14px;color:#5f49a4;background:#fff;padding:10px;border-radius:15px;text-decoration:none;border:3px solid #fff;font-weight:950}header h1{font-size:clamp(20px,4.5vw,31px);margin:0;flex:1;text-align:center}main{width:min(100%,980px);padding:7px 14px 28px;margin:auto}.intro{border:6px solid #fff;border-radius:30px;text-align:center;background:linear-gradient(125deg,#fff3bf,#e9dcff,#d5f7fa);padding:18px 12px;box-shadow:0 8px 0 #d8c4e8;margin-bottom:19px}.intro h2{font-size:clamp(24px,5vw,35px);margin:0 0 8px}.intro p{font-size:clamp(14px,3vw,18px);margin:0}.games{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.game-card{min-height:255px;border:6px solid #fff;border-radius:30px;box-shadow:0 8px 0 #d5c4e9;padding:15px 9px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:10px;text-decoration:none;color:#47336e;transition:transform .13s}.game-card:hover,.game-card:focus-visible{transform:translateY(-3px);outline:none}.game-card .illustration{font-size:clamp(60px,10vw,99px);line-height:1.2}.game-card strong{font-size:clamp(19px,3.5vw,27px)}.game-card small{font-size:clamp(12px,2.3vw,15px);font-weight:700;color:#78649c}.game-card .play{padding:9px 18px;background:white;color:#6950ad;border-radius:16px;font-weight:950;border:2px solid #fff}.firetruck{background:linear-gradient(145deg,#d4f3ff,#ffe6b7)}.collect{background:linear-gradient(145deg,#fff2a6,#e1ffe3)}.dodge{background:linear-gradient(145deg,#e4e6ff,#d5f7ff)}.update{display:flex;justify-content:center;gap:10px;align-items:center;padding:18px;color:#826c9e;font-size:12px}.update button{background:#fff;border:3px solid #fff;border-radius:13px;padding:9px;color:#6c4ba9;font-weight:900;cursor:pointer}.foot{text-align:center;color:#786a98;font-size:13px}@media(max-width:680px){.games{grid-template-columns:1fr;gap:12px}.game-card{min-height:150px;flex-direction:row;text-align:left;justify-content:flex-start;gap:12px;padding:11px 14px}.game-card .illustration{font-size:58px}.game-card .copy{flex:1;display:flex;flex-direction:column;gap:5px}.game-card strong{font-size:19px}.game-card .play{font-size:13px;padding:8px}.intro{padding:12px}}
</style><link rel="stylesheet" href="./joiland-theme-v11.css"></head>
<body><header><a href="./index.html">🏠 홈</a><h1>🎮 이현이의 놀이터</h1><button id="sound">🔊</button></header>
<main>
<section class="intro"><h2>🐯 오늘은 어떤 모험?</h2><p>소방차로 친구를 구하거나 자동차로 보물을 모아 봐요!</p></section>
<section class="games" aria-label="선택 가능한 놀이">
<a class="game-card firetruck" href="./firetruck-rescue.html"><span class="illustration">🚒💦</span><span class="copy"><strong>출동! 소방차 구조대</strong><small>사이렌·헬리콥터·사다리 · 동물 구조 도감</small></span><span class="play">출동!</span></a>
<a class="game-card collect" href="./car-collect.html"><span class="illustration">🚙💎</span><span class="copy"><strong>자동차 아이템 모으기</strong><small>별·보석 먹고 자동차를 모아요</small></span><span class="play">출발!</span></a>
<a class="game-card dodge" href="./car-dodge.html"><span class="illustration">🚗💨</span><span class="copy"><strong>자동차 장애물 피하기</strong><small>차선을 옮겨 장애물을 피해요</small></span><span class="play">시작!</span></a>
</section>
<div class="update">쪼이랜드 놀이 v11.0 <button id="forceUpdate">↻ 최신 게임 불러오기</button></div>
<p class="foot">한 놀이를 5분 동안 즐기면 트로피를 받아요! 🏆</p>
</main>
<script>
(()=>{'use strict';const button=document.getElementById('sound');let sound=true;try{sound=JSON.parse(localStorage.getItem('hangul-starland-v1')||'{}').sound!==false}catch(e){}
button.textContent=sound?'🔊 소리 켬':'🔇 소리 끔';button.onclick=()=>{sound=!sound;button.textContent=sound?'🔊 소리 켬':'🔇 소리 끔';try{const o=JSON.parse(localStorage.getItem('hangul-starland-v1')||'{}');o.sound=sound;localStorage.setItem('hangul-starland-v1',JSON.stringify(o))}catch(e){}};
document.getElementById('forceUpdate').onclick=async()=>{try{const reg=await navigator.serviceWorker?.getRegistration();await reg?.update()}catch(e){}const url=new URL(location.href);url.searchParams.set('v',Date.now().toString());location.replace(url.href)};
})();
</script><script src="./joiland-unified.js"></script></body></html>
