<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#7654ce"><title>쪼이랜드 · 요청 놀이터</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:#42316c;font-weight:850}body{background:radial-gradient(circle at 10% 12%,#fff0bd,transparent 46%),radial-gradient(circle at 94% 86%,#cfffe9,transparent 52%),#efebff}button,a{font:inherit;touch-action:manipulation}button{border:0;cursor:pointer}header{padding:10px;max-width:820px;display:flex;gap:9px;align-items:center;justify-content:space-between;margin:auto}header a,header button{background:white;color:#6248a9;border-radius:17px;padding:10px;border:3px solid white;box-shadow:0 5px 0 #d0c0e9;text-decoration:none}header strong{font-size:clamp(18px,4.4vw,28px)}main{max-width:820px;margin:auto;padding:4px 12px}.intro{background:linear-gradient(125deg,#fff3cb,#d7f8ff,#e7f4ff);border:6px solid #fff;border-radius:29px;box-shadow:0 8px 0 #dac7ee;padding:14px;text-align:center;margin-bottom:20px}.intro h1{margin:0 0 5px;font-size:clamp(23px,5vw,38px)}.intro p{margin:0;color:#766497}.menu{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.card{min-height:175px;border-radius:29px;border:6px solid white;box-shadow:0 9px 0 #bea7e5;background:linear-gradient(155deg,#fff9d7,#e9ddff);padding:15px;display:flex;flex-direction:column;gap:10px;justify-content:center;align-items:center}.card:last-child{background:linear-gradient(155deg,#d7faff,#d6ffe4)}.card .emoji{font-size:clamp(48px,10vw,82px)}.card strong{font-size:clamp(19px,4.2vw,28px)}.card small{font-size:clamp(12px,2.7vw,15px);color:#79658d}.play{display:none}.play.active{display:flex;flex-direction:column;min-height:0;flex:1}.nav{display:flex;gap:7px;justify-content:space-between;align-items:center;margin:5px 0 8px}.nav button{border-radius:15px;background:white;color:#5d46a1;padding:9px 12px}.sheet{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:8px;border:6px solid white;border-radius:30px;box-shadow:0 8px 0 #d3c2e8;background:linear-gradient(180deg,#fff,#fff9ff);padding:12px;text-align:center}.sheet h2{margin:0;font-size:clamp(20px,4.2vw,29px)}.sheet p{margin:0;color:#70618c}.preview{display:flex;align-items:center;justify-content:center;gap:6px;min-height:57px;background:#f8f1ff;border-radius:18px;padding:7px}.tiny{display:inline-block;width:clamp(26px,7vw,45px);height:clamp(24px,6vw,38px);border-radius:8px;border:3px solid white;box-shadow:0 5px 0 #8275a0}.tiny.red{background:#ff6d7c}.tiny.blue{background:#77c9fb}.tiny.yellow{background:#ffd765}.tiny.green{background:#8de2ad}.tiny.purple{background:#bd9cf4}.tiny.orange{background:#ffad64}.preview .tiny{width:33px;height:31px}.tower-stage{position:relative;min-height:220px;max-height:36dvh;flex:1;background:linear-gradient(#c8eefd,#edfff0 70%,#c0e9a7 70%);border-radius:23px;display:flex;justify-content:center;align-items:flex-end;gap:12px;padding:7px 0 14px;overflow:hidden}.tower-stage:before{content:"☁️";position:absolute;left:10px;top:10px;font-size:35px}.tower{min-width:80px;display:flex;flex-direction:column-reverse;align-items:center;justify-content:flex-start;gap:1px;z-index:1}.block{width:clamp(72px,24vw,142px);height:clamp(34px,6.6vh,54px);border:4px solid #fff;border-radius:10px;box-shadow:inset 0 -10px 0 #00000015,0 4px 0 #72947a45;animation:fall .23s ease-out}.block.red{background:#ff6d7c}.block.blue{background:#77c9fb}.block.yellow{background:#ffd765}.block.green{background:#8de2ad}.block.purple{background:#bd9cf4}.block.orange{background:#ffad64}.palette{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.palette button{background:#f2eaff;border:3px solid white;border-radius:17px;min-height:55px;display:flex;align-items:center;justify-content:center;gap:6px;box-shadow:0 4px 0 #bfb0da}.palette .tiny{pointer-events:none}.controls{display:flex;justify-content:center;gap:8px}.controls button{border-radius:16px;padding:10px 14px;background:#e8dcff;color:#6042a5}.controls .next{background:#53c9a6;color:white}.bridge-stage{position:relative;flex:1;min-height:180px;max-height:35dvh;display:flex;align-items:end;justify-content:space-evenly;gap:5px;border-radius:23px;background:linear-gradient(#bdeafb 0 60%,#a0d7f3 60%);overflow:hidden;padding:20px}.bridge-stage .land{background:#7fcea2;border-radius:20px 20px 0 0;height:65px;flex:1}.bridge-stage .gap{height:83px;flex:1.5;position:relative;display:flex;align-items:end;justify-content:space-between}.support{width:30px;min-height:30px;background:#d4a76d;border:3px solid #fff;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:19px;color:white}.beam{position:absolute;left:0;right:0;bottom:48px;height:19px;border-radius:12px;background:#f1c979;border:3px solid white;box-shadow:0 4px 0 #b8884e}.car{position:absolute;top:-30px;left:45%;font-size:27px;animation:drive 2s infinite alternate}.message{min-height:30px;font-size:clamp(14px,3vw,20px);color:#21865f}.hidden{display:none!important}body.playing{height:100dvh;overflow:hidden}body.playing main{height:calc(100dvh - 75px);display:flex;flex-direction:column}body.playing .intro,body.playing .menu{display:none}@keyframes fall{from{transform:translateY(-40px);opacity:.4}to{transform:translateY(0);opacity:1}}@keyframes drive{to{left:70%}}@media(max-height:740px){header{padding:4px}header a,header button{padding:6px}.sheet{padding:6px;gap:5px}.tower-stage{min-height:145px}.bridge-stage{min-height:130px}.block{height:34px}.palette button{min-height:43px}.preview{min-height:40px;padding:4px}.sheet h2{font-size:21px}}@media(max-height:590px){.tower-stage{min-height:110px}.bridge-stage{min-height:90px}.sheet p{font-size:12px}.palette button{min-height:35px}}
</style><link rel="stylesheet" href="./joiland-theme-v11.css"></head><body><header><a href="./index.html">⌂ 과목 선택</a><strong>🐯 쪼이의 요청 놀이터</strong><button id="mute">🔊 소리 켬</button></header><main><div class="intro"><h1>🎮 이현이의 요청 놀이터</h1><p>🚒💦 새로운 소방차 구조대 게임이 추가됐어요!</p><a href="./firetruck-rescue.html" style="display:inline-block;background:#fff;padding:10px 15px;border-radius:15px;margin-top:9px;color:#5942a1;text-decoration:none;border:3px solid white;font-weight:900">🚒 소방차 게임 바로 시작</a></div><section class="menu" id="menu"><a class="card firetruck-game" href="./firetruck-rescue.html" style="text-decoration:none;color:#42316c;background:linear-gradient(155deg,#d5f4ff,#ffefd1)"><span class="emoji">🚒💦</span><strong>출동! 소방차 구조대</strong><small>물줄기를 조준해 불 끄기 · 5개 현장</small></a><a class="card car-collect" href="./car-collect.html" style="text-decoration:none;color:#42316c;background:linear-gradient(155deg,#fff0b7,#d0fbec)"><span class="emoji">🚙💎</span><strong>자동차 아이템 모으기</strong><small>별·보석·선물을 모아요 · 충돌 없음</small></a><button class="card" data-game="tower"><span class="emoji">🧱🌈</span><strong>무지개 블록 탑</strong><small>색깔 순서대로 쌓기 · 5단계</small></button><button class="card" data-game="bridge"><span class="emoji">🌉🚗</span><strong>자동차 튼튼 다리</strong><small>받침과 다리를 만들기 · 5단계</small></button><a class="card car-game" href="./car-dodge.html" style="text-decoration:none;color:#42316c;background:linear-gradient(155deg,#d9f5ff,#fff1ca)"><span class="emoji">🚙💨</span><strong>자동차 장애물 피하기</strong><small>좌우로 움직여 피하기 · 별 모으기</small></a></section><p style="text-align:center;font-size:12px;color:#7255a3">놀이 업데이트 v10.11 · 2026.11.13 <button id="forceUpdate" style="padding:7px 12px;border-radius:13px;background:#fff;color:#6041a5;font-weight:900">↻ 최신 게임 불러오기</button></p><section class="play" id="play"><div class="nav"><button id="back">‹ 놀이 선택</button><strong id="count">1 / 5</strong><strong id="score">⭐ 0</strong></div><div class="sheet"><h2 id="title"></h2><p id="guide"></p><div class="preview" id="preview"></div><div class="tower-stage" id="tower-stage"><div id="tower" class="tower"></div></div><div class="bridge-stage hidden" id="bridge-stage"><div class="land"></div><div class="gap"><div class="support" id="left-support"></div><div class="support" id="middle-support"></div><div class="support" id="right-support"></div><div id="beam"></div></div><div class="land"></div></div><div class="palette" id="palette"></div><div class="message" id="message"></div><div class="controls"><button id="undo">↶ 한 개 지우기</button><button id="reset">↻ 처음부터</button><button id="next" class="next hidden">다음 모험 ➜</button></div></div></section></main><script>
(function(){"use strict";const $=id=>document.getElementById(id),colors=['red','blue','yellow','green','purple','orange'],names={red:'빨강',blue:'파랑',yellow:'노랑',green:'초록',purple:'보라',orange:'주황'};
$('forceUpdate').onclick=async()=>{
 $('forceUpdate').textContent='업데이트 확인 중';
 try{if('serviceWorker' in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(r=>r.update().catch(()=>{})));}
 const q=new URLSearchParams(location.search);q.set('v',Date.now().toString());location.replace(location.pathname+'?'+q.toString());
 }catch(e){location.reload();}
};
const towerLevels=[['red','blue','yellow'],['yellow','green','red'],['blue','yellow','green','purple'],['green','red','blue','yellow'],['orange','yellow','red','green','blue']];
const bridgeLevels=[2,3,2,3,2];let kind='',level=0,stack=[],score=0,locked=false,soundOn=true;
try{soundOn=JSON.parse(localStorage.getItem('hangul-starland-v1')||'{}').sound!==false}catch(e){}
$('mute').textContent=soundOn?'🔊 소리 켬':'🔇 소리 끔';
function say(t){if(!soundOn||!('speechSynthesis'in window))return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='ko-KR';u.rate=.9;u.pitch=1.05;speechSynthesis.speak(u)}catch(e){}}
$('mute').onclick=()=>{soundOn=!soundOn;$('mute').textContent=soundOn?'🔊 소리 켬':'🔇 소리 끔';try{const o=JSON.parse(localStorage.getItem('hangul-starland-v1')||'{}');o.sound=soundOn;localStorage.setItem('hangul-starland-v1',JSON.stringify(o))}catch(e){}if(!soundOn&&'speechSynthesis'in window)speechSynthesis.cancel()};
const block=c=>'<span class="tiny '+c+'" title="'+names[c]+'"></span>';
function open(k){kind=k;level=0;score=0;stack=[];document.body.classList.add('playing');$('play').classList.add('active');render()}
function home(){document.body.classList.remove('playing');$('play').classList.remove('active');$('message').textContent=''}
function render(){locked=false;stack=[];$('next').classList.add('hidden');$('message').textContent='';$('count').textContent=(level+1)+' / 5';$('score').textContent='⭐ '+score;$('tower-stage').classList.toggle('hidden',kind!=='tower');$('bridge-stage').classList.toggle('hidden',kind!=='bridge');
 if(kind==='tower'){$('title').textContent='색깔 블록 탑 만들기';$('guide').textContent='아래부터 그림과 같은 순서로 쌓아 봐요!';$('preview').innerHTML=towerLevels[level].map(block).join('');$('palette').innerHTML=colors.map(c=>'<button data-color="'+c+'" aria-label="'+names[c]+' 블록 쌓기">'+block(c)+names[c]+'</button>').join('');}
 else{$('title').textContent='자동차를 위한 튼튼한 다리';$('guide').textContent=bridgeLevels[level]+'개의 받침 블록을 넣고 마지막으로 길을 연결해 봐요!';$('preview').textContent='🚗  🧱 + 🧱 → 🌉';$('palette').innerHTML='<button data-part="support">🧱 받침 넣기</button><button data-part="beam">🟨 길 연결하기</button><button data-part="reset">↻ 다시 만들기</button>';}
 paint();
}
function paint(){
 if(kind==='tower'){$('tower').innerHTML=stack.map(c=>'<div class="block '+c+'"></div>').join('');}
 else{const count=stack.filter(x=>x==='support').length,beam=stack.includes('beam');$('left-support').textContent=count>=1?'🧱':'';$('right-support').textContent=count>=2?'🧱':'';$('middle-support').textContent=count>=3?'🧱':'';$('beam').className=beam?'beam':'';$('beam').innerHTML=beam?'<span class="car">🚗</span>':'';}
}
function success(){if(locked)return;locked=true;score++;$('score').textContent='⭐ '+score;$('message').textContent='🌟 야호! 쪼이가 정말 기뻐해요!';$('next').classList.remove('hidden');say('우와! 이현이 정말 잘했어요!')}
function putColor(c){if(locked)return;const wanted=towerLevels[level],at=stack.length;if(at>=wanted.length)return;if(c!==wanted[at]){$('message').textContent='💛 '+names[wanted[at]]+' 블록부터 쌓아 보자!';say(names[wanted[at]]+' 블록을 찾아볼까?');return;}stack.push(c);paint();$('message').textContent='좋아! '+(stack.length===wanted.length?'완성!':'다음 블록도 쌓아 봐요');if(stack.length===wanted.length)success()}
function putPart(p){if(locked)return;if(p==='reset'){stack=[];paint();return;}const need=bridgeLevels[level];let supports=stack.filter(x=>x==='support').length;if(p==='support'){if(stack.includes('beam')||supports>=need){$('message').textContent='받침은 충분해요!';return;}stack.push(p);paint();$('message').textContent='받침 '+(supports+1)+' / '+need;return;}
 if(p==='beam'){if(supports<need){$('message').textContent='받침 '+need+'개를 먼저 쌓아요!';say('받침을 먼저 넣어 볼까?');return;}stack.push('beam');paint();success();}}
$('menu').onclick=e=>{const b=e.target.closest('[data-game]');if(b)open(b.dataset.game)};$('palette').onclick=e=>{const c=e.target.closest('[data-color]'),p=e.target.closest('[data-part]');if(c)putColor(c.dataset.color);if(p)putPart(p.dataset.part)};$('undo').onclick=()=>{if(locked)return;stack.pop();paint();$('message').textContent='다시 해보자!'};$('reset').onclick=()=>{locked=false;stack=[];paint();$('message').textContent='처음부터 다시!'};$('back').onclick=home;$('next').onclick=()=>{if(level===4){say('다섯 단계 모두 성공! 멋지게 완성했어!');home();}else{level++;render()}};window.addEventListener('pagehide',()=>{try{speechSynthesis.cancel()}catch(e){}});const testGame=new URLSearchParams(location.search).get('game');if(testGame==='tower'||testGame==='bridge')open(testGame);})();
</script></body></html>
