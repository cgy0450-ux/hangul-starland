<!doctype html><html lang="ko"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/><meta name="theme-color" content="#7f5bd5"/><title>쪼이랜드 동화책</title>
<style>
:root{font-family:"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;color:#403064;background:#f1edff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 10%,#fffcd6,transparent 33%),radial-gradient(circle at 80% 60%,#d8f8ff,transparent 40%),#f1edff;min-height:100dvh}button,a{font:inherit;touch-action:manipulation}button{cursor:pointer;border:0}header{display:flex;align-items:center;gap:12px;padding:12px 16px;max-width:1000px;margin:auto}header a{color:#6b4ab2;text-decoration:none;font-weight:900;background:#fff;border-radius:18px;padding:12px 14px;box-shadow:0 4px 0 #decdfb}header strong{font-size:clamp(21px,5vw,32px);color:#653cae}.sound{margin-left:auto;border-radius:18px;padding:11px 14px;background:#fff9d7;color:#775a21;font-weight:900}main{max-width:970px;margin:0 auto;padding:6px 16px 30px}h1{margin:8px 0;font-size:clamp(24px,5.5vw,39px)}.desc{font-size:14px;color:#6d6587;margin:4px 0 16px;font-weight:700}.shelf{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.booktile{border:5px solid white;box-shadow:0 9px 0 #d6c6ef,0 12px 20px #6a5ca022;border-radius:28px;padding:20px 8px 18px;background:var(--bg);color:#392f6a;min-height:175px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px}.booktile .pic{font-size:clamp(47px,13vw,82px);filter:drop-shadow(0 4px 1px #b9abbd33)}.booktile strong{font-size:clamp(17px,3vw,23px);letter-spacing:-.5px}.booktile small{color:#6b6287;font-weight:800}.reader{display:none}.reader.active{display:block}.shelf.hidden,.intro.hidden{display:none}.paper{height:min(74dvh,690px);min-height:425px;border:9px solid white;border-radius:34px;box-shadow:0 10px 0 #ddcdea,0 17px 35px #7961a82a;background:linear-gradient(160deg,var(--page),#fffdf5);padding:clamp(13px,3vw,28px);display:flex;flex-direction:column;position:relative;overflow:hidden}.paper:before{content:'✦';position:absolute;right:24px;top:11px;font-size:38px;color:#ffdf6a}.paper h2{margin:8px 0;font-size:clamp(22px,5vw,34px);text-align:center}.scene{flex:1;display:flex;align-items:center;justify-content:center;gap:10px;min-height:130px;font-size:clamp(58px,17vw,132px);background:radial-gradient(ellipse at 50% 80%,#9de8b955,transparent 65%);border-radius:28px;white-space:nowrap}.scene span{animation:bob 3s ease-in-out infinite}.scene span:nth-child(2){animation-delay:.5s}.scene span:nth-child(3){animation-delay:1s}@keyframes bob{50%{transform:translateY(-10px)}}.storytext{font-size:clamp(19px,4.5vw,29px);line-height:1.65;font-weight:900;text-align:center;color:#463a72;margin:14px auto;max-width:630px;min-height:75px;word-break:keep-all}.bookcontrol{display:flex;gap:8px;justify-content:center;align-items:center;margin-top:auto}.bookcontrol button{flex:1;min-height:50px;border-radius:17px;background:#fff;color:#5f4aa0;font-size:17px;font-weight:900;box-shadow:0 4px 0 #d6c7ed}.bookcontrol .speak{background:#ffc247;color:#744c13;box-shadow:0 4px 0 #df912d}.bookcontrol .next{background:#5fcbb6;color:#fff;box-shadow:0 4px 0 #359b87}.progress{display:flex;justify-content:center;gap:9px;margin:12px 0}.dot{width:13px;height:13px;background:#d8caec;border-radius:50%}.dot.on{background:#ffb942;transform:scale(1.2)}.back{margin:0 0 10px;padding:12px 17px;border-radius:15px;background:#fff;font-weight:900;color:#7751a8}.tiny{font-size:12px;text-align:center;color:#77708d;margin:14px}@media(min-width:720px){.shelf{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-height:650px){.paper{height:calc(100dvh - 102px);min-height:360px}.paper h2{margin:1px}.scene{font-size:clamp(50px,12vh,100px)}.storytext{font-size:17px;margin:5px}.bookcontrol button{min-height:44px}}

.illustration{min-height:145px;overflow:hidden;position:relative;padding:0;background:linear-gradient(160deg,#ecf9ff,#f4ffe9)}
.illustration svg{width:100%;height:100%;max-height:330px;display:block;filter:drop-shadow(0 5px 5px #b3a4d127)}
.illustration .scene-char{transform-box:fill-box;transform-origin:center;animation:bob 4s ease-in-out infinite}
.illustration .scene-char:nth-of-type(2){animation-delay:.65s}
.pagecount{font-size:13px;color:#8864ba;text-align:center;padding-bottom:3px}
.storytext{font-size:clamp(18px,3.75vw,25px);line-height:1.5;max-width:700px;min-height:93px;margin:8px auto 11px}
.paper{height:min(80dvh,750px)}
.paper h2{font-size:clamp(19px,4.5vw,30px);margin:3px 0 8px}
.progress{gap:5px;margin:9px 0}.dot{width:10px;height:10px}
@media(max-height:680px){.illustration{min-height:100px}.illustration svg{max-height:175px}.paper{height:calc(100dvh - 92px);min-height:350px;padding:9px}.storytext{font-size:16px;line-height:1.4;min-height:64px}.bookcontrol button{min-height:40px}}
html:has(.reader.active),body:has(.reader.active){height:100%;overflow:hidden!important;overscroll-behavior:none}body:has(.reader.active){height:100dvh;display:flex;flex-direction:column}body:has(.reader.active) header{flex:none;padding:6px 10px}body:has(.reader.active) main{height:calc(100dvh - 59px);flex:1;min-height:0;overflow:hidden;padding:4px 9px;display:flex;flex-direction:column}body:has(.reader.active) .reader.active{flex:1;min-height:0;display:flex;flex-direction:column}body:has(.reader.active) .paper{flex:1;height:auto;max-height:calc(100dvh - 87px);min-height:0;padding:8px;border-width:6px}body:has(.reader.active) .illustration{min-height:65px}body:has(.reader.active) .illustration svg{max-height:28dvh}body:has(.reader.active) .storytext{font-size:clamp(15px,3.2vw,21px);line-height:1.4;min-height:0}body:has(.reader.active) .paper h2{font-size:clamp(18px,4vw,28px);margin:2px 0}</style></head><body><header><a href="./index.html?subject=hangul">⌂ 한글 홈</a><strong>📖 쪼이의 동화책</strong><button class="sound" id="audio-switch" aria-label="책 읽는 소리 끄기">🔊 읽기 켬</button></header><main><div class="intro" id="intro"><h1>오늘은 어떤 이야기를 들을까?</h1><p class="desc">10장으로 된 이야기 20편! 쪼이가 책장을 넘길 때마다 읽어줘요.</p></div><div class="shelf" id="shelf"></div><div class="reader" id="reader"><button class="back" id="back">‹ 책장으로</button><div class="paper" id="paper"><h2 id="booktitle"></h2><div class="scene illustration" id="scene" aria-hidden="true"></div><p class="storytext" id="storytext"></p><div class="progress" id="progress"></div><div class="pagecount" id="pagecount"></div><div class="bookcontrol"><button id="prev">◀ 이전</button><button class="speak" id="speak">🔊 읽어줘</button><button class="next" id="next">다음 ▶</button></div></div></div><p class="tiny">모든 동화는 어린이를 위해 새롭게 쓴 이야기입니다. 목소리는 기기의 한국어 음성을 사용해요.</p></main>
<script src="./stories-data.js"></script><script>
const BOOKS=window.JOY_STORIES||[];
let current=-1,page=0,utterance=null,soundOn=(()=>{try{return JSON.parse(localStorage.getItem("hangul-starland-v1")||"{}").sound!==false;}catch(e){return true;}})();
const shelf=document.getElementById('shelf'),reader=document.getElementById('reader');
function stop(){if('speechSynthesis'in window)window.speechSynthesis.cancel();}
function speak(){stop();if(!soundOn||!('speechSynthesis'in window))return;const text=BOOKS[current].pages[page].text;const u=new SpeechSynthesisUtterance(text);u.lang='ko-KR';u.rate=.91;u.pitch=1.04;const voices=speechSynthesis.getVoices().filter(v=>v.lang.toLowerCase().startsWith('ko'));u.voice=voices.find(v=>/natural|neural|enhanced|premium|google/i.test(v.name))||voices[0]||null;utterance=u;speechSynthesis.speak(u);}

function scenePicture(book,idx){const theme=book.setting;const s=book.icons||["🐯","🌼","✨"];const c1=s[idx%s.length]||"🐯",c2=s[(idx+2)%s.length]||"🐰",c3=s[(idx+4)%s.length]||"⭐";
const water=theme==="pond"||theme==="sky";const hill=theme==="mountain";
const scenery=theme==="village"?
'<path d="M0 164 Q80 130 160 169 T360 167 L360 240 H0" fill="#8cdb91"/><path d="M16 138 L75 81 L135 138 Z" fill="#f29a84"/><rect x="35" y="137" width="82" height="70" rx="6" fill="#ffe2a5"/><rect x="68" y="165" width="20" height="42" rx="2" fill="#b58573"/><path d="M255 124 L304 87 L356 126 Z" fill="#a5a2e9"/><rect x="269" y="125" width="71" height="64" fill="#fff1d1"/>' :
hill?'<path d="M0 158 L86 67 L148 139 L232 43 L360 167 V240 H0" fill="#b7cbfa"/><path d="M60 98 L86 67 L107 93 M202 79 L232 43 L256 77" fill="#fff" stroke="#fff" stroke-width="12"/><path d="M0 194 Q100 157 188 194 T360 194 V240 H0" fill="#8bd0a0"/>' :
'<path d="M0 163 Q70 130 145 164 Q225 128 360 162 V240 H0" fill="#9be6ad"/><path d="M0 203 Q140 168 260 198 T360 203 V240 H0" fill="#70cdb3"/><path d="M48 171 V88" stroke="#916451" stroke-width="16"/><circle cx="48" cy="83" r="41" fill="#7bd690"/><circle cx="20" cy="93" r="26" fill="#9ae9a0"/><circle cx="77" cy="91" r="26" fill="#a5eaa0"/>';
return '<svg viewBox="0 0 360 240" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="동화 장면"><defs><linearGradient id="sky" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#9fdbff"/><stop offset="1" stop-color="#e5faff"/></linearGradient><linearGradient id="floor" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#a0e6a9"/><stop offset="1" stop-color="#69cb98"/></linearGradient></defs><rect width="360" height="240" rx="24" fill="url(#sky)"/><circle cx="'+(285-idx%4*18)+'" cy="48" r="25" fill="#ffe48c" stroke="#fff3b8" stroke-width="6"/><g fill="#fff" opacity=".9"><ellipse cx="91" cy="44" rx="36" ry="16"/><ellipse cx="119" cy="44" rx="25" ry="12"/><ellipse cx="249" cy="75" rx="37" ry="14"/></g>'+scenery+(water?'<path d="M0 211 Q60 196 130 215 Q210 196 288 214 Q331 199 360 211 V240 H0" fill="#87d9f9" opacity=".75"/>':'')+'<ellipse cx="171" cy="219" rx="115" ry="12" fill="#73ad85" opacity=".3"/><g class="scene-char"><text x="'+(68+idx%4*12)+'" y="181" font-size="85" text-anchor="middle">'+c1+'</text></g><g class="scene-char"><text x="245" y="'+(183-idx%3*7)+'" font-size="78" text-anchor="middle">'+c2+'</text></g><text x="179" y="81" text-anchor="middle" font-size="34">'+c3+'</text><g fill="#fff0a7"><circle cx="24" cy="222" r="6"/><circle cx="329" cy="209" r="7"/><circle cx="304" cy="229" r="4"/></g></svg>';}

function open(i){current=i;page=0;shelf.classList.add('hidden');document.getElementById('intro').classList.add('hidden');reader.classList.add('active');render(true);}
function render(auto){const b=BOOKS[current],p=b.pages[page];document.getElementById('paper').style.setProperty('--page',b.color);document.getElementById('booktitle').textContent=b.title;document.getElementById('scene').innerHTML=scenePicture(b,page);document.getElementById('storytext').textContent=p.text;document.getElementById('progress').innerHTML=b.pages.map((_,i)=>'<span class="dot '+(i===page?'on':'')+'"></span>').join('');document.getElementById('pagecount').textContent=(page+1)+' / '+b.pages.length+'장';document.getElementById('prev').disabled=page===0;document.getElementById('next').textContent=page===b.pages.length-1?'끝! 🎉':'다음 ▶';stop();if(auto)speak();}
function flip(n){if(current<0)return;const next=page+n;if(next<0)return;if(next>=BOOKS[current].pages.length){goBack();return;}page=next;render(true);}
function goBack(){stop();current=-1;reader.classList.remove('active');shelf.classList.remove('hidden');document.getElementById('intro').classList.remove('hidden');}
shelf.innerHTML=BOOKS.map((b,i)=>'<button class="booktile" data-book="'+i+'" style="--bg:'+b.color+'"><span class="pic">'+b.emoji+'</span><strong>'+b.title+'</strong><small>읽어 주는 그림 동화</small></button>').join('');
shelf.addEventListener('click',e=>{const t=e.target.closest('[data-book]');if(t)open(Number(t.dataset.book));});
document.getElementById('back').onclick=goBack;document.getElementById('prev').onclick=()=>flip(-1);document.getElementById('next').onclick=()=>flip(1);document.getElementById('speak').onclick=speak;
const audio=document.getElementById('audio-switch');function updateAudioLabel(){audio.textContent=soundOn?'🔊 읽기 켬':'🔇 읽기 끔';audio.setAttribute('aria-label',soundOn?'책 읽는 소리 끄기':'책 읽는 소리 켜기');}updateAudioLabel();audio.onclick=()=>{soundOn=!soundOn;try{const st=JSON.parse(localStorage.getItem('hangul-starland-v1')||'{}');st.sound=soundOn;localStorage.setItem('hangul-starland-v1',JSON.stringify(st));}catch(e){}updateAudioLabel();if(!soundOn)stop();else if(current>=0)speak();};
window.addEventListener('pagehide',stop);
</script></body></html>
