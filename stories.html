<style>
:root{font-family:"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;color:#403064;background:#f1edff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 10%,#fffcd6,transparent 33%),radial-gradient(circle at 80% 60%,#d8f8ff,transparent 40%),#f1edff;min-height:100dvh}button,a{font:inherit;touch-action:manipulation}button{cursor:pointer;border:0}header{display:flex;align-items:center;gap:12px;padding:12px 16px;max-width:1000px;margin:auto}header a{color:#6b4ab2;text-decoration:none;font-weight:900;background:#fff;border-radius:18px;padding:12px 14px;box-shadow:0 4px 0 #decdfb}header strong{font-size:clamp(21px,5vw,32px);color:#653cae}.sound{margin-left:auto;border-radius:18px;padding:11px 14px;background:#fff9d7;color:#775a21;font-weight:900}main{max-width:970px;margin:0 auto;padding:6px 16px 30px}h1{margin:8px 0;font-size:clamp(24px,5.5vw,39px)}.desc{font-size:14px;color:#6d6587;margin:4px 0 16px;font-weight:700}.shelf{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.booktile{border:5px solid white;box-shadow:0 9px 0 #d6c6ef,0 12px 20px #6a5ca022;border-radius:28px;padding:20px 8px 18px;background:var(--bg);color:#392f6a;min-height:175px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px}.booktile .pic{font-size:clamp(47px,13vw,82px);filter:drop-shadow(0 4px 1px #b9abbd33)}.booktile strong{font-size:clamp(17px,3vw,23px);letter-spacing:-.5px}.booktile small{color:#6b6287;font-weight:800}.reader{display:none}.reader.active{display:block}.shelf.hidden,.intro.hidden{display:none}.paper{height:min(74dvh,690px);min-height:425px;border:9px solid white;border-radius:34px;box-shadow:0 10px 0 #ddcdea,0 17px 35px #7961a82a;background:linear-gradient(160deg,var(--page),#fffdf5);padding:clamp(13px,3vw,28px);display:flex;flex-direction:column;position:relative;overflow:hidden}.paper:before{content:'✦';position:absolute;right:24px;top:11px;font-size:38px;color:#ffdf6a}.paper h2{margin:8px 0;font-size:clamp(22px,5vw,34px);text-align:center}.scene{flex:1;display:flex;align-items:center;justify-content:center;gap:10px;min-height:130px;font-size:clamp(58px,17vw,132px);background:radial-gradient(ellipse at 50% 80%,#9de8b955,transparent 65%);border-radius:28px;white-space:nowrap}.scene span{animation:bob 3s ease-in-out infinite}.scene span:nth-child(2){animation-delay:.5s}.scene span:nth-child(3){animation-delay:1s}@keyframes bob{50%{transform:translateY(-10px)}}.storytext{font-size:clamp(19px,4.5vw,29px);line-height:1.65;font-weight:900;text-align:center;color:#463a72;margin:14px auto;max-width:630px;min-height:75px;word-break:keep-all}.bookcontrol{display:flex;gap:8px;justify-content:center;align-items:center;margin-top:auto}.bookcontrol button{flex:1;min-height:50px;border-radius:17px;background:#fff;color:#5f4aa0;font-size:17px;font-weight:900;box-shadow:0 4px 0 #d6c7ed}.bookcontrol .speak{background:#ffc247;color:#744c13;box-shadow:0 4px 0 #df912d}.bookcontrol .next{background:#5fcbb6;color:#fff;box-shadow:0 4px 0 #359b87}.progress{display:flex;justify-content:center;gap:9px;margin:12px 0}.dot{width:13px;height:13px;background:#d8caec;border-radius:50%}.dot.on{background:#ffb942;transform:scale(1.2)}.back{margin:0 0 10px;padding:12px 17px;border-radius:15px;background:#fff;font-weight:900;color:#7751a8}.tiny{font-size:12px;text-align:center;color:#77708d;margin:14px}@media(min-width:720px){.shelf{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-height:650px){.paper{height:calc(100dvh - 102px);min-height:360px}.paper h2{margin:1px}.scene{font-size:clamp(50px,12vh,100px)}.storytext{font-size:17px;margin:5px}.bookcontrol button{min-height:44px}}

.illustration{min-height:145px;overflow:hidden;position:relative;padding:0;background:linear-gradient(160deg,#ecf9ff,#f4ffe9)}
.illustration svg{width:100%;height:100%;max-height:330px;display:block;filter:drop-shadow(0 5px 5px #b3a4d127)}
.illustration .scene-char{transform-box:fill-box;transform-origin:center;animation:bob 4s ease-in-out infinite}
.illustration .scene-char:nth-of-type(2){animation-delay:.65s}
.pagecount{font-size:13px;color:#8864ba;text-align:center;padding-bottom:3px}
.storytext{font-size:clamp(18px,3.75vw,25px);line-height:1.5;max-width:700px;min-height:93px;margin:8px auto 11px}
.paper{height:min(80dvh,750px)}
.paper h2{font-size:clamp(19px,4.5vw,30px);margin:3px 0 8px}
.progress{gap:5px;margin:9px 0}.dot{width:10px;height:10px}
@media(max-height:680px){.illustration{min-height:100px}.illustration svg{max-height:175px}.paper{height:calc(100dvh - 92px);min-height:350px;padding:9px}.storytext{font-size:16px;line-height:1.4;min-height:64px}.bookcontrol button{min-height:40px}}
html:has(.reader.active),body:has(.reader.active){height:100%;overflow:hidden!important;overscroll-behavior:none}body:has(.reader.active){height:100dvh;display:flex;flex-direction:column}body:has(.reader.active) header{flex:none;padding:6px 10px}body:has(.reader.active) main{height:calc(100dvh - 59px);flex:1;min-height:0;overflow:hidden;padding:4px 9px;display:flex;flex-direction:column}body:has(.reader.active) .reader.active{flex:1;min-height:0;display:flex;flex-direction:column}body:has(.reader.active) .paper{flex:1;height:auto;max-height:calc(100dvh - 87px);min-height:0;padding:8px;border-width:6px}body:has(.reader.active) .illustration{min-height:65px}body:has(.reader.active) .illustration svg{max-height:28dvh}body:has(.reader.active) .storytext{font-size:clamp(15px,3.2vw,21px);line-height:1.4;min-height:0}body:has(.reader.active) .paper h2{font-size:clamp(18px,4vw,28px);margin:2px 0}</style><link rel="stylesheet" href="./joiland-theme-v11.css"><link rel="stylesheet" href="./joiland-v13.css?v=13.1-playability"></head><body><header><a href="./index.html?subject=hangul">⌂ 한글 홈</a><strong>📖 쪼이의 동화책</strong><button class="sound" id="audio-switch" aria-label="책 읽는 소리 끄기">🔊 읽기 켬</button></header><main><div class="intro" id="intro"><h1>함께 여는 이야기 숲</h1><p class="desc">스무 편의 이야기, 저마다 다른 모험.<br>그림을 보고, 귀 기울이고, 함께 이야기해요.</p></div><p><a class="back" href="./family-stories.html">우리집 동화 열기</a></p><div class="shelf" id="shelf"></div><div class="reader" id="reader"><button class="back" id="back">‹ 책장으로</button><div class="paper" id="paper"><h2 id="booktitle"></h2><div class="scene illustration" id="scene"></div><p class="storytext" id="storytext"></p><div class="story-options"><label><input id="autoTurn" type="checkbox" checked> 다 들으면 다음 장으로</label><span id="voiceNotice" role="status"></span></div><div class="progress" id="progress"></div><div class="pagecount" id="pagecount"></div><div class="bookcontrol"><button id="prev">◀ 이전</button><button class="speak" id="speak">🔊 읽어줘</button><button id="pauseVoice" disabled>잠깐 멈춤</button><button class="next" id="next">다음 장</button></div></div><section id="comprehension" class="comprehension" hidden aria-label="이야기 이해 활동"></section></div><p class="tiny">옛이야기는 어린이를 위해 새롭게 각색했어요. 동화는 미리 제작한 무료 AI 음원으로 읽어요. 기기 음성도 선택할 수 있어요.</p></main>
<script src="./stories-data.js"></script><script>
const BOOKS=window.JOY_STORIES||[];
let current=-1,page=0,utterance=null,voiceToken=0,speaking=false,paused=false;
let soundOn=(()=>{try{return JSON.parse(localStorage.getItem('hangul-starland-v1')||'{}').sound!==false}catch(e){return true}})();
const $=id=>document.getElementById(id),shelf=$('shelf'),reader=$('reader');
try{$('autoTurn').checked=localStorage.getItem('joyi-stories-auto-next')!=='false'}catch(e){}
$('autoTurn').onchange=()=>{try{localStorage.setItem('joyi-stories-auto-next',String($('autoTurn').checked))}catch(e){}};
function voiceState(){
 $('pauseVoice').disabled=!speaking;$('pauseVoice').textContent=paused?'이어 듣기':'잠깐 멈춤';$('pauseVoice').setAttribute('aria-pressed',String(paused));
 $('paper').classList.toggle('narrating',speaking&&!paused);
}
function stop(){voiceToken++;if('speechSynthesis'in window)speechSynthesis.cancel();speaking=false;paused=false;utterance=null;voiceState()}
function speak(){
 stop();if(!soundOn||current<0||!('speechSynthesis'in window))return;
 const token=voiceToken,story=current,storyPage=page,u=new SpeechSynthesisUtterance(BOOKS[current].pages[page].text);
 u.lang='ko-KR';u.rate=.88;u.pitch=1.02;const voices=speechSynthesis.getVoices().filter(v=>v.lang.toLowerCase().startsWith('ko'));
 let preferred='';try{preferred=localStorage.getItem('joiland-voice-name')||''}catch(e){}
 u.voice=voices.find(v=>v.name===preferred)||voices.find(v=>/natural|neural|enhanced|premium|google/i.test(v.name))||voices[0]||null;
 u.onstart=()=>{if(token===voiceToken){speaking=true;voiceState()}};
 u.onend=()=>{if(token!==voiceToken)return;speaking=false;paused=false;voiceState();if($('autoTurn').checked&&current===story&&page===storyPage){setTimeout(()=>{if(token===voiceToken&&current===story&&page===storyPage)flip(1)},900)}};
 u.onerror=()=>{if(token===voiceToken){speaking=false;paused=false;voiceState();$('voiceNotice').textContent='이 기기에서 읽어주기를 시작하지 못했어요. 글을 함께 읽어 주세요.'}};
 utterance=u;try{speechSynthesis.speak(u)}catch(e){$('voiceNotice').textContent='기기의 한국어 음성을 사용할 수 없어요.'}
}
function scenePicture(book,idx){const img=new Image();img.src=book.pages[idx].art;img.alt=book.pages[idx].alt;img.width=768;img.height=512;img.decoding='async';return img}
function open(i){stop();current=i;page=0;shelf.classList.add('hidden');$('intro').classList.add('hidden');reader.classList.add('active');$('comprehension').hidden=true;$('paper').hidden=false;render(true)}
function render(auto){
 const b=BOOKS[current],p=b.pages[page];$('paper').style.setProperty('--page',b.color);$('booktitle').textContent=b.title;$('scene').replaceChildren(scenePicture(b,page));$('storytext').textContent=p.text;
 $('progress').replaceChildren(...b.pages.map((_,i)=>{const dot=document.createElement('span');dot.className='dot '+(i===page?'on':'');return dot}));
 $('pagecount').textContent=(page+1)+' / '+b.pages.length+'장';$('prev').disabled=page===0;$('next').textContent=page===b.pages.length-1?'함께 이야기하기':'다음 장';
 $('voiceNotice').textContent='';stop();if(auto)speak();
 if(page+1<b.pages.length){const preload=new Image();preload.src=b.pages[page+1].art}
}
function discuss(){
 stop();$('paper').hidden=true;const panel=$('comprehension');panel.hidden=false;panel.replaceChildren();
 const q=BOOKS[current].question,h=document.createElement('h2');h.textContent='이야기를 나눠요';const prompt=document.createElement('p');prompt.textContent=q.prompt;panel.append(h,prompt);
 const feedback=document.createElement('p');feedback.setAttribute('role','status');feedback.className='story-feedback';
 q.choices.forEach((text,i)=>{const choice=document.createElement('button');choice.className='story-choice';choice.textContent=text;choice.onclick=()=>{if(i===q.answer){feedback.textContent=q.explanation;choice.classList.add('correct')}else{feedback.textContent='다시 생각해 볼까요? 이야기 속 장면을 떠올려 봐요.';choice.classList.add('try-again')}};panel.append(choice)});
 panel.append(feedback);const replay=document.createElement('button');replay.textContent='처음부터 다시 읽기';replay.className='story-replay';replay.onclick=()=>open(current);panel.append(replay);const back=document.createElement('button');back.textContent='다른 이야기 고르기';back.onclick=goBack;panel.append(back)
}
function flip(n){if(current<0)return;const next=page+n;if(next<0)return;if(next>=BOOKS[current].pages.length){discuss();return}page=next;render(true)}
function goBack(){stop();current=-1;reader.classList.remove('active');shelf.classList.remove('hidden');$('intro').classList.remove('hidden');$('comprehension').hidden=true;$('paper').hidden=false}
shelf.replaceChildren(...BOOKS.map((b,i)=>{const button=document.createElement('button');button.className='booktile';button.dataset.book=i;button.style.setProperty('--bg',b.color);const image=new Image();image.src=b.cover;image.alt='';image.loading='lazy';image.width=768;image.height=512;const copy=document.createElement('span');copy.className='book-copy';const small=document.createElement('small');small.textContent=String(i+1).padStart(2,'0')+' · 10장 이야기';const title=document.createElement('strong');title.textContent=b.title;copy.append(small,title);button.append(image,copy);return button}));
shelf.onclick=e=>{const t=e.target.closest('[data-book]');if(t)open(Number(t.dataset.book))};
$('back').onclick=goBack;$('prev').onclick=()=>flip(-1);$('next').onclick=()=>flip(1);$('speak').onclick=speak;
$('pauseVoice').onclick=()=>{if(!speaking)return;paused=!paused;if(paused)speechSynthesis.pause();else speechSynthesis.resume();voiceState()};
const audio=$('audio-switch');function updateAudioLabel(){audio.textContent=soundOn?'읽기 켬':'읽기 끔';audio.setAttribute('aria-label',soundOn?'책 읽는 소리 끄기':'책 읽는 소리 켜기')}updateAudioLabel();audio.onclick=()=>{soundOn=!soundOn;try{const st=JSON.parse(localStorage.getItem('hangul-starland-v1')||'{}');st.sound=soundOn;localStorage.setItem('hangul-starland-v1',JSON.stringify(st))}catch(e){}updateAudioLabel();if(!soundOn)stop();else if(current>=0&&!$('paper').hidden)speak()};
window.addEventListener('pagehide',stop);document.addEventListener('visibilitychange',()=>{if(document.hidden)stop()});voiceState();
</script><script src="./joiland-unified.js"></script></body></html>
