<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#7757d2"><title>쪼이랜드 블록 코딩</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100dvh;font-family:"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;color:#392e6e;background:radial-gradient(circle at 10% 10%,#fff2ba,transparent 44%),radial-gradient(circle at 84% 85%,#d3fff2,transparent 43%),#f1edff;font-weight:850}button{border:0;font:inherit;cursor:pointer;touch-action:manipulation}header{padding:8px 12px;max-width:720px;margin:auto;display:flex;align-items:center;gap:10px}header a{text-decoration:none;color:#6e53ae;font-weight:900;background:#fff;padding:10px;border-radius:15px}h1{margin:0;font-size:clamp(19px,4.2vw,27px)}main{max-width:690px;margin:auto;padding:4px 12px 24px}.intro{text-align:center;background:linear-gradient(115deg,#fff1be,#deedff,#dcffdc);padding:13px;border:5px solid white;border-radius:26px;margin:4px 0 10px}.intro h2{margin:3px 0;font-size:clamp(21px,4vw,28px)}.intro p{margin:3px;color:#6e608b;font-size:14px}.game{background:white;border:6px solid white;border-radius:29px;box-shadow:0 8px 0 #d2c3ea;padding:14px;display:flex;align-items:center;flex-direction:column;gap:12px}.top{display:flex;justify-content:space-between;width:100%;align-items:center}.top b{color:#6a46ad}.grid{width:min(72vw,330px,43dvh);height:min(72vw,330px,43dvh);min-width:212px;min-height:212px;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr);gap:5px;background:#dce3fb;padding:5px;border-radius:23px;box-shadow:0 6px 0 #b6a9d5}.cell{border-radius:14px;background:linear-gradient(135deg,#e8f9ff,#f0ffe9);display:flex;align-items:center;justify-content:center;font-size:clamp(26px,6vw,47px);transition:background .2s}.cell.rock{background:#f9e8dd}.cell.goal{background:#fff0b6}.cell.here{background:#fffae0;box-shadow:inset 0 0 0 4px #ffc76e}.route{background:#f7f1ff;border-radius:19px;min-height:58px;width:100%;display:flex;align-items:center;justify-content:center;gap:5px;padding:7px;flex-wrap:wrap}.block{background:#fff;box-shadow:0 4px 0 #d0b7ef;border-radius:12px;padding:8px 10px;font-size:23px}.arrows{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;width:100%}.arrows button{font-size:32px;background:#e6f3ff;border:3px solid #fff;border-radius:16px;padding:11px;box-shadow:0 5px 0 #a1cce7}.tools{display:flex;justify-content:center;gap:9px;width:100%}.tools button{background:#eee0ff;color:#603cb1;padding:12px;border-radius:16px;flex:1}.tools .run{background:#45c3a5;color:white;box-shadow:0 5px 0 #329f88}.msg{color:#6f5ca4;min-height:24px;text-align:center}.next{background:#ffcb62!important;color:#6d4c19!important}.hidden{display:none!important}@media(max-height:700px){.intro{padding:5px}.game{gap:7px;padding:8px}.grid{width:min(55dvh,72vw);height:min(55dvh,72vw)}.arrows button{padding:5px}.route{min-height:44px}}
</style></head><body><header><a href="./academy.html?subject=coding">⌂ 코딩 홈</a><h1>🤖 쪼이의 블록 코딩</h1></header><main><div class="intro"><h2>🐯 쪼이를 ⭐까지 보내줘!</h2><p>화살표 블록을 차례대로 누른 뒤 ▶ 실행해 보자.</p></div><section class="game"><div class="top"><strong id="level">1 / 8</strong><b id="steps">0개 블록</b></div><div class="grid" id="grid"></div><div class="route" id="route">여기에 명령 블록을 놓아 봐요 🧩</div><div class="arrows"><button data-dir="U">⬆️</button><button data-dir="D">⬇️</button><button data-dir="L">⬅️</button><button data-dir="R">➡️</button></div><div class="tools"><button id="undo">↶ 한 칸 취소</button><button id="clear">다 지우기</button><button id="run" class="run">▶ 실행!</button></div><div id="msg" class="msg">쪼이가 기다리고 있어요!</div><div class="tools"><button class="next hidden" id="next">다음 모험 ➜</button></div></section></main><script>
(function(){"use strict";
const L=[
{start:[0,3],goal:[2,3],walls:[]},
{start:[0,3],goal:[0,1],walls:[]},
{start:[0,2],goal:[2,1],walls:[]},
{start:[0,3],goal:[3,3],walls:[[2,3]]},
{start:[3,3],goal:[1,1],walls:[]},
{start:[0,3],goal:[3,0],walls:[[2,2],[1,0]]},
{start:[3,2],goal:[0,0],walls:[[1,2],[2,0]]},
{start:[0,0],goal:[3,3],walls:[[1,1],[2,2]]}
],dir={U:[0,-1],D:[0,1],L:[-1,0],R:[1,0]},icons={U:"⬆️",D:"⬇️",L:"⬅️",R:"➡️"};
let level=0,commands=[],at=[...L[0].start],busy=false,won=false;
const $=id=>document.getElementById(id);
function say(t){try{if(JSON.parse(localStorage.getItem("hangul-starland-v1")||"{}").sound===false)return;if(!("speechSynthesis"in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="ko-KR";u.rate=.9;speechSynthesis.speak(u)}catch(e){}}
function key(a){return a.join(",")}
function render(){const v=L[level];$("level").textContent=(level+1)+" / "+L.length;$("steps").textContent=commands.length+"개 블록";$("route").innerHTML=commands.length?commands.map((d,i)=>'<span class="block" title="'+(i+1)+'번째 명령">'+icons[d]+'</span>').join(""):"여기에 명령 블록을 놓아 봐요 🧩";$("grid").innerHTML=Array.from({length:16},(_,i)=>{const x=i%4,y=Math.floor(i/4),here=at[0]===x&&at[1]===y,goal=v.goal[0]===x&&v.goal[1]===y,rock=v.walls.some(w=>w[0]===x&&w[1]===y);return '<div class="cell '+(here?'here ':'')+(goal?'goal ':'')+(rock?'rock ':'')+'">'+(here?'🐯':goal?'⭐':rock?'🪨':(i+level)%7===0?'🌼':'')+'</div>';}).join("");$("next").classList.toggle("hidden",!won);}
function add(d){if(busy||won||commands.length>=12)return;commands.push(d);render();}
async function run(){if(busy||won)return;if(!commands.length){$("msg").textContent="화살표를 먼저 골라 봐요!";return;}busy=true;at=[...L[level].start];render();for(const d of commands){await new Promise(r=>setTimeout(r,420));const delta=dir[d],next=[at[0]+delta[0],at[1]+delta[1]];if(next.some(c=>c<0||c>3)||L[level].walls.some(w=>key(w)===key(next))){$("msg").textContent="앗! 바위나 가장자리에 막혔어. 블록을 바꿔 볼까?";say("다시 해볼까?");busy=false;return;}at=next;render();if(key(at)===key(L[level].goal))break;}busy=false;if(key(at)===key(L[level].goal)){won=true;$("msg").textContent="🎉 쪼이가 별에 도착했어요! 정말 잘했어!";say("우와! 성공했어요! 정말 잘했어!");try{const saved=JSON.parse(localStorage.getItem("joiland-coding-done")||"[]");if(!saved.includes(level)){saved.push(level);localStorage.setItem("joiland-coding-done",JSON.stringify(saved))}}catch(e){}render();}else{$("msg").textContent="별이 조금 더 멀리 있네. 화살표를 더 놓아 보자!";say("조금만 더 가볼까?");}}
function reset(){commands=[];at=[...L[level].start];busy=false;won=false;$("msg").textContent="화살표를 놓고 실행해 보자!";render()}
document.querySelectorAll("[data-dir]").forEach(b=>b.onclick=()=>add(b.dataset.dir));
$("undo").onclick=()=>{if(busy||won)return;commands.pop();render()};$("clear").onclick=reset;$("run").onclick=run;$("next").onclick=()=>{level=(level+1)%L.length;reset();};render();
})();
</script></body></html>
