/* Cohesive playroom theme with original tiger mascot and manipulatives. */
:root{--ink:#513278;--gold:#ffc856;--teal:#5ed4bd}
.hero{background:linear-gradient(132deg,var(--subject-bg,#fff6d4),#f6e6ff 68%,#defff6);border-radius:36px;box-shadow:0 10px 0 #e3bbd4,0 17px 30px #9675bb24}
.hero img{width:clamp(122px,27vw,200px);max-height:190px;object-fit:contain;filter:drop-shadow(0 10px 7px #8c629333)}
.module{background:linear-gradient(135deg,var(--subject-bg,#e6f8ff),#fff5f4);position:relative;overflow:hidden}
.module:before{content:"✦";font-size:26px;color:#ffffffbb;position:absolute;right:15px;top:31px;pointer-events:none}
.module .tile-grid{position:relative}
.tile{background:linear-gradient(140deg,#fff,#ffffffce);transition:transform .15s ease;box-shadow:0 5px 0 #d5bbda,0 8px 15px #9a77b627}
.tile .badge{background:linear-gradient(155deg,#ffeeb2,#d9efff);border:2px solid #fff}
.picture{background:radial-gradient(ellipse at 42% 35%,#fff6bf,#c5f1fa 69%,#c9f5d7);box-shadow:inset 0 0 0 3px #fff}
.picture:before{content:"✦  ✧  ✦";position:absolute;top:9px;left:9px;color:#fff;font-size:25px;letter-spacing:24px;pointer-events:none}
.picture img{right:3px;bottom:-10px;width:clamp(95px,22vw,172px);filter:drop-shadow(0 6px 3px #8c6f9d66)}
.paper{background:linear-gradient(170deg,#fffaf0,#fcf6ff 68%,#effff7)}
.choice-wrap{min-width:0;position:relative}.choice-wrap:last-child:nth-child(odd){grid-column:span 2}
.choice-wrap>.choice{width:100%;padding-right:40px;min-height:clamp(52px,10dvh,88px);font-size:clamp(15px,3.7vw,25px)}
.choice-hear{position:absolute;right:5px;top:50%;transform:translateY(-50%);width:35px;height:43px;border-radius:13px;background:#ffffffdd;border:2px solid #fff;box-shadow:0 3px 7px #7f6b9f30;font-size:16px}
.answer-title{font-size:clamp(18px,4.2vw,30px);line-height:1.4;max-height:20dvh;overflow:hidden}
.interaction{width:100%;display:flex;justify-content:center;align-items:center;min-height:60px}
.drop-target{border-radius:22px;border:4px dashed #9c78d7;background:linear-gradient(135deg,#fff0b9,#e4faff);color:#70489a;font-size:clamp(17px,4vw,24px);padding:clamp(10px,2vh,19px);text-align:center;width:min(100%,490px);font-weight:950}
.drop-target.selected{background:linear-gradient(135deg,#b5f3c9,#d8f8ff);border-color:#59be9a}
@media(max-height:735px){.hero img{max-height:140px}.picture img{width:clamp(75px,17vw,110px)}.interaction{min-height:48px}.drop-target{padding:8px}.choice-wrap>.choice{min-height:41px}.choice-hear{height:32px;width:29px;font-size:14px}.answer-title{max-height:14dvh;font-size:17px}}
@media(prefers-reduced-motion:reduce){.tile,.hero img{animation:none!important;transition:none!important}}

ctice hidden"><button id="recordVoice" type="button">🎙️ 내 목소리 녹음</button><button id="playVoice" type="button" class="hidden">▶️ 내 목소리 듣기</button><small>동의한 경우에만 기기에서 짧게 녹음·재생하고 저장·전송하지 않아요.</small></div><div id="explain" class="explain hidden"></div><div class="controls"><button id="hear">🔊 소리 듣기</button><button class="primary hidden" id="ready">이제 골라볼래요!</button><button id="repeat" class="primary hidden">🎤 따라 말했어요</button><button id="next" class="primary hidden">다음 문제 ➜</button></div></div></section><footer class="mini">💛 틀려도 괜찮아요. 다음에 다시 배우면 돼요.</footer></main><script src="./curriculum-v10.js"></script><script src="./learning-core-v10.js"></script><script src="./journey-app-v10.js"></script></body></html>
