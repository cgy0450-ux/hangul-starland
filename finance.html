const day=new Date().toLocaleDateString('en-CA'),seed=Number(day.replace(/-/g,''))||20261112;
function shuffled(arr,n=0){let a=arr.slice(),v=(seed+(n+1)*11939)>>>0;for(let i=a.length-1;i>0;i--){v=(Math.imul(v,1664525)+1013904223)>>>0;let j=v%(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}

function speak(str){if(!soundOn||!('speechSynthesis'in window))return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(str);u.lang='ko-KR';u.rate=.92;u.pitch=1.08;const voices=speechSynthesis.getVoices().filter(x=>x.lang.startsWith('ko'));u.voice=voices.find(x=>/natural|google|premium|enhanced/i.test(x.name))||voices[0]||null;speechSynthesis.speak(u)}catch(e){}}

function choose(i){cur=i;round=0;score=0;done=false;jarCount=0;saveCount=0;items=shuffled(games[i].items,i);$('hero').classList.add('hidden');$('tiles').classList.add('hidden');document.body.classList.add('playing');$('lesson').classList.add('active');render()}
function choices(correct,others){const all=shuffled([correct,...others],cur*20+round);return all.map((x,i)=>'<div class="answer-wrap"><button class="ans" data-answer="'+encodeURIComponent(x)+'" style="--a:'+['#e8f8ff','#fff2d0','#f4e8ff','#e5ffed'][i%4]+'">'+x+'</button><button class="speak-answer" data-hear="'+encodeURIComponent(x)+'" aria-label="선택지 소리 듣기">🔊</button></div>').join('')}
function advance(win,explain=''){if(done)return;done=true;if(win){score++;$('message').textContent='🌟 잘했어요! '+explain;speak('우와! 정말 잘했어! '+explain)}else{$('message').textContent='💛 '+explain;speak(explain)}$('points').textContent='⭐ '+score;$('next').classList.remove('hidden')}
function render(){done=false;saveCount=0;$('next').classList.add('hidden');$('message').textContent='';$('answers').classList.remove('hidden');$('interactive').classList.add('hidden');$('interactive').innerHTML='';$('counter').textContent=(round+1)+' / 5';$('points').textContent='⭐ '+score;const g=games[cur],q=items[round];let visual='',ask='',tip='소리를 듣고 골라 봐요',ans='';

 if(g.type==='shop'){const price=q[1],stock=Math.max(0,price+(round%2===0?-1:1));visual=q[0]+'  🪙'.repeat(stock);ask='동전 '+stock+'개가 있어요. '+q[0]+'은 '+price+'개예요. 살 수 있을까요?';ans=choices('살 수 있어요',['못 사요']);$('tip').textContent='장난감 동전으로 연습해요';}
 if(g.type==='save'){const goal=q;visual='🐷  🪙';ask='동전 '+goal+'개를 모아 봐요!';tip='저금통을 눌러 동전을 하나씩 넣어요';$('answers').classList.add('hidden');$('interactive').classList.remove('hidden');$('interactive').innerHTML='<button class="jar" id="addcoin" style="width:62%;max-width:300px;font-size:36px">🐷<span>🪙 넣기</span></button><div class="progress"><div id="bar" style="width:0%"></div></div><strong id="savings">0 / '+goal+'</strong>';setTimeout(()=>{const btn=$('addcoin');if(btn)btn.onclick=()=>{if(done)return;saveCount++;$('bar').style.width=Math.min(100,100*saveCount/goal)+'%';$('savings').textContent=saveCount+' / '+goal;if(saveCount>=goal)advance(true,'저금통을 다 채웠어요!')}},0);}
 if(g.type==='jars'){$('answers').classList.add('hidden');$('interactive').classList.remove('hidden');$('interactive').innerHTML='<div class="jarrow">'+[['🛒','쓰는 돈'],['🐷','저금할 돈'],['💝','나눌 돈']].map(x=>'<div class="jarwrap"><button class="jar" data-answer="'+encodeURIComponent(x[1])+'"><span>'+x[0]+'</span>'+x[1]+'</button><button class="speak-answer jar-hear" data-hear="'+encodeURIComponent(x[1])+'" aria-label="돈 항아리 이름 듣기">🔊</button></div>').join('')+'</div>';}
 $('visual').textContent=visual;$('ask').textContent=ask;$('tip').textContent=tip;$('answers').innerHTML=ans;speak(ask);
}
function answer(str){if(done)return;const g=games[cur],q=items[round];let good=false;
 if(g.type==='shop')good=(str===(Math.max(0,q[1]+(round%2===0?-1:1))>=q[1]?'살 수 있어요':'못 사요'));
 else good=str===q[2];
 if(good)advance(true,g.type==='jars'?'잘 골랐어요!':g.type==='shop'?'동전을 세어 봤구나!':'정답이에요!');
 else {$('message').textContent='💛 다시 생각해 볼까?';speak('다시 생각해 볼까?')}
}
$('tiles').onclick=e=>{const b=e.target.closest('[data-game]');if(b)choose(Number(b.dataset.game))};
$('answers').onclick=e=>{const hear=e.target.closest('[data-hear]');if(hear){speak(decodeURIComponent(hear.dataset.hear));return;}const b=e.target.closest('[data-answer]');if(b)answer(decodeURIComponent(b.dataset.answer))};$('interactive').onclick=e=>{const hear=e.target.closest('[data-hear]');if(hear){speak(decodeURIComponent(hear.dataset.hear));return;}const b=e.target.closest('[data-answer]');if(b)answer(decodeURIComponent(b.dataset.answer))};$('back').onclick=menu;$('listen').onclick=()=>speak(games[cur].type==='save'?'저금통을 눌러 동전을 모아요!':$('ask').textContent);$('next').onclick=()=>{if(round===4){$('message').textContent='🎉 오늘의 다섯 문제 끝!';speak('잘했어! 오늘도 멋지게 해냈어!');setTimeout(menu,950)}else{round++;render()}};window.addEventListener('pagehide',()=>{try{speechSynthesis.cancel()}catch(e){}});menu();const debugGame=Number(new URLSearchParams(location.search).get('game'));if(new URLSearchParams(location.search).has('game')&&Number.isInteger(debugGame)&&debugGame>=0&&debugGame<games.length)choose(debugGame);
})();
