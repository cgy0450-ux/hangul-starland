<!doctype html><html lang="ko"><head><script src="./voice-quality.js?v=13.3-voice"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#eaf2e4"><title>쪼이의 색칠공방</title><link rel="stylesheet" href="./coloring.css?v=13.2-coloring"></head><body>
<header class="paint-header"><nav><a href="./requests.html">‹ 놀이터</a><a href="./index.html">홈</a></nav><h1>쪼이의 색칠공방</h1><button id="sound" aria-label="소리 끄기">소리 켬</button></header>
<main class="paint-layout"><aside class="paint-library"><section class="paint-welcome"><img src="./assets/v13/game.coloring.webp" alt="쪼이가 소방차 그림을 색칠하고 있어요"><div><small>작은 손으로 만드는</small><h2>나만의 색깔 이야기</h2><p>그림을 고르고, 색을 톡!</p></div></section><h2 class="paint-section-title">어떤 그림을 칠할까?</h2><div id="sheets" class="paint-sheets" aria-label="색칠 도안 선택"></div></aside>
<section class="paint-workspace" aria-label="색칠하기"><div class="paint-heading"><h2 id="sheet-name">그림을 준비해요</h2><span id="timer">5분 후 트로피</span></div><div class="paint-tools" role="group" aria-label="색칠 도구"><button data-mode="fill" aria-pressed="true">톡 채우기</button><button data-mode="brush" aria-pressed="false">손가락 색칠</button><button data-mode="eraser" aria-pressed="false">지우개</button><button id="undo" disabled aria-label="한 번 되돌리기">되돌리기</button></div><div id="palette" class="paint-palette" role="group" aria-label="색 고르기"></div><label class="paint-width">붓 크기 <input id="width" type="range" min="8" max="64" value="32"><span id="width-label">보통</span></label>
<div class="paint-paper"><canvas id="paper" width="768" height="768" tabindex="0" role="img" aria-label="색칠 그림. 방향키로 부분을 고르고 Enter 키로 색칠할 수도 있어요."></canvas><span id="loading">그림을 펼치고 있어요…</span></div><p id="status" class="paint-status" role="status">칠하고 싶은 부분을 톡 눌러요. 선은 그대로 지켜줄게요.</p><div class="paint-keyboard"><button id="next-region">다음 부분 고르기</button><button id="fill-region">고른 부분 색칠</button></div><div class="paint-actions"><button id="reset">다시 색칠</button><button id="gallery">내 작품 보기</button><button id="save" class="paint-primary">내 작품 완성</button></div><p class="paint-foot">그림은 이 기기에만 저장돼요. 방향키와 Enter 키로도 칠할 수 있어요.</p></section></main>
<dialog id="reset-dialog"><h2>이 그림을 새로 칠할까요?</h2><p>저장한 작품은 작품방에 남아 있어요.</p><div class="paint-dialog-actions"><button data-close="reset-dialog">계속 색칠</button><button id="confirm-reset">새로 칠하기</button></div></dialog>
<dialog id="gallery-dialog"><h2>나의 작은 전시회</h2><p>내가 만든 색깔 이야기를 만나 봐요.</p><div id="gallery-items" class="paint-gallery"></div><button data-close="gallery-dialog">색칠공방으로</button></dialog>
<dialog id="trophy-dialog"><img class="paint-trophy-art" src="./joyi-celebrate.svg" alt="축하하는 쪼이"><h2>5분 색칠 예술가!</h2><p>차근차근 칠한 네 그림이 정말 멋져!</p><div class="paint-dialog-actions"><button id="trophy-gallery">작품 보기</button><button id="new-session">새 색칠 시작</button><a href="./requests.html">다른 놀이</a></div></dialog>
<script src="./coloring-data.js?v=13.2-coloring"></script><script src="./coloring.js?v=13.2-coloring"></script><script>if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});</script></body></html>
